<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Negocio360 — Sin conexión</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #0f0f14;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #e8e8ee;
  }
  .caja {
    text-align: center;
    max-width: 420px;
    padding: 40px;
  }
  .icono { font-size: 52px; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 14px; color: #9a9aa8; line-height: 1.5; margin-bottom: 26px; }
  button {
    background: #6C63FF; color: #fff; border: none; border-radius: 10px;
    padding: 12px 28px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #5850e0; }
</style>
</head>
<body>
  <div class="caja">
    <div class="icono">📡</div>
    <h1>Sin conexión a internet</h1>
    <p>Negocio360 necesita conexión a internet para funcionar. Revisa tu conexión e intenta de nuevo.</p>
    <button onclick="location.href='https://negocio360oficial.com/'">Reintentar</button>
  </div>
</body>
</html>
