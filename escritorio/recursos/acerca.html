<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Acerca de Negocio360</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(160deg, #0b0e1a 0%, #10142a 100%);
    color: #dcdce6;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .caja { padding: 40px; }
  img { width: 76px; height: 76px; margin-bottom: 16px; filter: drop-shadow(0 6px 20px rgba(43,92,255,0.4)); }
  h1 { font-size: 19px; color: #f2f4ff; font-weight: 700; }
  .version { font-size: 12px; color: #7b83a8; margin-top: 4px; margin-bottom: 20px; }
  p { font-size: 12.5px; color: #9a9eb8; line-height: 1.6; max-width: 300px; margin: 0 auto; }
  .enlaces { margin-top: 22px; display: flex; gap: 18px; justify-content: center; }
  a { color: #7b93ff; font-size: 12.5px; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .copy { margin-top: 26px; font-size: 11px; color: #4d516b; }
</style>
</head>
<body>
  <div class="caja">
    <img src="assets/logo.png">
    <h1>Negocio360</h1>
    <div class="version" id="version">Versión de escritorio</div>
    <p>La plataforma todo en uno para gestionar inventario, ventas, clientes, gastos y finanzas de tu negocio, desde la nube. Las ventas siguen funcionando sin internet.</p>
    <div class="enlaces">
      <a href="https://negocio360oficial.com" target="_blank">Sitio web</a>
      <a href="https://wa.me/50512345678" target="_blank">Soporte</a>
    </div>
    <div class="copy">© 2026 Negocio360. Managua, Nicaragua.</div>
  </div>
  <script>
    const v = new URLSearchParams(location.search).get('v');
    if (v && /^[0-9A-Za-z.\-]{1,40}$/.test(v)) document.getElementById('version').textContent = 'Versión de escritorio ' + v;
  </script>
</body>
</html>
