<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión — Catálogo360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f5f4f0; --bg-card: #ffffff; --bg-input: #f9f8f5; --border: #e4e2db; --border-focus: #5a5af4;
  --text-primary: #111010; --text-secondary: #6b6860; --text-muted: #a09e99;
  --accent: #5a5af4; --accent-hover: #4747d1;
  --danger: #dc2626; --danger-bg: #fef2f2; --danger-border: #fecaca;
  --shadow-card: 0 4px 24px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
  --shadow-focus: 0 0 0 3px rgba(90,90,244,.18);
  --radius: 14px; --radius-sm: 8px;
  --font-display: 'Sora', sans-serif; --font-body: 'DM Sans', sans-serif;
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.card { width: 100%; max-width: 400px; background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 40px 36px; }
.marca { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
.marca-badge { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.marca-nombre { font-family: var(--font-display); font-weight: 800; font-size: 19px; }
h1 { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-align: center; margin: 18px 0 4px; }
.sub { text-align: center; color: var(--text-secondary); font-size: 13.5px; margin: 0 0 26px; }
.form-group { margin-bottom: 15px; }
label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
input { width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-input); font-family: var(--font-body); font-size: 14px; color: var(--text-primary); transition: border-color var(--transition), box-shadow var(--transition); }
input:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--shadow-focus); background: #fff; }
.btn-primary { width: 100%; padding: 13px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 14.5px; cursor: pointer; transition: background var(--transition); margin-top: 6px; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: .6; cursor: default; }
.error-box { display: none; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); font-size: 13px; padding: 10px 13px; border-radius: var(--radius-sm); margin-bottom: 16px; }
.pie { text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 22px; }
.pie a { color: var(--accent); font-weight: 600; text-decoration: none; }
.volver { display: block; text-align: center; font-size: 12.5px; color: var(--text-muted); margin-top: 14px; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="marca">
    <div class="marca-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21V12h6v9"/></svg>
    </div>
    <span class="marca-nombre">Catálogo360</span>
  </div>
  <h1>Bienvenido de vuelta</h1>
  <p class="sub">Entra para administrar tu catálogo.</p>

  <div class="error-box" id="error-box"></div>

  <form id="form-login">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Tu contraseña" required />
    </div>
    <button type="submit" class="btn-primary" id="btn-login">Iniciar sesión</button>
  </form>

  <p class="pie">¿No tienes cuenta? <a href="catalogo360-registro.html">Regístrate</a></p>
  <a href="index.html" class="volver">← Volver al inicio</a>
</div>

<script>
const sb = window.supabase.createClient('https://zvlincmqmmoclqhykejv.supabase.co', 'sb_publishable_RY59EmL8V2zRkOQg7RUJAw_dw6yr69t');

function mostrarError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}
function ocultarError() {
  document.getElementById('error-box').style.display = 'none';
}
function traducirError(msg) {
  if (/invalid login credentials/i.test(msg)) return 'Correo o contraseña incorrectos.';
  if (/email not confirmed/i.test(msg)) return 'Confirma tu correo antes de iniciar sesión.';
  return 'No se pudo iniciar sesión. Intenta de nuevo.';
}

// Si ya hay sesión activa, no hace falta pasar por aquí de nuevo.
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) window.location.href = 'catalogo360.html';
})();

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  ocultarError();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { mostrarError('Completa correo y contraseña.'); return; }

  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Entrando…';

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    if (!data?.user) throw new Error('No se pudo iniciar sesión.');
    window.location.href = 'catalogo360.html';
  } catch (err) {
    console.error('Login Catálogo360:', err);
    mostrarError(traducirError(err.message || ''));
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
  }
});
</script>
</body>
</html>
