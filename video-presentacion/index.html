<!doctype html>
<html><head><meta charset="utf-8"><title>Negocio360 Video</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, CX = 960, CY = 540;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Inter Display","Inter","Noto Color Emoji",sans-serif';
const EMO = '"Noto Color Emoji"';
const BLUE = '#2563EB', BLUE2 = '#3B82F6', BLUE3 = '#60A5FA', NAVY = '#040714', PINK = '#EC4899';

// ---------- assets ----------
const IMGS = {};
function loadImg(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMGS[k] = i; r(); }; i.src = src; }); }
const PIECE_DIR = [[392.4, 327.3], [174.6, 381.4], [118.4, 173.9], [330.0, 119.2]].map(([x, y]) => {
  const dx = x - 256, dy = y - 256, l = Math.hypot(dx, dy); return [dx / l, dy / l];
});
window.ready = Promise.all([
  ...[0, 1, 2, 3].map(i => loadImg('p' + i, `piece${i}.png`)),
  loadImg('word', 'wordmark.png'), loadImg('wordD', 'wordmark_dark.png'),
  document.fonts.load(`800 40px "Inter Display"`), document.fonts.load(`400 40px "Inter Display"`),
  document.fonts.load(`600 40px "Inter Display"`), document.fonts.load(`40px "Noto Color Emoji"`),
]);

// ---------- audio ----------
let AUD = { fps: 30, bass: [0], full: [0] };
window.setAudio = a => { AUD = a; };
function sampleA(arr, t) { const f = t * AUD.fps, i = Math.floor(f); if (i < 0 || i >= arr.length - 1) return 0; return arr[i] + (arr[i + 1] - arr[i]) * (f - i); }
const bassAt = t => sampleA(AUD.bass, t), fullAt = t => sampleA(AUD.full, t);
const T0 = 0.1, BEAT = 0.5, BAR = 2;
const DROPS = [[0.1, 96.1], [168.1, 264.1], [312.1, 408.1]];
const inDrop = t => DROPS.some(([a, b]) => t >= a && t < b);
function kickAt(t) { // decaying envelope on each beat, gated by the real bass energy
  const ph = (t - T0) / BEAT; if (ph < 0) return 0;
  const fr = ph - Math.floor(ph);
  return Math.exp(-fr * 7) * Math.min(1, bassAt(t - fr * BEAT + 0.03) * 1.6);
}

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (u, a, d) => clamp((u - a) / d);
const eOut = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const eExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const fmt = n => Math.round(n).toLocaleString('en-US');

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 700} ${o.size || 48}px ${o.family || FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.letter) ctx.letterSpacing = o.letter + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowB || 30; }
  if (o.grad) { const m = ctx.measureText(s).width; const g = ctx.createLinearGradient(x - (o.align === 'left' ? 0 : m / 2), 0, x + m / (o.align === 'left' ? 1 : 2), 0); o.grad.forEach((c, i) => g.addColorStop(i / (o.grad.length - 1), c)); ctx.fillStyle = g; }
  else ctx.fillStyle = o.color || '#fff';
  ctx.fillText(s, x, y); ctx.restore();
}
function measure(s, size, weight = 700) { ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; const w = ctx.measureText(s).width; ctx.restore(); return w; }
// words slide up one after another
function revealWords(s, x, y, u, o = {}) {
  const words = s.split(' '), size = o.size || 60, sp = size * 0.28;
  const ws = words.map(w => measure(w, size, o.weight || 700));
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = o.align === 'left' ? x : x - total / 2;
  words.forEach((w, i) => {
    const k = eOut(prog(u, (o.delay || 0) + i * (o.stagger ?? 0.08), o.dur || 0.5));
    const col = (o.colors && o.colors[i]) || o.color;
    text(w, cx, y + (1 - k) * size * 0.6, { ...o, color: col, align: 'left', alpha: k * (o.alpha ?? 1) });
    cx += ws[i] + sp;
  });
}

// ---------- logo ----------
function drawIso(cx, cy, size, rot = 0, spread = 0, o = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  if (o.glow) { ctx.shadowColor = o.glowColor || 'rgba(59,130,246,0.9)'; ctx.shadowBlur = o.glow; }
  for (let i = 0; i < 4; i++) {
    const pa = o.pieces ? o.pieces[i] : null;
    ctx.save();
    const d = PIECE_DIR[i];
    let ox = d[0] * spread, oy = d[1] * spread, pr = 0, ps = 1, al = 1;
    if (pa) { ox += pa.x; oy += pa.y; pr = pa.r; ps = pa.s; al = pa.a; }
    ctx.globalAlpha *= al;
    ctx.translate(ox + d[0] * size * 0.2, oy + d[1] * size * 0.2); ctx.rotate(pr); ctx.scale(ps, ps);
    ctx.translate(-d[0] * size * 0.2, -d[1] * size * 0.2);
    const img = IMGS[(o.pink ? 'r' : 'p') + i];
    if (o.pinkMix && o.pinkMix > 0 && o.pinkMix < 1) {
      ctx.drawImage(IMGS['p' + i], -size / 2, -size / 2, size, size);
      ctx.globalAlpha *= o.pinkMix; ctx.drawImage(IMGS['r' + i], -size / 2, -size / 2, size, size);
    } else ctx.drawImage(o.pinkMix >= 1 ? IMGS['r' + i] : img, -size / 2, -size / 2, size, size);
    ctx.restore();
  }
  ctx.restore();
}
const WORD_AR = 1357 / 211;
let LIGHT = false;
const ink = () => LIGHT ? '#0B1736' : '#fff', muted = () => LIGHT ? '#52607A' : '#A5B4CF', accent = () => LIGHT ? BLUE : BLUE3;
function drawWord(x, y, h, reveal = 1, alpha = 1) { // x = left, y = center
  const w = h * WORD_AR; ctx.save(); ctx.globalAlpha *= alpha;
  ctx.beginPath(); ctx.rect(x - 10, y - h, (w + 20) * reveal, h * 2); ctx.clip();
  ctx.drawImage(LIGHT ? IMGS.wordD : IMGS.word, x, y - h / 2, w, h); ctx.restore();
}
function lockup(cx, cy, h, o = {}) { // whole horizontal logo, centered
  const iso = h * 1.9, gap = h * 0.45, ww = h * WORD_AR, tot = iso + gap + ww, left = cx - tot / 2;
  drawIso(left + iso / 2, cy, iso, o.rot || 0, o.spread || 0, { glow: o.glow });
  drawWord(left + iso + gap, cy + h * 0.02, h, o.reveal ?? 1, o.alpha ?? 1);
}

// ---------- background ----------
function background(t, mode) {
  const b = bassAt(t), k = kickAt(t);
  ctx.fillStyle = NAVY; ctx.fillRect(0, 0, W, H);
  const glows = [[0.3 + 0.12 * Math.sin(t * 0.13), 0.35 + 0.1 * Math.cos(t * 0.11), '37,99,235', 0.38],
                 [0.72 + 0.1 * Math.cos(t * 0.09), 0.7 + 0.1 * Math.sin(t * 0.17), '79,70,229', 0.28],
                 [0.5 + 0.3 * Math.sin(t * 0.05), 0.1, '14,165,233', 0.14]];
  for (const [gx, gy, c, a] of glows) {
    const g = ctx.createRadialGradient(gx * W, gy * H, 0, gx * W, gy * H, 900);
    g.addColorStop(0, `rgba(${c},${a + 0.12 * b})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  // perspective floor grid (fades in toward the viewer, no hard horizon edge)
  const hy = 700, ga = (mode === 'loop' ? 0.10 : 0.16) + 0.1 * k;
  ctx.save(); ctx.lineWidth = 1.2;
  const vg = ctx.createLinearGradient(0, hy, 0, H); vg.addColorStop(0, 'rgba(59,130,246,0)'); vg.addColorStop(1, `rgba(59,130,246,${ga})`);
  ctx.strokeStyle = vg;
  for (let i = -14; i <= 14; i++) { ctx.beginPath(); ctx.moveTo(CX + i * 40, hy); ctx.lineTo(CX + i * 260, H + 40); ctx.stroke(); }
  const sp = (t * 0.45) % 1;
  for (let j = 0; j < 12; j++) { const z = (j + sp) / 12, y = hy + Math.pow(z, 2.2) * (H - hy + 60); ctx.strokeStyle = `rgba(59,130,246,${ga * z * z})`; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // particles
  for (let i = 0; i < 140; i++) {
    const sp = 8 + rnd(i) * 30, x = (rnd(i + 7) * W + Math.sin(t * 0.3 + i) * 30), y = ((rnd(i + 3) * H - t * sp) % H + H) % H;
    const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * (0.5 + rnd(i + 9)) + i));
    ctx.globalAlpha = (0.15 + 0.5 * rnd(i + 1)) * tw * (0.7 + 0.6 * b);
    ctx.fillStyle = i % 5 === 0 ? '#93C5FD' : '#fff';
    ctx.beginPath(); ctx.arc(x, y, 0.8 + rnd(i + 5) * 2.2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function backgroundLight(t) {
  const b = bassAt(t), k = kickAt(t);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  const glows = [[0.25 + 0.1 * Math.sin(t * 0.13), 0.3, '37,99,235', 0.10], [0.78 + 0.08 * Math.cos(t * 0.1), 0.75, '59,130,246', 0.09]];
  for (const [gx, gy, c, a] of glows) { const g = ctx.createRadialGradient(gx * W, gy * H, 0, gx * W, gy * H, 950); g.addColorStop(0, `rgba(${c},${a + 0.04 * b})`); g.addColorStop(1, `rgba(${c},0)`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  // dot grid
  ctx.fillStyle = 'rgba(37,99,235,0.13)';
  const off = (t * 6) % 48;
  for (let y = -48; y < H + 48; y += 48) for (let x = -48; x < W + 48; x += 48) { ctx.beginPath(); ctx.arc(x + off, y + off * 0.5, 1.6, 0, 7); ctx.fill(); }
  for (let i = 0; i < 60; i++) {
    const sp = 6 + rnd(i) * 20, x = rnd(i + 7) * W + Math.sin(t * 0.3 + i) * 30, y = ((rnd(i + 3) * H - t * sp) % H + H) % H;
    ctx.globalAlpha = (0.15 + 0.35 * rnd(i + 1)) * (0.6 + 0.6 * b); ctx.fillStyle = i % 3 ? '#93C5FD' : BLUE2;
    ctx.beginPath(); ctx.arc(x, y, 1.2 + rnd(i + 5) * 2.5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function vignette() {
  const g = ctx.createRadialGradient(CX, CY, 500, CX, CY, 1200);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function cornerLogo(t, a = 1) {
  ctx.save(); ctx.globalAlpha = 0.85 * a;
  const k = kickAt(t);
  drawIso(1745, 1010, 50 * (1 + 0.06 * k), Math.floor((t - T0) / 8) * Math.PI / 2 + eInOut(prog(((t - T0) % 8), 7, 1)) * Math.PI / 2);
  drawWord(1778, 1012, 22);
  ctx.restore();
}
function eyebrow(s, x, y, a = 1, align = 'center') {
  const w = measure(s.toUpperCase(), 22, 700) + s.length * 4 + 44;
  const lx = align === 'center' ? x - w / 2 : x;
  ctx.save(); ctx.globalAlpha = a;
  rr(lx, y - 22, w, 44, 22); ctx.fillStyle = 'rgba(37,99,235,0.18)'; ctx.fill(); ctx.strokeStyle = 'rgba(96,165,250,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
  text(s.toUpperCase(), lx + w / 2, y + 1, { size: 22, weight: 700, color: '#93C5FD', letter: 4, alpha: a });
}
function card(x, y, w, h, r = 28, o = {}) {
  ctx.save();
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowB || 40; }
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, o.top || 'rgba(30,41,82,0.85)'); g.addColorStop(1, o.bot || 'rgba(12,18,44,0.85)');
  ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = o.stroke || 'rgba(96,165,250,0.35)'; ctx.lineWidth = o.lw || 1.5; ctx.stroke(); ctx.restore();
}
function emoji(e, x, y, size, a = 1) { text(e, x, y, { size, family: EMO, weight: 400, alpha: a }); }

// =================== SCENES ===================
function sIntro(u, D, t) {
  const k = kickAt(t);
  // shockwave rings
  for (let i = 0; i < 3; i++) {
    const p = prog(u, 2.1 + i * 0.18, 1.6); if (p > 0 && p < 1) {
      ctx.save(); ctx.globalAlpha = (1 - p) * 0.8; ctx.strokeStyle = i ? BLUE3 : (LIGHT ? BLUE : '#fff'); ctx.lineWidth = 6 * (1 - p) + 1;
      ctx.beginPath(); ctx.arc(CX, 450, 140 + eOut(p) * 900, 0, 7); ctx.stroke(); ctx.restore();
    }
  }
  const pieces = [0, 1, 2, 3].map(i => {
    const p = eBack(prog(u, 0.25 + i * 0.5, 0.9)), d = PIECE_DIR[i];
    return { x: d[0] * 900 * (1 - p), y: d[1] * 900 * (1 - p), r: (i % 2 ? 1 : -1) * Math.PI * 1.2 * (1 - p), s: lerp(0.3, 1, clamp(p, 0, 1.2)), a: clamp(prog(u, 0.25 + i * 0.5, 0.3)) };
  });
  // move to lockup
  const m = eInOut(prog(u, 3.4, 1.4));
  const h = 125, iso = h * 1.9, gap = h * 0.45, tot = iso + gap + h * WORD_AR, left = CX - tot / 2;
  const isoX = lerp(CX, left + iso / 2, m), isoY = lerp(450, 430, m), isoS = lerp(380, iso, m);
  const rot = eInOut(prog(u, 2.2, 1.2)) * Math.PI / 2 + Math.max(0, Math.floor((u - 8) / 4)) * Math.PI / 2 + eInOut(prog((u - 8) % 4, 3.2, 0.8)) * Math.PI / 2 * (u > 8);
  drawIso(isoX, isoY, isoS * (1 + 0.05 * k * m), rot, 0, { pieces, glow: LIGHT ? 20 + 25 * k : 30 + 40 * k, glowColor: LIGHT ? 'rgba(37,99,235,0.35)' : undefined });
  drawWord(left + iso + gap, 433, h, eOut(prog(u, 4.2, 1.2)));
  // light sweep across wordmark
  const sw = prog(u, 5.3, 0.9);
  if (sw > 0 && sw < 1) { ctx.save(); if (!LIGHT) ctx.globalCompositeOperation = 'lighter'; else ctx.globalAlpha = 0.5; const sx = lerp(left, left + tot, sw); const g = ctx.createLinearGradient(sx - 120, 0, sx + 120, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(147,197,253,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(sx - 120, 300, 240, 260); ctx.restore(); }
  // tagline one phrase per beat-bar
  const phr = [['Controla tu negocio.', 6.1, ink()], ['Vende más.', 7.1, ink()], ['Gana más.', 8.1, accent()]];
  const sizes = phr.map(p => measure(p[0], 64, 800)); const totW = sizes.reduce((a, b) => a + b) + 2 * 28; let x = CX - totW / 2;
  phr.forEach(([s, at, c], i) => {
    const p = eOut(prog(u, at, 0.45));
    ctx.save(); ctx.translate(x + sizes[i] / 2, 690); ctx.scale(lerp(1.4, 1, p), lerp(1.4, 1, p));
    text(s, 0, 0, { size: 64, weight: 800, color: c, alpha: p, glow: i === 2 && !LIGHT ? 'rgba(59,130,246,0.8)' : null });
    ctx.restore(); x += sizes[i] + 28;
  });
  const sub = eOut(prog(u, 9.6, 0.8));
  text('Plataforma todo en uno para administrar tu negocio', CX, 790, { size: 32, weight: 400, color: muted(), alpha: sub });
  const ln = eOut(prog(u, 9.4, 1)); ctx.save(); ctx.globalAlpha = 0.7; ctx.strokeStyle = BLUE2; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(CX - 260 * ln, 610); ctx.lineTo(CX + 260 * ln, 610); ctx.stroke(); ctx.restore();
}

const MODULES = [['📦', 'Inventario'], ['💰', 'Ventas y Caja'], ['👥', 'Clientes y Fiados'], ['📊', 'Finanzas y Gastos'], ['📈', 'Reportes'], ['🤖', 'IA Empresarial'], ['🏬', 'Sucursales'], ['🔐', 'Roles y Permisos']];
function sModules(u, D, t) {
  const k = kickAt(t);
  eyebrow('Todo en uno', CX, 110, eOut(prog(u, 0.1, 0.5)));
  revealWords('Todo tu negocio. Una sola plataforma.', CX, 185, u, { size: 66, weight: 800, delay: 0.2, colors: [0, 0, 0, BLUE3, BLUE3, BLUE3] });
  const cy = 600, rx = 640, ry = 290, base = u * 0.12;
  const pos = MODULES.map((m, i) => { const a = base + i / MODULES.length * Math.PI * 2 - Math.PI / 2; return [CX + Math.cos(a) * rx, cy + Math.sin(a) * ry, Math.sin(a)]; });
  // connections
  pos.forEach(([x, y], i) => {
    const p = eOut(prog(u, 1 + i * 0.5, 0.5)); if (!p) return;
    ctx.save(); ctx.globalAlpha = 0.35 * p; ctx.strokeStyle = BLUE3; ctx.setLineDash([6, 10]); ctx.lineDashOffset = -u * 40; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(CX, cy); ctx.lineTo(lerp(CX, x, p), lerp(cy, y, p)); ctx.stroke(); ctx.restore();
    const d = ((u * 0.6 + i * 0.37) % 1); ctx.save(); ctx.globalAlpha = p * (1 - d); ctx.fillStyle = '#BFDBFE'; ctx.beginPath(); ctx.arc(lerp(CX, x, d), lerp(cy, y, d), 4, 0, 7); ctx.fill(); ctx.restore();
  });
  // center
  ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = BLUE2; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(CX, cy, 175 + 20 * k, 0, 7); ctx.stroke(); ctx.globalAlpha = 0.2; ctx.beginPath(); ctx.arc(CX, cy, 215 + 30 * k, 0, 7); ctx.stroke(); ctx.restore();
  drawIso(CX, cy, 230 * (1 + 0.06 * k) * eBack(prog(u, 0.3, 0.8)), u * 0.5, 6 * k, { glow: 40 + 40 * k });
  // bubbles, back ones first
  pos.map((p, i) => [p, i]).sort((a, b) => a[0][2] - b[0][2]).forEach(([[x, y, z], i]) => {
    const p = eBack(prog(u, 1 + i * 0.5, 0.6)); if (p <= 0) return;
    const sc = p * (0.85 + 0.15 * (z + 1) / 2), [e, l] = MODULES[i], w = measure(l, 30, 700) + 120;
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    card(-w / 2, -42, w, 84, 42, { glow: 'rgba(37,99,235,0.5)', glowB: 25 });
    emoji(e, -w / 2 + 48, 2, 38); text(l, -w / 2 + 84, 2, { size: 30, weight: 700, align: 'left' });
    ctx.restore();
  });
}

const FEAT_SETS = [
  [['📦', 'Inventario inteligente', 'Stock en tiempo real y alertas automáticas de productos bajos.'],
   ['💰', 'Ventas en segundos', 'Múltiples métodos de pago, facturas automáticas y corte de caja diario.'],
   ['👥', 'Clientes y fiados', 'Tu cartera de clientes, cuentas por cobrar e historial de compras.'],
   ['📈', 'Reportes avanzados', 'Ventas, ganancias y gastos: diarios, semanales, mensuales y anuales.']],
  [['🏬', 'Multi-sucursal', 'Controla todas tus sucursales y bodegas desde un solo lugar.'],
   ['🧾', 'Cotizaciones y proformas', 'Documentos profesionales con tu logo, listos para enviar.'],
   ['🚚', 'Delivery y rutas', 'Pedidos, conductores y entregas bajo control.'],
   ['📊', 'Finanzas y gastos', 'Gastos, salarios e ingresos: tu flujo de caja mes a mes.']],
];
function sFeatures(u, D, t, set = 0) {
  const k = kickAt(t), items = FEAT_SETS[set], i = Math.min(3, Math.floor(u / 4)), lu = u - i * 4;
  const inP = eExpo(prog(lu, 0, 0.6)), outP = i < 3 ? Math.pow(prog(lu, 3.6, 0.4), 2) : 0;
  const [e, ttl, desc] = items[i];
  const off = (1 - inP) * 900 - outP * 1100;
  // index counter
  text(`0${i + 1}`, 250 + off * 0.3, 260, { size: 34, weight: 700, color: BLUE3, align: 'left', alpha: inP * (1 - outP), letter: 4 });
  ctx.save(); ctx.globalAlpha = inP * (1 - outP);
  for (let j = 0; j < 4; j++) { ctx.fillStyle = j === i ? BLUE3 : 'rgba(148,163,184,0.35)'; rr(320 + j * 46 + off * 0.3, 254, j === i ? 34 : 18, 10, 5); ctx.fill(); }
  ctx.restore();
  // icon circle
  const ix = 560 + off * 0.6, iy = 600, rad = 190 * (1 + 0.04 * k);
  ctx.save(); ctx.globalAlpha = inP * (1 - outP);
  const g = ctx.createRadialGradient(ix, iy, 0, ix, iy, rad * 1.6); g.addColorStop(0, 'rgba(59,130,246,0.55)'); g.addColorStop(1, 'rgba(59,130,246,0)');
  ctx.fillStyle = g; ctx.fillRect(ix - rad * 2, iy - rad * 2, rad * 4, rad * 4);
  ctx.strokeStyle = 'rgba(147,197,253,0.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ix, iy, rad, 0, 7); ctx.stroke();
  ctx.setLineDash([4, 14]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ix, iy, rad + 40, u * 0.6, u * 0.6 + 6.28); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.translate(ix, iy); ctx.rotate((1 - inP) * -0.6); ctx.scale(1 + 0.08 * k, 1 + 0.08 * k); emoji(e, 0, 10, 170, inP * (1 - outP)); ctx.restore();
  // text
