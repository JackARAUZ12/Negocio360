<body>

 <div id="cam">
  <div class="bgl" id="bgW"></div><div class="bgl" id="bgB"></div><div class="bgl" id="bgT"></div>

 </div>

 <div id="streak"></div><div id="flash"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = cl(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const env = (t, a, b, fi = .35, fo = .3) => Math.min(ease(p(t, a, a + fi)), 1 - ease(p(t, b, b + fo)));
const DUR = 68.36;
const L = $('layers');
const mk = (cls, html = '', css = '', id) => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; d.style.cssText = css; if (id) d.id = id; L.appendChild(d); return d; };
const S = { pops: [], whoosh: [], impact: [], tick: [], swish: [], rise: [], keys: [], cash: [], confirm: [], stamp: [], sparkle: [], glitch: [], scribble: [], alarm: [], wa: [], click: [] };
const FLASH = [], SHAKE = [], MOOD = [[0, 'W']];
const LINES = [];
function line(y, size, a0, a1, out, words, opts = {}) {
  const el = mk('line', '', `top:${y}px;font-size:${size}px`); const ws = words.map(w => Array.isArray(w) ? w : [w, '']);
  const tot = ws.reduce((s, w) => s + w[0].length + 1, 0); let acc = 0;
  const W = ws.map(([tx, cls, tt]) => { const t = tt != null ? tt : a0 + (a1 - a0) * acc / tot; acc += tx.length + 1; const s = document.createElement('span'); s.className = 'w ' + (cls || ''); s.textContent = tx; el.appendChild(s); if (!opts.quiet) S.pops.push(t); return { s, t }; });
  LINES.push({ el, W, out, big: size >= 110 }); return el;
}
// generic animated elements: {el,a,b,kind,...}
const ITEMS = [];
function item(el, a, b, o = {}) { ITEMS.push({ el, a, b, o }); return el; }
// phones
const PHONES = [];
function phone(x, y, shots, a, b, o = {}) {
  const el = mk('phone', `<div class="sc">${shots.map(([src]) => `<img src="pul/${src}.jpg" style="opacity:0">`).join('')}</div><div class="nt"></div>`);
  const P = { el, x, y, shots: shots.map(([src, t], i) => ({ img: el.querySelectorAll('img')[i], t })), a, b, o, hls: [] }; PHONES.push(P); S.whoosh.push(a); return P;
}
const SC = 488 / 430; // layout px -> screen px
function phl(P, r, a, b) { const d = document.createElement('div'); d.className = 'hl'; d.style.cssText = `left:${r[0] * SC}px;top:${r[1] * SC}px;width:${r[2] * SC}px;height:${r[3] * SC}px`; P.el.querySelector('.sc').appendChild(d); P.hls.push({ el: d, a, b }); S.tick.push(a); }
const LENSES = [];
function lens(src, r, x, y, w, a, b, tag) { const s = w / r[2]; const el = mk('lens', tag ? `<div class="tag">${tag}</div>` : '', `left:${x}px;top:${y}px;width:${w}px;height:${r[3] * s}px;background-image:url(pul/${src}.jpg);background-size:${430 * s}px auto;background-position:${-r[0] * s}px ${-r[1] * s}px`); LENSES.push({ el, a, b }); S.swish.push(a); return el; }
function chip(html, x, y, a, b, o = {}) { const el = mk('chip', html, `left:${x}px;top:${y}px`); return item(el, a, b, Object.assign({ k: 'pop' }, o)); }
function stamp(txt, x, y, a, b, rot = -8, bg) { const el = mk('stampx', txt, `left:${x}px;top:${y}px` + (bg ? `;background:${bg}` : '')); S.stamp.push(a); SHAKE.push(a); return item(el, a, b, { k: 'stamp', rot }); }

// =============== S1 HOOK 0–3.9 (warm)
FLASH.push(0); SHAKE.push(0.05);
line(330, 92, 0.05, 1.2, 3.85, [['¿Tenés'], ['una'], ['pulpería', 'y']]);
line(450, 72, 1.35, 2.2, 3.85, [['y', 'sm'], ['al', 'sm'], ['final', 'sm'], ['del', 'sm'], ['día', 'sm']]);
line(560, 118, 2.3, 3.2, 3.85, [['no'], ['sabés'], ['cuánto', 'hlw'], ['ganaste?', 'hlw']]);
const HOOK = { a: 0.3, b: 3.85 }; const hookEl = mk('big', '<div style="font-size:150px">💸</div><div id="qnum" style="font-size:190px;letter-spacing:-.04em;text-shadow:0 20px 50px rgba(0,0,0,.25)">C$ ???</div>', 'top:880px'); item(hookEl, HOOK.a, HOOK.b, { k: 'up' });
S.glitch.push(2.9, 3.2);
// =============== S2 PROBLEM 4.0–11.6 (warm)
FLASH.push(3.96);
line(300, 96, 4.02, 4.9, 5.3, [['Vendés'], ['todo'], ['el'], ['día', 'y']]);
const SALES = []; [['+ C$ 22', 160, 720], ['+ C$ 65', 600, 650], ['+ C$ 110', 250, 980], ['+ C$ 38', 680, 930], ['+ C$ 7', 420, 1240], ['+ C$ 78', 150, 1380], ['+ C$ 30', 700, 1300]].forEach(([tx, x, y], i) => { chip(`<i>🧾</i>${tx}`, x, y, 4.15 + i * .14, 5.3, { k: 'pop', float: 1 }); S.pops.push(4.15 + i * .14); });
line(290, 84, 5.43, 6.3, 7.3, [['Anotás'], ['los'], ['fiados', 'y']]);
line(390, 84, 6.4, 7.0, 7.3, [['en'], ['un'], ['cuaderno']]);
const NB = mk('', '<div class="rings">' + '<b></b>'.repeat(9) + '</div><div class="mg"></div>' + Array.from({ length: 11 }, (_, i) => `<div class="rl" style="top:${110 + i * 70}px"></div>`).join('') +
  [['Juan — C$ 150', 0], ['Doña Carmen — C$ 865', 1], ['Luis — C$ ¿310? <s>280</s>', 2], ['María — ¿cuánto era?', 3], ['Pedro — C$ ...', 4], ['¿Quién me debe?', 5]].map(([tx, i]) => `<div class="ent" style="top:${54 + (i + 1) * 70}px">${tx}</div>`).join(''), '', 'nb');
item(NB, 5.5, 7.25, { k: 'nb' }); [5.75, 6.05, 6.35, 6.65, 6.95, 7.1].forEach(t => S.scribble.push(t));
line(300, 84, 7.4, 9.2, 9.55, [['se'], ['te'], ['acaba'], ['el'], ['producto'], ['sin'], ['darte'], ['cuenta', 'y']]);
const SH = mk('', `<div class="card" id="shcard" style="position:relative;opacity:1;padding:44px;display:flex;align-items:center;gap:36px"><div style="font-size:150px">🫙</div><div><div style="font-size:52px;font-weight:900">Aceite (litro)</div><div style="font-size:40px;color:#5B6785;font-weight:700;margin-top:10px">Quedan: <b id="shq" style="color:#E5383B;font-size:64px">4</b></div></div></div>`, '', 'shelf');
item(SH, 7.55, 9.55, { k: 'up' });
stamp('AGOTADO', 330, 1090, 8.85, 9.55, -9);
line(300, 104, 9.68, 10.6, 11.6, [['y'], ['la'], ['plata'], ['nunca'], ['te'], ['cuadra', 'hlw']]);
const CALC = mk('', '<div class="dsp" id="cdsp">C$ 4,969</div><div class="ks">' + ['7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', '.', '=', '+'].map(k => `<b>${k}</b>`).join('') + '</div>', '', 'calc');
item(CALC, 9.75, 11.6, { k: 'up' }); S.glitch.push(10.6, 10.9, 11.2);
stamp('NO CUADRA', 290, 1500, 10.75, 11.6, 7);
// =============== S3 SOLUTION 11.88–14.6 (blue)
FLASH.push(11.82); MOOD.push([11.82, 'B']); S.rise.push(11.0);
line(330, 84, 11.88, 12.2, 14.55, [['Con', 'sm']]);
const LOGO = mk('', '<div class="ic"><img src="pul/iso.png"></div><div class="nm">Negocio<span class="y">360</span></div>', '', 'logo');
S.impact.push(12.05); SHAKE.push(12.05); S.sparkle.push(12.2);
line(1240, 120, 13.63, 13.95, 14.55, [['eso'], ['se'], ['acaba', 'hlw']]); SHAKE.push(13.95); S.impact.push(13.95);
const NB2 = mk('', '<div style="font-size:130px">📒</div>', 'position:absolute;left:470px;top:1450px;opacity:0'); item(NB2, 13.65, 14.5, { k: 'cross' });
// =============== S4 SELL 14.75–19.6
FLASH.push(14.7);
line(250, 100, 14.75, 15.6, 19.55, [['Vendés'], ['en'], ['segundos', 'y']]);
line(380, 56, 16.46, 18.7, 19.55, [['Escribís', 'sm'], ['el', 'sm'], ['nombre', 'sm'], ['del', 'sm'], ['producto,', 'sm'], ['lo', 'sm'], ['agregás', 'sm']], { quiet: 1 });
const P1 = phone(280, 520, [['v_search', 15.0]], 15.0, 19.55);
phl(P1, [26, 479, 378, 36], 16.6, 17.9); S.keys.push(16.6, 16.75, 16.9, 17.05, 17.2);
phl(P1, [26, 518, 380, 60], 18.0, 19.55); S.click.push(18.2);
lens('v_search', [26, 518, 380, 60], 90, 1420, 900, 18.05, 19.55, '✓ Arroz (libra)');
stamp('¡LISTO!', 610, 1160, 18.94, 19.55, -8, '#10B981');
// =============== S5 FRACTIONS 19.76–25.3
FLASH.push(19.7);
line(220, 80, 19.76, 20.9, 25.25, [['¿Te'], ['piden'], ['media', 'y'], ['libra', 'y']]);
line(315, 80, 20.95, 21.5, 25.25, [['de'], ['arroz'], ['o'], ['un'], ['cuarto', 'y']]);
line(410, 80, 21.6, 22.2, 25.25, [['de'], ['queso?']]);
const P2 = phone(280, 520, [['v_frac', 20.0]], 20.0, 25.25);
lens('v_frac', [25, 444, 300, 143], 60, 1180, 600, 21.0, 25.25, '½ libra de arroz');
lens('v_frac', [25, 595, 300, 128], 420, 1470, 600, 22.0, 25.25, '¼ de queso');
chip('<i>✨</i>Por fracción', 600, 820, 22.72, 25.25);
chip('<i>🧮</i>Sin hacer cuentas', 120, 960, 24.14, 25.25);
// =============== S6 FIADOS 25.54–33.2
