<style>

</style></head><body>

<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const ease = x => 1 - Math.pow(1 - cl(x), 3), ex = x => 1 - Math.pow(2, -10 * cl(x)), eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const DUR = 48;

const ST = $('stage');

function phone(x, y, shots, a, b) { // shots: [t, img, scrollCss, scrollTo?, sa?, sb?]

  const P = { el, scr, x, y, shots: sh, a, b }; PHONES.push(P); return P;

function phl(P, r, a, b, scroll = 0) { const h = document.createElement('div'); h.className = 'phl'; h.style.cssText = `left:${r[0] * K - 8}px;top:${(r[1] - scroll) * K - 8}px;width:${r[2] * K + 16}px;height:${r[3] * K + 16}px`; P.scr.appendChild(h); HLS.push({ el: h, a, b }); }
function lens(src, r, scale, x, y, a, b, cap, iw) { // r in css px of capture; scale: lens px per css px
  const w = r[2] * scale, h = r[3] * scale;
  const el = mk('lens', `<div class="im" style="width:${w}px;height:${h}px"><img src="tut/${src}.jpg" style="width:${iw * scale}px;left:${-r[0] * scale}px;top:${-r[1] * scale}px"></div>${cap ? `<div class="cap"><i></i>${cap}</div>` : ''}`, `left:${x}px;top:${y}px;width:${w}px`);
  LENSES.push({ el, a, b }); return el;

function textBlock(a, b, n, eb, lines, sb) {

  TEXTS.push({ a, b, eb: e, hd: h, sb: s }); S.whoosh.push(a - .05);
}
const FEATS = [[8, 5], [13, 5.5], [18.5, 6.5], [25, 5.5], [30.5, 5.5], [36, 5.75]];
// ---------- HOOK 0-4 (dark)

const QS = [['¿Cómo hago una venta?', 120, 760, ''], ['¿Cómo registro un gasto?', 300, 960, 'r'], ['¿Cómo cierro la Caja Chica?', 90, 1160, ''], ['¿Cómo concilio mi banco?', 280, 1360, 'r']];
const BUBS = QS.map(([q, x, y, c], i) => { const e = mk('bub ' + c, q, `left:${x}px;top:${y}px`); return { el: e, t: 1.0 + i * .6 }; });
BUBS.forEach(B => S.pop.push(B.t));
// ---------- REVEAL 4-8 (dark)
const RV = mk('L', `<div style="display:flex;flex-direction:column;align-items:center;text-align:center">
  <div id="cap" style="width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7C8CFF,#4144D8);display:flex;align-items:center;justify-content:center;font-size:150px;box-shadow:0 0 0 22px rgba(124,140,255,.18),0 0 120px rgba(124,140,255,.7)">🎓</div>
  <div class="pill" style="margin-top:70px"><i></i>YA DISPONIBLE</div>

  <div style="font-size:44px;font-weight:700;color:rgba(255,255,255,.82);margin-top:10px">dentro de Negocio360</div></div>`, 'left:0;right:0;top:470px');
S.impact.push(4.0); S.rise.push(2.2); S.pop.push(5.0);
// ---------- F1 menú 8-13
textBlock(8, 13, '01', 'EN TU MENÚ', ['Ya está', 'en tu <em>menú</em>'], 'Entrá a 🎓 Tutoriales desde el celular o la computadora.');
const P1 = phone(204, 620, [[8, 'm_menu', 0]], 8, 13);
phl(P1, M.m_menu.item, 9.4, 13);
lens('m_menu', [M.m_menu.item[0] - 6, M.m_menu.item[1] - 10, M.m_menu.item[2] + 30, M.m_menu.item[3] + 20], 2.6, 380, 1500, 10.9, 13, null, 430);
const TAP1 = { x: 204 + 16 + (M.m_menu.item[0] + 60) * K, y: 620 + 16 + (M.m_menu.item[1] + 21) * K, t: 10.7 };
S.click.push(10.7); S.pop.push(10.9);
// ---------- F2 grid 13-18.5
textBlock(13, 18.5, '02', 'TODOS TUS MÓDULOS', ['Un video para', '<em>cada módulo</em>'], 'Ventas, Productos, Clientes, Compras, Gastos, Caja… y vienen más.');
const P2 = phone(110, 620, [[13, 'm_grid', 150, 150], [13.6, 'm_grid', 150, 760, 13.8, 17.6]], 13, 18.5);
const CHS = [['🛒 Ventas', 14.0], ['📦 Productos', 14.35], ['👥 Clientes', 14.7], ['🧾 Compras', 15.05], ['💸 Gastos', 15.4], ['🏦 Caja', 15.75]];
const CHIPS = CHS.map(([n, t], i) => { const e = mk('chip', n, `left:${i % 2 ? 700 : 640}px;top:${780 + i * 150}px`); S.pop.push(t); return { el: e, t, b: 18.5 }; });
// ---------- F3 player 18.5-25 (monitor)

ITEMS.push({ el: MON, a: 18.5, b: 25, k: 'mon' }); const PLAY = $('play') || mk('', '', ''); PLAY.id = 'play';
lens('d_video', [M.d_video.lista[0] - 6, M.d_video.lista[1] - 6, M.d_video.lista[2] + 12, M.d_video.lista[3] + 12], 1.55, 110, 1520, 22.0, 25, 'Nivel y duración de cada video', 1920);
S.pop.push(19.6, 22.0); S.click.push(19.9);
// ---------- F4 buscar 25-30.5
textBlock(25, 30.5, '04', 'BUSCADOR', ['Buscá lo que', '<em>necesitás</em>'], 'Escribí y encontrá el tutorial al instante.');
const P4 = phone(204, 620, [[25, 'm_grid', 0], [27.4, 'm_search', 0]], 25, 30.5);
const TY = mk('', '', ''); TY.id = 'typed'; P4.scr.appendChild(TY);
const SR = M.m_grid.search; TY.style.cssText += `left:${SR[0] * K}px;top:${SR[1] * K}px;width:${SR[2] * K}px;height:${SR[3] * K}px;border-radius:${14 * K}px`;
phl(P4, M.m_search.res, 27.7, 30.5);
lens('m_search', [M.m_search.res[0] - 4, M.m_search.res[1] + 86, M.m_search.res[2] + 8, 92], 2.2, 90, 1560, 28.0, 30.5, 'Resultado al instante', 430);
[25.9, 26.25, 26.6, 26.95].forEach(t => S.tick.push(t)); S.pop.push(28.0);
// ---------- F5 progreso 30.5-36
textBlock(30.5, 36, '05', 'TU PROGRESO', ['Llevá tu', '<em>progreso</em>'], 'Marcá lo que ya viste y seguí donde te quedaste.');
const P5 = phone(204, 620, [[30.5, 'm_grid', 0], [32.9, 'm_video', 0]], 30.5, 36);
phl(P5, M.m_grid.prog, 31.0, 32.8); phl(P5, M.m_grid.cards[0], 31.4, 32.8);
lens('m_grid', [M.m_grid.prog[0] - 14, M.m_grid.prog[1] - 10, M.m_grid.prog[2] + 28, M.m_grid.prog[3] + 20], 3.0, 300, 1480, 31.2, 32.8, null, 430);
phl(P5, M.m_video.acc, 33.3, 36);
const TAP5 = { x: 204 + 16 + (M.m_video.acc[0] + 70) * K, y: 620 + 16 + (M.m_video.acc[1] + 17) * K, t: 34.2 };
const SEEN = $('seen') || mk('', '✓ Visto', ''); SEEN.id = 'seen'; SEEN.textContent = '✓ Visto';
SEEN.style.left = '640px'; SEEN.style.top = (620 + 16 + (M.m_video.acc[1] - 10) * K) + 'px';
S.pop.push(31.2); S.click.push(34.2); S.chime.push(34.35);
// ---------- F6 desde cada módulo 36-41.75 (monitor)
textBlock(36, 41.75, '06', 'DESDE CADA MÓDULO', ['Un toque y', '<em>directo al video</em>'], 'En cada módulo tenés el botón 🎓 Tutoriales arriba.');
const MON2 = mk('mon', '<div class="scr"><div class="vp"><div class="bgi" id="mbg2"></div><div id="mhl" style="position:absolute;border:5px solid #5B5BF0;border-radius:14px;box-shadow:0 0 0 9999px rgba(14,20,51,.25);opacity:0"></div></div></div><div class="nk"></div><div class="bs"></div>', 'top:700px');
ITEMS.push({ el: MON2, a: 36, b: 41.75, k: 'mon2' });
lens('d_caja', [M.d_caja.btn[0] - 230, M.d_caja.btn[1] - 8, 420, M.d_caja.btn[3] + 16], 1.9, 141, 1500, 37.4, 39.1, 'Botón 🎓 Tutoriales', 1920);
S.click.push(39.0); S.whoosh.push(39.2); S.pop.push(37.4);
// ---------- OUTRO 41.75-48 (dark)
const OUTA = 42;
const OU = mk('L', `<div style="display:flex;flex-direction:column;align-items:center;text-align:center">
  <div style="width:170px;height:170px;border-radius:44px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 90px rgba(124,140,255,.7)"><img src="tut/iso.png" style="width:120px"></div>
  <div style="font-size:60px;font-weight:800;color:#fff;margin-top:36px">Negocio360</div>
  <div style="font-size:132px;font-weight:800;letter-spacing:-4px;margin-top:40px;line-height:1;background:linear-gradient(95deg,#fff,#C9D3FF 60%,#9FF5D2);-webkit-background-clip:text;color:transparent">🎓 Tutoriales</div>
  <div style="font-size:46px;font-weight:700;color:rgba(255,255,255,.85);margin-top:26px">Ya disponibles en tu cuenta</div>
  <div class="pill" style="margin-top:70px"><i></i>Menú → 🎓 Tutoriales</div>
  <div style="font-size:38px;color:rgba(255,255,255,.7);margin-top:60px;font-weight:600">negocio360oficial.com</div></div>`, 'left:0;right:0;top:470px');
S.impact.push(OUTA); S.sweep.push(41.75); S.rise.push(40.0);
$('segs').innerHTML = FEATS.map(() => '<i><b></b></i>').join('');
const WIPES = [3.85, 7.75, 41.75];
window.EVENTS = { DUR, S, WIPES };
// ---------- RENDER
const CLIPN = 105;
window.render = function (t) {
  $('grid').style.transform = `translate(${(t * 18) % 90}px,${(t * 10) % 90}px)`;
  const dark = t < 7.9 || t >= 41.9; $('dark').style.opacity = dark ? 1 : 0;
  $('dark').querySelector('.glow').style.transform = `scale(${1 + .08 * Math.sin(t * 2)})`;
  // hook
  { const k = p(t, .2, .8), ko = p(t, 3.55, 3.85); H1.style.opacity = ease(k) * (1 - ko); H1.style.transform = `translateY(${(1 - ex(k)) * 70}px)`; H1.style.filter = `blur(${(1 - ease(k)) * 12}px)`;
    BUBS.forEach((B, i) => { const kk = p(t, B.t, B.t + .3); B.el.style.opacity = ease(kk) * (1 - ko); B.el.style.transform = `scale(${lerp(.4, 1, ex(kk)) + (kk < 1 ? Math.sin(kk * Math.PI) * .06 : 0)}) translateY(${Math.sin(t * 2 + i) * 6}px)`; B.el.style.display = t < 4 ? '' : 'none'; }); }
  // reveal
  { const vis = t >= 3.9 && t < 8.1; RV.style.display = vis ? '' : 'none';
    if (vis) { const ko = p(t, 7.55, 7.8); const ch = RV.firstElementChild.children;
      [[4.05, 0], [4.9, 1], [5.2, 2], [5.6, 3]].forEach(([a, i]) => { const kk = p(t, a, a + .45); ch[i].style.opacity = ease(kk) * (1 - ko); ch[i].style.transform = `translateY(${(1 - ex(kk)) * 60}px) scale(${i === 0 ? lerp(.3, 1, ex(kk)) * (1 + .03 * Math.sin(t * 3)) : 1})`; ch[i].style.filter = i === 2 ? `blur(${(1 - ease(kk)) * 14}px)` : ''; }); } }
  // texts
  for (const X of TEXTS) { const vis = t >= X.a - .05 && t < X.b + .05; [X.eb, X.hd, X.sb].forEach(e => e.style.display = vis ? '' : 'none'); if (!vis) continue;
    const ko = p(t, X.b - .22, X.b);
    const ke = p(t, X.a, X.a + .35); X.eb.style.opacity = ease(ke) * (1 - ko); X.eb.style.transform = `translateX(${(1 - ex(ke)) * -40}px)`;
    X.hd.querySelectorAll('.ln > span').forEach((s, i) => { const kk = p(t, X.a + .08 + i * .1, X.a + .55 + i * .1); s.style.transform = `translateY(${(1 - ex(kk)) * 110 - ease(ko) * 110}%)`; });
    const ks = p(t, X.a + .35, X.a + .75); X.sb.style.opacity = ease(ks) * (1 - ko); X.sb.style.transform = `translateY(${(1 - ex(ks)) * 24}px)`; }
  // phones
  for (const P of PHONES) { const vis = t >= P.a - .05 && t < P.b + .05; P.el.style.display = vis ? '' : 'none'; if (!vis) continue;
    const k = p(t, P.a, P.a + .6), ko = p(t, P.b - .25, P.b);
    P.el.style.opacity = ease(k) * (1 - ko);
    P.el.style.transform = `perspective(2200px) translate(${(1 - ex(k)) * 380 - ease(ko) * 300}px,${(1 - ex(k)) * 60 + Math.sin(t * 1.3) * 6}px) rotateY(${lerp(-24, -7, ex(k)) + ko * -10}deg) rotateX(${lerp(8, 3, ex(k))}deg) rotateZ(${lerp(4, 1, ex(k))}deg)`;
