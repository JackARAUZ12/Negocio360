<script>
const DUR = 44.75;
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x, c = 1.8) => { x = cl(x); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const p = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
const win = (t, a, b, fi = .3, fo = .3) => Math.min(ease(p(t, a, a + fi)), 1 - ease(p(t, b - fo, b)));
function kw(el, t, a, b, mode = 'up', fi = .35, fo = .3) {
  const o = win(t, a, b, fi, fo); el.style.opacity = o;
  const k = ease(p(t, a, a + fi));
  if (mode === 'up') el.style.transform = `translateY(${(1 - k) * 60}px)`;
  else if (mode === 'zoom') el.style.transform = `scale(${1 + (1 - k) * .5})`;
  el.style.filter = k < 1 ? `blur(${(1 - k) * 12}px)` : 'none';
  return o;
}
// ---------- build product grid (problem)
const PN = [['Aceite Clover 1L', '🫙'], ['Arroz Faisán 1 qq', '🌾'], ['Azúcar fardo', '🍬'], ['Frijol rojo 1 qq', '🫘'], ['Café Presto', '☕'], ['Harina Maseca', '🌽'], ['Jabón Xedex', '🧼'], ['Gaseosa 3L', '🥤'], ['Leche caja 12', '🥛']];
const PC = PN.map(([n, e], i) => { const d = document.createElement('div'); d.className = 'pc'; d.innerHTML = `<div class="n">${n}</div><div class="q">?</div><div class="ic">${e}</div>`; $('pgrid').appendChild(d);
  return { el: d, x: 125 + (i % 3) * 290, y: 760 + Math.floor(i / 3) * 210 }; });
// ---------- chaos items
const CH = [
  ['sticky', 'arroz ¿cuánto quedaba?'], ['file', '<b style="background:#16A34A">XLS</b>precios_final_v3.xlsx'], ['mini', '¿Tenés frijoles?'],
  ['sticky', 'aceite C$78?? preguntar'], ['file', '<b style="background:#DC2626">PDF</b>lista_precios.pdf'], ['mini', '¿Ya llegó el pedido?'],
  ['sticky', 'Juan debe… ¿200?'], ['file', '<b style="background:#2563EB">IMG</b>foto_cuaderno.jpg'], ['mini', 'Precio del café?'],
];
const CI = CH.map(([c, h], i) => { const d = document.createElement('div'); d.className = 'ch ' + c; d.innerHTML = h; $('chaos').appendChild(d);
  const POS = [[70,420],[560,470],[300,640],[640,760],[60,860],[420,980],[110,1150],[560,1190],[300,1350]];
  return { el: d, x: POS[i][0], y: POS[i][1], r: (rnd(i + 3) - .5) * 26, vx: (rnd(i + 11) - .5) * 40, vy: (rnd(i + 13) - .5) * 36, z: 1.05 + rnd(i + 5) * .3 }; });
// ---------- inventory tile cells
(function () { let h = ''; for (let i = 0; i < 12; i++) h += `<div style="height:44px;border-radius:10px;background:${i % 5 === 3 ? 'rgba(245,158,11,.5)' : 'rgba(76,141,255,.35)'}"></div>`; $('t3g').innerHTML = h; })();
// ---------- tower windows
(function () { let h = ''; for (let r = 0; r < 18; r++) for (let c = 0; c < 6; c++) h += `<rect x="${50 + c * 58}" y="${80 + r * 50}" width="36" height="30" rx="4" fill="#26324C"/>`; $('wins').innerHTML = h; })();
// ---------- memory notes
const NT = ['¿Quién me debe?', 'pedir arroz', 'precio aceite??', 'cerrar caja…', 'stock leche?', 'llamar proveedor'];
const NO = NT.map((s, i) => { const d = document.createElement('div'); d.className = 'ch sticky'; d.textContent = s; $('notes').appendChild(d);
  const a = i / NT.length * Math.PI * 2; return { el: d, a, r: 360 + (i % 2) * 70, rot: (rnd(i) - .5) * 24 }; });
// ---------- phone screen config (css px inside a 600-wide screen; image is 600 css wide)
const S = 600 / 600; // screen scale
const SCR = { sDash: [0, 0], sV2: [0, 0], sV4: [0, 0], sProd: [0, 0], sRep: [0, 0] };

window.render = function (t) {
  // ---------- background mood
  const prob = t < 11.7, k5 = p(t, 11.7, 13.2);
  const hueA = prob ? '120,40,60' : '37,99,235', a1 = prob ? .16 + .04 * Math.sin(t * 3) : .30;
  $('bg').style.background = `radial-gradient(900px 900px at ${50 + 22 * Math.sin(t * .35)}% ${32 + 10 * Math.cos(t * .3)}%,rgba(${hueA},${a1}),transparent 62%),radial-gradient(800px 800px at ${30 + 20 * Math.cos(t * .25)}% 88%,rgba(${prob ? '60,70,110' : '34,227,154'},${prob ? .14 : .12}),transparent 60%),#060A14`;
  $('grid').style.transform = `translateY(${(t * 18) % 72}px)`;

  // ================= PROBLEM 0–11.9
  const P = $('P'); P.style.opacity = 1 - ease(p(t, 11.6, 12.4)); P.style.display = t > 12.6 ? 'none' : '';
  if (t < 12.6) {
    $('bigQ').style.opacity = win(t, 0, 2.9, .5, .5); $('bigQ').style.transform = `scale(${1 + t * .03}) rotate(${Math.sin(t * 2) * 3}deg)`;
    // bubble 1: pops at 0.05, tx typing dots first
    const b1 = $('b1'); const k1 = p(t, .05, .45); b1.style.opacity = cl(k1 * 3) * (1 - ease(p(t, 7.9, 8.3)));
    let by = 760, bs = 1.18;
    { const m = eio(p(t, 2.6, 3.2)); by = lerp(760, 230, m); bs = lerp(1.18, .72, m); }
    const shake = t < 1.2 ? Math.sin(t * 60) * 6 * (1 - p(t, .3, 1.2)) : 0;
    b1.style.transform = `translate(${shake - (bs - 1) * 360}px,${by - 430}px) scale(${(.6 + .4 * back(k1)) * bs})`; b1.style.transformOrigin = '0 0';
    $('b1t').innerHTML = t < .55 ? '<span class="dots"><span></span><span></span><span></span></span>' : 'Hola 👋 ¿cuántos te quedan?';
    // product grid 2.9–7.8
    PC.forEach((c, i) => { const a = 2.95 + i * .05, k = p(t, a, a + .35); const out = p(t, 7.85, 8.2);
      c.el.style.opacity = cl(k * 2) * (1 - out) * (t > 6.2 ? .55 + .45 * (1 - p(t, 6.2, 6.5)) : 1);
      c.el.style.left = c.x + 'px'; c.el.style.top = c.y + 'px'; c.el.style.transform = `scale(${.7 + .3 * back(k)})`;
      const visited = t > 3.3 + i * .25; c.el.querySelector('.q').textContent = visited ? (i % 3 === 1 ? '¿?' : '…') : '?'; c.el.querySelector('.q').style.color = visited ? '#F59E0B' : '#5B657A'; });
    const hi = Math.min(8, Math.floor(Math.max(0, t - 3.3) / .25)), hc = PC[hi];
    $('hl').style.opacity = t > 3.3 && t < 7.85 ? (t > 6.2 ? .4 : 1) : 0; $('hl').style.left = (hc.x - 8) + 'px'; $('hl').style.top = (hc.y - 8) + 'px';
    kw($('kTiempo'), t, 4.4, 6.1, 'zoom');
    // bubble 2 at 6.2
    const b2 = $('b2'), k2 = p(t, 6.15, 6.5); b2.style.opacity = cl(k2 * 3) * (1 - ease(p(t, 7.9, 8.3)));
    b2.style.transform = `translateY(${190 + (1 - ease(k2)) * 40}px) scale(${(.6 + .4 * back(k2)) * .8})`; b2.style.transformOrigin = '100% 0';
    // chaos 7.8–11.9
    CI.forEach((c, i) => { const a = 7.85 + i * .07, k = p(t, a, a + .4), dt = Math.max(0, t - a);
      let x = c.x + c.vx * dt + Math.sin(dt * 1.3 + i) * 20, y = c.y + c.vy * dt + Math.cos(dt * 1.1 + i) * 16;
      // suck into center 11.75–12.5
      const s = eio(p(t, 11.75, 12.45)); x = lerp(x, 540 - 120, s); y = lerp(y, 880, s);
      const jit = t > 9.3 && t < 11.6 ? Math.sin(t * 40 + i) * 2.5 : 0;
      c.el.style.opacity = cl(k * 2) * (1 - p(t, 12.2, 12.5));
      c.el.style.transform = `translate(${x + jit}px,${y}px) rotate(${c.r + Math.sin(dt + i) * 4 + s * 120}deg) scale(${c.z * (.6 + .4 * back(k)) * (1 - .8 * s)})`;
      c.el.style.filter = s > 0 ? `blur(${s * 8}px)` : (t < 11.7 ? `saturate(${1 - .4 * p(t, 9, 11)})` : 'none'); });
    const lk = win(t, 8.3, 11.6, .3, .3); const la = (t - 8.3) * 1.6; $('lupa').style.opacity = lk;
