<style>

.c-modal-nombre { font-family:var(--font-display); font-size:22px; font-weight:500; margin-bottom:var(--sp-2); }
.c-modal-desc { font-size:13.5px; color:var(--text-2); line-height:1.6; margin-bottom:var(--sp-4); white-space:pre-wrap; }
@media (min-width:900px) { .c-hero-titulo { max-width:16ch; } }
</style>
</head>
<body>

<div id="c360p-loader" class="c360p-loader">Cargando catálogo…</div>

<div id="c360p-app" style="display:none">

  <div id="c-preview-banner" class="c-preview-banner">👁 Vista previa — esto no es visible al público todavía</div>

  <header class="c-header">
    <div class="c360-container c-header-in">
      <img id="c-header-logo" class="c-header-logo" src="" style="display:none" alt="">
      <span id="c-header-nombre" class="c-header-nombre"></span>
      <nav class="c-header-nav">
        <a onclick="irAInicio()">Inicio</a>
        <a onclick="irACatalogo()">Catálogo</a>
        <a id="c-nav-contacto" href="#" onclick="return false" style="display:none">Contacto</a>
      </nav>
      <button class="c-theme-btn" onclick="toggleTemaPublico()" id="c-theme-btn" aria-label="Cambiar tema">🌙</button>
    </div>
  </header>

  <section class="c-hero" id="c-hero">
    <div class="c-hero-bg" id="c-hero-bg"></div>
    <div class="c-hero-in" id="c-hero-in">
      <div class="c-hero-texto">
        <div class="c-hero-eyebrow">
          <img id="c-hero-logo" src="" style="display:none" alt="">
          <span id="c-hero-marca"></span>
        </div>
        <h1 class="c-hero-titulo" id="c-hero-titulo">Catálogo</h1>
        <p class="c-hero-desc" id="c-hero-desc"></p>
        <div class="c-hero-acciones">
          <div id="c-hero-cta"></div>
          <div class="c-hero-contacto" id="c-hero-contacto"></div>
        </div>
      </div>
      <div class="c-hero-mosaico vacio" id="c-hero-mosaico"></div>
    </div>
  </section>

  <section class="c-seccion-destacado-wrap tinte-a c-reveal" id="c-seccion-destacado" style="display:none">
    <div class="c-destacado" id="c-destacado"></div>
  </section>

  <section class="c-seccion tinte-b c-reveal" id="c-seccion-mas-destacados" style="display:none">
    <div class="c360-container">
      <div class="c-seccion-head"><span class="c-seccion-titulo">Más destacados</span></div>
      <div class="c-grid" id="c-grid-mas-destacados"></div>
    </div>
  </section>

  <div class="c-filtros-barra" id="c-filtros-barra">
    <div class="c360-container c-filtros-in">
      <div class="c-chips" id="c-chips-categorias"></div>
      <div class="c-filtros-derecha">
        <select id="c-orden-select" onchange="cambiarOrden(this.value)">
          <option value="reciente">Más recientes</option>
          <option value="precio_asc">Precio: menor a mayor</option>
          <option value="precio_desc">Precio: mayor a menor</option>
          <option value="nombre">Nombre A-Z</option>
        </select>
        <span class="c-seccion-conteo" id="c-conteo-productos"></span>
      </div>
    </div>
  </div>

  <section class="c-seccion tinte-a c-reveal" id="c-seccion-productos">
    <div class="c360-container">
      <div class="c-grid" id="c-grid-productos"></div>
    </div>
  </section>

  <footer class="c-footer">
    <div class="c360-container c-footer-in">
      <span id="c-footer-nombre"></span>
      <span>Creado con <a href="/" target="_blank">Catálogo360</a></span>
    </div>
  </footer>

  <button class="c-btn-flotante-wa" id="c-btn-flotante-wa" style="display:none" onclick="registrarEvento('click_whatsapp');window.open(c_urlWhatsappHero,'_blank')" aria-label="WhatsApp">💬</button>

</div>

<div class="c-modal-overlay" id="c-modal" onclick="if(event.target===this)cerrarModalProducto()">
  <div class="c-modal">
    <button class="c-modal-close" onclick="cerrarModalProducto()">✕</button>
    <div class="c-modal-fotos" id="c-modal-fotos"></div>
    <div class="c-modal-body">
      <div class="c-modal-cat" id="c-modal-cat" style="display:none"></div>
      <div class="c-modal-nombre" id="c-modal-nombre"></div>
      <div class="c-precio-row" style="margin-bottom:var(--sp-4)">
        <span class="c-precio" id="c-modal-precio"></span>
        <span class="c-precio-tachado" id="c-modal-precio-tachado" style="display:none"></span>
      </div>
      <div class="c-modal-desc" id="c-modal-desc"></div>
      <button class="c-btn" id="c-modal-whatsapp" style="width:100%"></button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zvlincmqmmoclqhykejv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RY59EmL8V2zRkOQg7RUJAw_dw6yr69t';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CATALOGO = null, PRODUCTOS = [], CATEGORIAS = [], CATEGORIA_VISTA_ACTUAL = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtC(n) { return 'C$' + Number(n||0).toLocaleString('es-NI', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function linkWhatsapp(numero, texto) {
  const limpio = (numero||'').replace(/[^\d]/g,'');
  return `https://wa.me/${limpio}?text=${encodeURIComponent(texto)}`;
}
function hexARgb(hex) {
  const limpio = (hex || '#6366f1').replace('#','');
  const bigint = parseInt(limpio.length === 3 ? limpio.split('').map(c=>c+c).join('') : limpio, 16);
  if (isNaN(bigint)) return '99,102,241';
  return `${(bigint>>16)&255},${(bigint>>8)&255},${bigint&255}`;
}

function irAInicio() { window.scrollTo({ top:0, behavior:'smooth' }); }
function irACatalogo() {
  const barra = document.getElementById('c-filtros-barra');
  const destino = barra.style.display !== 'none' ? barra : document.getElementById('c-seccion-productos');
  destino.scrollIntoView({ behavior:'smooth', block:'start' });
}
function toggleTemaPublico() {
  const actual = document.documentElement.getAttribute('data-theme');
  const nuevo = actual === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.setAttribute('data-theme', nuevo);
  document.getElementById('c-theme-btn').textContent = nuevo === 'oscuro' ? '☀' : '🌙';
  localStorage.setItem('c360p_tema', nuevo);
}

function registrarEvento(tipo, productoId) {
  if (CATALOGO && !new URLSearchParams(window.location.search).get('preview')) {
    sb.rpc('catalogo_registrar_evento', { p_catalogo_id: CATALOGO.id, p_tipo_evento: tipo, p_producto_id: productoId || null }).then(()=>{}).catch(()=>{});
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('c');
  const idPreview = params.get('preview');
  if (!slug && !idPreview) { mostrarError('Enlace de catálogo no válido.'); return; }

  let catalogo, error;
  if (idPreview) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user) { mostrarError('Inicia sesión en Negocio360 para ver la vista previa.'); return; }
    ({ data: catalogo, error } = await sb.from('catalogos').select('*').eq('id', idPreview).maybeSingle());
  } else {
    ({ data: catalogo, error } = await sb.from('catalogos').select('*').eq('slug_publico', slug).eq('estado', 'publicado').maybeSingle());
  }
  if (error || !catalogo) { mostrarError('Este catálogo no existe o ya no está disponible.'); return; }
  CATALOGO = catalogo;
  if (idPreview && catalogo.estado !== 'publicado') document.getElementById('c-preview-banner').style.display = 'block';

  document.documentElement.style.setProperty('--accent', catalogo.color_acento || '#6366f1');
  document.documentElement.style.setProperty('--accent-rgb', hexARgb(catalogo.color_acento));

  const temaGuardado = localStorage.getItem('c360p_tema') || catalogo.tema_default || 'claro';
  document.documentElement.setAttribute('data-theme', temaGuardado);
  document.getElementById('c-theme-btn').textContent = temaGuardado === 'oscuro' ? '☀' : '🌙';

  const { data: productos } = await sb.from('catalogo_productos').select('*, catalogo_producto_fotos(*)')
    .eq('catalogo_id', catalogo.id).eq('activo', true).order('orden');
  PRODUCTOS = (productos || []).map(p => ({ ...p, fotos: (p.catalogo_producto_fotos||[]).sort((a,b)=>a.orden-b.orden) }));

  const { data: categorias } = await sb.from('catalogo_categorias').select('*').eq('catalogo_id', catalogo.id).order('orden');
  CATEGORIAS = categorias || [];

  renderTodo();

  if (!idPreview) registrarEvento('visita');

  document.getElementById('c360p-loader').style.display = 'none';
  document.getElementById('c360p-app').style.display = 'block';
  activarRevelado();
}

function mostrarError(msg) {
  document.getElementById('c360p-loader').innerHTML = `<div style="text-align:center"><div style="font-size:28px;margin-bottom:10px">😕</div>${esc(msg)}</div>`;
}

function activarRevelado() {
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.c-reveal').forEach(el => el.classList.add('visible')); return; }
  const obs = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold:.08, rootMargin:'0px 0px -30px 0px' });
  document.querySelectorAll('.c-reveal').forEach(el => obs.observe(el));
}

function renderTodo() {
  renderHeaderYHero();
  renderDestacado();
  renderVistaCategoriasOProductos();
  document.getElementById('c-footer-nombre').textContent = CATALOGO.nombre_comercial || CATALOGO.nombre;
}

function renderHeaderYHero() {
  const c = CATALOGO;
  document.title = c.nombre_comercial || c.nombre;
  document.getElementById('c360p-desc-meta').setAttribute('content', c.descripcion || '');
  document.getElementById('c360p-og-title').setAttribute('content', c.nombre_comercial || c.nombre);
  document.getElementById('c360p-og-desc').setAttribute('content', c.descripcion || '');
  if (c.logo_url) document.getElementById('c360p-og-image').setAttribute('content', c.logo_url);

  document.getElementById('c-header-nombre').textContent = c.nombre_comercial || c.nombre;
  if (c.logo_url) {
    document.getElementById('c-header-logo').src = c.logo_url;
    document.getElementById('c-header-logo').style.display = 'block';
    document.getElementById('c-hero-logo').src = c.logo_url;
    document.getElementById('c-hero-logo').style.display = 'block';
  }
  document.getElementById('c-hero-marca').textContent = c.nombre_comercial || c.nombre;
  document.getElementById('c-hero-titulo').textContent = c.nombre;
  document.getElementById('c-hero-desc').textContent = c.descripcion || '';
  document.getElementById('c-hero-desc').style.display = c.descripcion ? 'block' : 'none';

  const heroEl = document.getElementById('c-hero');
  const heroInEl = document.getElementById('c-hero-in');
  if (c.banner_url) {
    // 1) El dueño subió un banner manual -- se respeta, tiene prioridad.
    heroEl.classList.add('con-imagen');
    const bg = document.getElementById('c-hero-bg');
    bg.style.backgroundImage = `url('${c.banner_url}')`;
    bg.classList.add('activo');
  } else {
    // 2) Sin banner manual -- el sistema arma un mosaico real con las
    // fotos de los propios productos (nunca le pedimos al usuario que
    // diseñe nada). Se priorizan destacados, se evitan fotos repetidas.
    const fotosReales = [];
    const vistos = new Set();
    const ordenados = [...PRODUCTOS].sort((a,b) => (b.destacado?1:0) - (a.destacado?1:0));
    for (const p of ordenados) {
      const foto = p.fotos.find(f => f.es_principal) || p.fotos[0];
      if (foto && !vistos.has(foto.url)) { fotosReales.push(foto.url); vistos.add(foto.url); }
      if (fotosReales.length >= 3) break;
    }
    if (fotosReales.length) {
      const mosaico = document.getElementById('c-hero-mosaico');
      mosaico.classList.remove('vacio');
      mosaico.classList.toggle('una-sola', fotosReales.length === 1);
      mosaico.innerHTML = fotosReales.map(url => `<img src="${esc(url)}" alt="" loading="lazy">`).join('');
    } else {
      document.getElementById('c-hero-mosaico').classList.add('vacio');
      // 3) Todavia no hay ninguna foto de producto -- en vez de un
      // hero vacio, se genera una textura propia con el color del
      // catalogo (nunca un bloque plano sin diseño).
      heroEl.classList.add('c-hero-patron');
    }
  }

  const ctaDiv = document.getElementById('c-hero-cta');
  if (c.whatsapp) {
    window.c_urlWhatsappHero = linkWhatsapp(c.whatsapp, `Hola, vi su catálogo ${esc(c.nombre_comercial||'')} y tengo una consulta.`);
    ctaDiv.innerHTML = `<a class="c-btn" href="${window.c_urlWhatsappHero}" target="_blank" onclick="registrarEvento('click_whatsapp')">💬 Escribir por WhatsApp</a>`;
    document.getElementById('c-btn-flotante-wa').style.display = 'flex';
    const navContacto = document.getElementById('c-nav-contacto');
    navContacto.style.display = 'inline';
    navContacto.href = window.c_urlWhatsappHero;
    navContacto.target = '_blank';
    navContacto.onclick = () => registrarEvento('click_whatsapp');
  } else {
    ctaDiv.innerHTML = '';
  }

  const info = document.getElementById('c-hero-contacto');
  let filas = '';
  if (c.telefono) filas += `<a href="tel:${esc(c.telefono)}" onclick="registrarEvento('click_telefono')">📞 ${esc(c.telefono)}</a>`;
  if (c.email) filas += `<span>✉️ ${esc(c.email)}</span>`;
  if (c.ubicacion) filas += `<span>📍 ${esc(c.ubicacion)}</span>`;
  info.innerHTML = filas;
}

function renderDestacado() {
  const destacados = PRODUCTOS.filter(p => p.destacado);
  const seccionGrande = document.getElementById('c-seccion-destacado');
  const seccionResto = document.getElementById('c-seccion-mas-destacados');

  if (!destacados.length) { seccionGrande.style.display = 'none'; seccionResto.style.display = 'none'; return; }

  seccionGrande.style.display = 'block';
  const p = destacados[0];
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const principal = p.fotos.find(f => f.es_principal) || p.fotos[0];
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;

  document.getElementById('c-destacado').innerHTML = `
    <div class="c-destacado-media">
      <img class="c-destacado-img" id="c-destacado-img-principal" src="${esc(principal?.url||'')}" alt="${esc(p.nombre)}" onclick="abrirModalProducto('${p.id}')">
      ${p.fotos.length > 1 ? `<div class="c-destacado-thumbs">${p.fotos.map(f => `<img class="c-destacado-thumb ${f.id===principal?.id?'activa':''}" src="${esc(f.url)}" onclick="cambiarFotoDestacado(this,'${esc(f.url)}')">`).join('')}</div>` : ''}
    </div>
    <div class="c-destacado-info">
      ${cat ? `<div class="c-destacado-cat">${esc(cat.nombre)}</div>` : ''}
      <h2 class="c-destacado-nombre">${esc(p.nombre)}</h2>
      ${p.descripcion ? `<p class="c-destacado-desc">${esc(p.descripcion)}</p>` : ''}
      <div class="c-precio-row">
        <span class="c-precio ${enOferta?'con-oferta':''}">${fmtC(enOferta?p.precio_oferta:p.precio)}</span>
        ${enOferta ? `<span class="c-precio-tachado">${fmtC(p.precio)}</span>` : ''}
      </div>
      ${CATALOGO.whatsapp ? `<button class="c-btn" style="align-self:flex-start" onclick="consultarProducto('${p.id}')">💬 Consultar disponibilidad</button>` : ''}
    </div>`;

  const resto = destacados.slice(1);
  if (resto.length) {
    seccionResto.style.display = 'block';
    const grid = document.getElementById('c-grid-mas-destacados');
    grid.className = 'c-grid' + (resto.length <= 3 ? ' pocas' : '');
    grid.innerHTML = resto.map(tarjetaProductoHTML).join('');
  } else {
    seccionResto.style.display = 'none';
  }
}
function cambiarFotoDestacado(imgEl, url) {
  document.getElementById('c-destacado-img-principal').src = url;
  document.querySelectorAll('.c-destacado-thumb').forEach(t => t.classList.remove('activa'));
  imgEl.classList.add('activa');
}
function consultarProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p || !CATALOGO.whatsapp) return;
  const precio = (p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio;
  registrarEvento('click_whatsapp', p.id);
  window.open(linkWhatsapp(CATALOGO.whatsapp, `Hola, estoy interesado en "${p.nombre}" (${fmtC(precio)}) de su catálogo.`), '_blank');
}

let ORDEN_ACTUAL = 'reciente';

function renderVistaCategoriasOProductos() {
  renderChipsCategorias();
  aplicarFiltroYOrden();
}

function renderChipsCategorias() {
  const barra = document.getElementById('c-filtros-barra');
  const cont = document.getElementById('c-chips-categorias');
  if (!CATEGORIAS.length) { barra.style.display = PRODUCTOS.length ? 'block' : 'none'; cont.innerHTML = ''; return; }
  barra.style.display = 'block';
  cont.innerHTML = `<div class="c-chip ${!CATEGORIA_VISTA_ACTUAL?'activo':''}" onclick="filtrarPorCategoria(null)">Todos</div>` +
    CATEGORIAS.map(cat => `<div class="c-chip ${CATEGORIA_VISTA_ACTUAL?.id===cat.id?'activo':''}" onclick="filtrarPorCategoria('${cat.id}')">${esc(cat.nombre)}</div>`).join('');
}
function filtrarPorCategoria(id) {
  CATEGORIA_VISTA_ACTUAL = id ? CATEGORIAS.find(c => c.id === id) : null;
  renderChipsCategorias();
  aplicarFiltroYOrden();
}
function cambiarOrden(valor) { ORDEN_ACTUAL = valor; aplicarFiltroYOrden(); }

function aplicarFiltroYOrden() {
  let lista = CATEGORIA_VISTA_ACTUAL ? PRODUCTOS.filter(p => p.categoria_id === CATEGORIA_VISTA_ACTUAL.id) : PRODUCTOS.slice();
  const precioReal = p => (p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio;
  if (ORDEN_ACTUAL === 'precio_asc') lista.sort((a,b) => precioReal(a) - precioReal(b));
  else if (ORDEN_ACTUAL === 'precio_desc') lista.sort((a,b) => precioReal(b) - precioReal(a));
  else if (ORDEN_ACTUAL === 'nombre') lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  else lista.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  renderGridProductos(lista);
}

function tarjetaProductoHTML(p) {
  const principal = p.fotos.find(f => f.es_principal) || p.fotos[0];
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;
  const agotado = p.etiqueta === 'agotado';
  const tagTexto = { nuevo:'Nuevo', oferta:'Oferta' }[p.etiqueta];
  return `
    <div class="c-card ${agotado?'agotada':''}">
      <div class="c-card-media" onclick="abrirModalProducto('${p.id}')">
        ${tagTexto ? `<span class="c-card-tag ${p.etiqueta}">${tagTexto}</span>` : ''}
        <span class="c-card-disp ${agotado?'agotado':''}">${agotado?'Agotado':'Disponible'}</span>
        ${principal ? `<img src="${esc(principal.url)}" loading="lazy" alt="${esc(p.nombre)}">` : ''}
      </div>
      <div class="c-card-body">
        ${cat ? `<div class="c-card-cat">${esc(cat.nombre)}</div>` : ''}
        <div class="c-card-nombre" onclick="abrirModalProducto('${p.id}')">${esc(p.nombre)}</div>
        <div class="c-card-precio-row">
          <span class="c-card-precio ${enOferta?'con-oferta':''}">${fmtC(enOferta?p.precio_oferta:p.precio)}</span>
          ${enOferta ? `<span class="c-card-tachado">${fmtC(p.precio)}</span>` : ''}
        </div>
        ${(!agotado) ? `<div class="c-card-botones">
          ${CATALOGO.whatsapp ? `<button class="c-card-accion-rapida wa" onclick="event.stopPropagation();consultarProducto('${p.id}')" title="Consultar por WhatsApp">💬</button>` : ''}
          ${CATALOGO.telefono ? `<a class="c-card-accion-rapida llamar" href="tel:${esc(CATALOGO.telefono)}" onclick="event.stopPropagation();registrarEvento('click_telefono')" title="Llamar">📞</a>` : ''}
          <button class="c-card-accion-rapida compartir" onclick="event.stopPropagation();compartirProducto('${p.id}')" title="Compartir">🔗</button>
        </div>` : ''}
      </div>
    </div>`;
}
function compartirProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p) return;
  const url = `${window.location.href.split('#')[0]}#producto-${id}`;
  if (navigator.share) { navigator.share({ title: p.nombre, text: `${p.nombre} — ${fmtC(p.precio)}`, url }).catch(()=>{}); }
  else if (navigator.clipboard) { navigator.clipboard.writeText(url); }
}
function renderGridProductos(lista) {
  document.getElementById('c-conteo-productos').textContent = lista.length ? `${lista.length} producto${lista.length===1?'':'s'}` : '';
  const grid = document.getElementById('c-grid-productos');
  if (!lista.length) { grid.innerHTML = `<div class="c-vacio" style="width:100%">Todavía no hay productos aquí.</div>`; return; }
  grid.className = 'c-grid' + (lista.length <= 3 ? ' pocas' : '');
  grid.innerHTML = lista.map(tarjetaProductoHTML).join('');
}

function abrirModalProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p) return;
  registrarEvento('vista_producto', id);
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;

  const catEl = document.getElementById('c-modal-cat');
  catEl.textContent = cat ? cat.nombre : '';
  catEl.style.display = cat ? 'block' : 'none';
  document.getElementById('c-modal-nombre').textContent = p.nombre;
  document.getElementById('c-modal-precio').textContent = fmtC(enOferta ? p.precio_oferta : p.precio);
  document.getElementById('c-modal-precio').className = 'c-precio' + (enOferta ? ' con-oferta' : '');
  const tachadoEl = document.getElementById('c-modal-precio-tachado');
  tachadoEl.style.display = enOferta ? 'inline' : 'none';
  if (enOferta) tachadoEl.textContent = fmtC(p.precio);
  document.getElementById('c-modal-desc').textContent = p.descripcion || '';
  document.getElementById('c-modal-fotos').innerHTML = p.fotos.length ? p.fotos.map(f => `<img src="${esc(f.url)}" alt="">`).join('') : '';

  const btnWa = document.getElementById('c-modal-whatsapp');
  if (CATALOGO.whatsapp && p.etiqueta !== 'agotado') {
    btnWa.style.display = 'flex'; btnWa.disabled = false;
    btnWa.textContent = '💬 Consultar por WhatsApp';
    btnWa.onclick = () => consultarProducto(p.id);
  } else if (p.etiqueta === 'agotado') {
    btnWa.style.display = 'flex'; btnWa.disabled = true;
    btnWa.textContent = 'Agotado por ahora'; btnWa.onclick = null;
  } else {
    btnWa.style.display = 'none';
  }
  document.getElementById('c-modal').classList.add('open');
}
function cerrarModalProducto() { document.getElementById('c-modal').classList.remove('open'); }

init();
</script>
</body>
</html>
