<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="c360p-title">Catálogo</title>
<meta id="c360p-desc-meta" name="description" content="Catálogo digital">
<meta id="c360p-og-title" property="og:title" content="Catálogo">
<meta id="c360p-og-desc" property="og:description" content="Catálogo digital">
<meta id="c360p-og-image" property="og:image" content="">
<meta property="og:type" content="website">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --acento: #6366f1;
    --bg: #f8f9fb; --bg-card: #ffffff; --texto: #14151a; --texto-sec: #6b7280; --borde: #e9eaee;
  }
  html[data-theme="oscuro"] {
    --bg: #0e0f14; --bg-card: #17181f; --texto: #f2f2f5; --texto-sec: #9a9ba5; --borde: #262832;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Plus Jakarta Sans',sans-serif; background:var(--bg); color:var(--texto); transition:background .2s,color .2s; }
  img { max-width:100%; display:block; }
  a { color:inherit; }

  header.c360p-header {
    position:sticky; top:0; z-index:20; background:var(--bg-card); border-bottom:1px solid var(--borde);
    padding:14px 20px; display:flex; align-items:center; gap:12px; backdrop-filter:blur(8px);
  }
  .c360p-logo { width:40px; height:40px; border-radius:10px; object-fit:cover; background:var(--borde); flex-shrink:0; }
  .c360p-nombre { font-weight:800; font-size:16px; }
  .c360p-desc-header { font-size:11.5px; color:var(--texto-sec); }
  .c360p-tema-btn {
    margin-left:auto; background:var(--bg); border:1px solid var(--borde); border-radius:999px;
    width:36px; height:36px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;
  }

  .c360p-hero-oscuro {
    position:relative; background:#14151c; color:#f2f2f5; display:flex; flex-direction:column-reverse;
    padding:24px 20px 32px; gap:24px; overflow:hidden;
  }
  @media (min-width:800px) { .c360p-hero-oscuro { flex-direction:row; align-items:center; padding:48px 60px; gap:48px; } }
  .c360p-hero-izq { flex:1; min-width:0; }
  .c360p-hero-der { flex:1; min-width:0; }
  .c360p-hero-der img { width:100%; height:100%; max-height:340px; object-fit:cover; border-radius:16px; display:block; }
  .c360p-hero-marca { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .c360p-hero-marca img.c360p-logo { width:40px; height:40px; border-radius:8px; object-fit:cover; }
  .c360p-hero-nombre { font-weight:700; font-size:14px; letter-spacing:.04em; text-transform:uppercase; color:var(--acento); }
  #c360p-hero-titulo { margin:0 0 10px; font-size:32px; font-weight:800; line-height:1.15; }
  @media (min-width:800px) { #c360p-hero-titulo { font-size:44px; } }
  .c360p-hero-izq p { margin:0 0 20px; color:#b8b9c2; font-size:14px; max-width:420px; line-height:1.6; }
  .c360p-hero-info-contacto { display:flex; flex-direction:column; gap:6px; margin-top:20px; font-size:12.5px; color:#9a9ba5; }
  .c360p-hero-info-contacto span { display:flex; align-items:center; gap:7px; }
  .c360p-tema-btn-hero { position:absolute; top:16px; right:16px; z-index:2; background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.15); color:#fff; }

  .c360p-banner { width:100%; max-height:280px; object-fit:cover; display:block; }

  .c360p-seccion-titulo { font-size:15px; font-weight:800; padding:0 20px; margin:22px auto 12px; max-width:1100px; display:flex; align-items:center; gap:8px; }
  .c360p-destacado-grande {
    max-width:1100px; margin:0 auto; padding:0 20px 24px; display:flex; flex-direction:column; gap:20px;
  }
  @media (min-width:800px) { .c360p-destacado-grande { flex-direction:row; align-items:flex-start; } }
  .c360p-dg-img-principal { width:100%; border-radius:16px; aspect-ratio:4/3; object-fit:cover; background:var(--borde); cursor:pointer; }
  .c360p-dg-col-img { flex:1.1; min-width:0; }
  .c360p-dg-col-info { flex:1; min-width:0; display:flex; flex-direction:column; }
  .c360p-dg-categoria { font-size:11.5px; font-weight:800; color:var(--acento); text-transform:uppercase; letter-spacing:.05em; }
  .c360p-dg-nombre { font-size:22px; font-weight:800; margin:6px 0 8px; }
  .c360p-dg-desc { font-size:13.5px; color:var(--texto-sec); line-height:1.6; margin-bottom:10px; white-space:pre-wrap; }
  .c360p-dg-precio { font-size:24px; font-weight:800; color:var(--acento); margin:10px 0 16px; }
  .c360p-dg-thumbs { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .c360p-dg-thumb { width:56px; height:56px; border-radius:10px; object-fit:cover; cursor:pointer; border:2px solid transparent; opacity:.75; }
  .c360p-dg-thumb.activa { border-color:var(--acento); opacity:1; }
  .c360p-destacados-scroll .c360p-card { width:150px; min-width:150px; max-width:150px; flex-shrink:0; }
  @media (min-width:640px) { .c360p-destacados-scroll .c360p-card { width:190px; min-width:190px; max-width:190px; } }

  .c360p-etiqueta { position:absolute; top:8px; left:8px; font-size:10px; font-weight:800; padding:3px 9px; border-radius:999px; color:#fff; z-index:1; letter-spacing:.02em; }
  .c360p-etiqueta.nuevo { background:#3b82f6; }
  .c360p-etiqueta.oferta { background:#ef4444; }
  .c360p-etiqueta.agotado { background:#6b7280; }
  .c360p-card.agotado-card { opacity:.6; }
  .c360p-precio-tachado { text-decoration:line-through; color:var(--texto-sec); font-size:11.5px; font-weight:500; margin-right:6px; }
  .c360p-precio-oferta { color:#ef4444; }

  .c360p-grid-categorias { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; padding:0 20px 20px; max-width:1100px; margin:0 auto; }
  @media (min-width:640px) { .c360p-grid-categorias { grid-template-columns:repeat(4,1fr); } }
  .c360p-cat-card { background:var(--bg-card); border:1px solid var(--borde); border-radius:16px; overflow:hidden; cursor:pointer; transition:transform .15s; }
  .c360p-cat-card:hover { transform:translateY(-3px); }
  .c360p-cat-card img, .c360p-cat-card-img-vacia { width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--borde); }
  .c360p-cat-card-body { padding:12px 14px 16px; }
  .c360p-cat-card-nombre { font-weight:800; font-size:14.5px; }
  .c360p-cat-card-desc { font-size:11.5px; color:var(--texto-sec); margin-top:3px; line-height:1.4; }
  .c360p-cat-card-btn { margin-top:10px; font-size:12px; font-weight:700; color:var(--acento); display:flex; align-items:center; gap:5px; }
  .c360p-cat-card-btn span { background:var(--acento); color:#fff; border-radius:999px; padding:1px 8px; font-size:11px; }
  .c360p-contacto { display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .c360p-btn-contacto {
    display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:999px;
    background:var(--acento); color:#fff; font-weight:700; font-size:13px; text-decoration:none; border:none; cursor:pointer;
  }
  .c360p-btn-contacto.secundario { background:transparent; border:1px solid var(--borde); color:var(--texto); }

  .c360p-grid {
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:6px 20px 60px; max-width:1100px; margin:0 auto;
  }
  @media (min-width:640px) { .c360p-grid { grid-template-columns:repeat(3,1fr); } }
  @media (min-width:900px) { .c360p-grid { grid-template-columns:repeat(4,1fr); } }

  .c360p-card {
    background:var(--bg-card); border:1px solid var(--borde); border-radius:16px; overflow:hidden; cursor:pointer;
    transition:transform .15s; display:flex; flex-direction:column;
  }
  .c360p-card:hover { transform:translateY(-2px); }
  .c360p-card-img { width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--borde); }
  .c360p-card-body { padding:10px 12px 12px; flex:1; display:flex; flex-direction:column; }
  .c360p-card-nombre { font-size:13.5px; font-weight:700; line-height:1.3; margin-bottom:4px; }
  .c360p-card-precio { font-weight:800; color:var(--acento); font-size:14px; margin-top:auto; }

  .c360p-vacio { text-align:center; padding:60px 20px; color:var(--texto-sec); }

  /* MODAL DE PRODUCTO */
  .c360p-modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:flex-end; justify-content:center;
  }
  .c360p-modal-overlay.open { display:flex; }
  .c360p-modal {
    background:var(--bg-card); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:0;
  }
  @media (min-width:640px) { .c360p-modal-overlay { align-items:center; } .c360p-modal { border-radius:20px; } }
  .c360p-modal-close { position:sticky; top:10px; margin-left:auto; margin-right:10px; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.5); color:#fff; border:none; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; }
  .c360p-modal-fotos { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; margin-top:-42px; }
  .c360p-modal-fotos img { width:100%; flex-shrink:0; scroll-snap-align:start; aspect-ratio:1/1; object-fit:cover; }
  .c360p-modal-body { padding:18px 20px 24px; }
  .c360p-modal-nombre { font-size:19px; font-weight:800; margin-bottom:4px; }
  .c360p-modal-precio { font-size:20px; font-weight:800; color:var(--acento); margin-bottom:12px; }
  .c360p-modal-desc { font-size:13.5px; color:var(--texto-sec); line-height:1.6; margin-bottom:18px; white-space:pre-wrap; }

  .c360p-footer { text-align:center; padding:20px; font-size:11.5px; color:var(--texto-sec); }
  .c360p-footer a { color:var(--acento); font-weight:700; text-decoration:none; }

  .c360p-loader { display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--texto-sec); font-size:14px; }
</style>
</head>
<body>

<div id="c360p-loader" class="c360p-loader">Cargando catálogo…</div>

<div id="c360p-app" style="display:none">
  <div id="c360p-banner-preview" style="display:none;background:#f59e0b;color:#1a1a1a;text-align:center;padding:8px;font-size:12.5px;font-weight:700">
    👁 Estás viendo una VISTA PREVIA — esto no es visible al público todavía
  </div>
  <div class="c360p-hero-oscuro">
    <button class="c360p-tema-btn c360p-tema-btn-hero" onclick="toggleTemaPublico()" id="c360p-tema-btn">🌙</button>
    <div class="c360p-hero-izq">
      <div class="c360p-hero-marca">
        <img id="c360p-logo" class="c360p-logo" src="" style="display:none"/>
        <div id="c360p-nombre" class="c360p-hero-nombre"></div>
      </div>
      <h1 id="c360p-hero-titulo">Catálogo</h1>
      <p id="c360p-descripcion-larga"></p>
      <div class="c360p-contacto" id="c360p-contacto"></div>
      <div class="c360p-hero-info-contacto" id="c360p-info-contacto"></div>
    </div>
    <div class="c360p-hero-der" id="c360p-banner-wrap" style="display:none">
      <img id="c360p-banner-img" class="c360p-banner" src="" alt=""/>
    </div>
  </div>

  <div id="c360p-seccion-destacado-grande" style="display:none">
    <div class="c360p-seccion-titulo">Producto Destacado</div>
    <div class="c360p-destacado-grande" id="c360p-destacado-grande"></div>
  </div>

  <div id="c360p-seccion-destacados" style="display:none">
    <div class="c360p-seccion-titulo">Más destacados</div>
    <div class="c360p-destacados-scroll" id="c360p-destacados"></div>
  </div>

  <div id="c360p-seccion-categorias" style="display:none">
    <div class="c360p-seccion-titulo">Nuestros Productos</div>
    <div class="c360p-grid-categorias" id="c360p-grid-categorias"></div>
  </div>

  <div id="c360p-seccion-productos">
    <div class="c360p-seccion-titulo">
      <button id="c360p-btn-volver-categorias" onclick="volverACategorias()" style="display:none;background:none;border:none;color:var(--acento);font-weight:700;font-size:13px;cursor:pointer;padding:0;margin-right:4px">← </button>
      <span id="c360p-titulo-productos">Nuestros Productos</span>
    </div>
    <div class="c360p-grid" id="c360p-grid"></div>
  </div>

  <div class="c360p-footer">
    Catálogo creado con <a href="/" target="_blank">Catálogo360</a>
  </div>
</div>

<div class="c360p-modal-overlay" id="c360p-modal" onclick="if(event.target===this)cerrarModalProducto()">
  <div class="c360p-modal">
    <button class="c360p-modal-close" onclick="cerrarModalProducto()">✕</button>
    <div class="c360p-modal-fotos" id="c360p-modal-fotos"></div>
    <div class="c360p-modal-body">
      <div class="c360p-modal-nombre" id="c360p-modal-nombre"></div>
      <div class="c360p-modal-precio" id="c360p-modal-precio"></div>
      <div class="c360p-modal-desc" id="c360p-modal-desc"></div>
      <button class="c360p-btn-contacto" id="c360p-modal-whatsapp" style="width:100%;justify-content:center;padding:12px">
        💬 Consultar por WhatsApp
      </button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zvlincmqmmoclqhykejv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RY59EmL8V2zRkOQg7RUJAw_dw6yr69t';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CATALOGO = null, PRODUCTOS = [], CATEGORIAS = [], CATEGORIA_VISTA_ACTUAL = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtC(n) { return 'C$' + Number(n||0).toLocaleString('es-NI', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function linkWhatsapp(numero, texto) {
  const limpio = (numero||'').replace(/[^\d]/g,'');
  return `https://wa.me/${limpio}?text=${encodeURIComponent(texto)}`;
}

function toggleTemaPublico() {
  const actual = document.documentElement.getAttribute('data-theme');
  const nuevo = actual === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.setAttribute('data-theme', nuevo);
  document.getElementById('c360p-tema-btn').textContent = nuevo === 'oscuro' ? '☀' : '🌙';
  localStorage.setItem('c360p_tema', nuevo);
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('c');
  const idPreview = params.get('preview');

  if (!slug && !idPreview) { mostrarError('Enlace de catálogo no válido.'); return; }

  let catalogo, error;
  if (idPreview) {
    // Vista previa del dueño -- requiere sesión iniciada, funciona
    // sin importar si el catalogo ya esta publicado o no (la politica
    // de seguridad ya permite esto solo al dueño real).
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user) { mostrarError('Inicia sesión en Negocio360 para ver la vista previa.'); return; }
    ({ data: catalogo, error } = await sb.from('catalogos').select('*').eq('id', idPreview).maybeSingle());
    if (catalogo && !catalogo.slug_publico) {
      // aviso de que esto es solo una vista previa, no la version publica final
      document.title = '(Vista previa) ' + document.title;
    }
  } else {
    ({ data: catalogo, error } = await sb.from('catalogos').select('*').eq('slug_publico', slug).eq('estado', 'publicado').maybeSingle());
  }

  if (error || !catalogo) { mostrarError('Este catálogo no existe o ya no está disponible.'); return; }
  CATALOGO = catalogo;
  if (idPreview && catalogo.estado !== 'publicado') {
    document.getElementById('c360p-banner-preview').style.display = 'block';
  }

  const temaGuardado = localStorage.getItem('c360p_tema') || catalogo.tema_default || 'claro';
  document.documentElement.setAttribute('data-theme', temaGuardado);
  document.getElementById('c360p-tema-btn').textContent = temaGuardado === 'oscuro' ? '☀' : '🌙';
  document.documentElement.style.setProperty('--acento', catalogo.color_acento || '#6366f1');

  const { data: productos } = await sb.from('catalogo_productos').select('*, catalogo_producto_fotos(*)')
    .eq('catalogo_id', catalogo.id).eq('activo', true).order('orden');
  PRODUCTOS = (productos || []).map(p => ({ ...p, fotos: (p.catalogo_producto_fotos||[]).sort((a,b)=>a.orden-b.orden) }));

  const { data: categorias } = await sb.from('catalogo_categorias').select('*').eq('catalogo_id', catalogo.id).order('orden');
  CATEGORIAS = categorias || [];

  renderCabecera();
  renderDestacados();
  renderVistaCategoriasOProductos();

  // Registrar la visita real -- nunca en modo vista previa (eso no
  // cuenta como visita real de un cliente), best-effort (si falla,
  // no afecta en nada la experiencia de quien esta viendo el catalogo).
  if (!idPreview) {
    sb.rpc('catalogo_registrar_evento', { p_catalogo_id: catalogo.id, p_tipo_evento: 'visita' }).then(()=>{}).catch(()=>{});
  }

  document.getElementById('c360p-loader').style.display = 'none';
  document.getElementById('c360p-app').style.display = 'block';
}

function mostrarError(msg) {
  document.getElementById('c360p-loader').innerHTML = `<div style="text-align:center"><div style="font-size:32px;margin-bottom:10px">😕</div>${esc(msg)}</div>`;
}

function renderCabecera() {
  const c = CATALOGO;
  document.title = c.nombre_comercial || c.nombre;
  document.getElementById('c360p-title').textContent = c.nombre_comercial || c.nombre;
  document.getElementById('c360p-desc-meta').setAttribute('content', c.descripcion || '');
  document.getElementById('c360p-og-title').setAttribute('content', c.nombre_comercial || c.nombre);
  document.getElementById('c360p-og-desc').setAttribute('content', c.descripcion || '');
  if (c.logo_url) document.getElementById('c360p-og-image').setAttribute('content', c.logo_url);

  document.getElementById('c360p-nombre').textContent = c.nombre_comercial || c.nombre;
  document.getElementById('c360p-hero-titulo').textContent = c.nombre;
  document.getElementById('c360p-descripcion-larga').textContent = c.descripcion || '';
  if (c.logo_url) {
    const logo = document.getElementById('c360p-logo');
    logo.src = c.logo_url; logo.style.display = 'block';
  }
  if (c.banner_url) {
    document.getElementById('c360p-banner-wrap').style.display = 'block';
    document.getElementById('c360p-banner-img').src = c.banner_url;
  }

  const contactoDiv = document.getElementById('c360p-contacto');
  let botones = '';
  if (c.whatsapp) botones += `<a class="c360p-btn-contacto" href="${linkWhatsapp(c.whatsapp, `Hola, vi su catálogo ${c.nombre_comercial||''} y tengo una consulta.`)}" target="_blank" onclick="registrarEvento('click_whatsapp')">💬 WhatsApp</a>`;
  contactoDiv.innerHTML = botones;

  const infoDiv = document.getElementById('c360p-info-contacto');
  let filas = '';
  if (c.whatsapp) filas += `<span>💬 ${esc(c.whatsapp)}</span>`;
  if (c.telefono) filas += `<a href="tel:${esc(c.telefono)}" onclick="registrarEvento('click_telefono')" style="color:inherit;text-decoration:none"><span>📞 ${esc(c.telefono)}</span></a>`;
  if (c.email) filas += `<span>✉️ ${esc(c.email)}</span>`;
  if (c.ubicacion) filas += `<span>📍 ${esc(c.ubicacion)}</span>`;
  infoDiv.innerHTML = filas;
}

function registrarEvento(tipo, productoId) {
  if (CATALOGO && !new URLSearchParams(window.location.search).get('preview')) {
    sb.rpc('catalogo_registrar_evento', { p_catalogo_id: CATALOGO.id, p_tipo_evento: tipo, p_producto_id: productoId || null }).then(()=>{}).catch(()=>{});
  }
}

// Decide que mostrar: si hay categorias REALES creadas por el
// dueño, se muestra la cuadricula de categorias primero (como
// "Nuestros Productos" en la plantilla de referencia); si el
// catalogo no tiene ninguna categoria, cae directo a mostrar todos
// los productos -- tal como se pidio explicitamente.
function renderVistaCategoriasOProductos() {
  const seccionCats = document.getElementById('c360p-seccion-categorias');
  const seccionProds = document.getElementById('c360p-seccion-productos');

  if (!CATEGORIAS.length) {
    seccionCats.style.display = 'none';
    seccionProds.style.display = 'block';
    document.getElementById('c360p-titulo-productos').textContent = 'Nuestros Productos';
    document.getElementById('c360p-btn-volver-categorias').style.display = 'none';
    renderGrid(PRODUCTOS);
    return;
  }

  if (CATEGORIA_VISTA_ACTUAL) {
    seccionCats.style.display = 'none';
    seccionProds.style.display = 'block';
    document.getElementById('c360p-titulo-productos').textContent = CATEGORIA_VISTA_ACTUAL.nombre;
    document.getElementById('c360p-btn-volver-categorias').style.display = '';
    renderGrid(PRODUCTOS.filter(p => p.categoria_id === CATEGORIA_VISTA_ACTUAL.id));
  } else {
    seccionProds.style.display = 'none';
    seccionCats.style.display = 'block';
    renderCategoriasGrid();
  }
}

function renderCategoriasGrid() {
  // Conteo de productos por categoria, calculado de lo que YA se
  // cargo en memoria -- sin gastar ninguna consulta extra a Supabase.
  const conteo = {};
  PRODUCTOS.forEach(p => { if (p.categoria_id) conteo[p.categoria_id] = (conteo[p.categoria_id]||0) + 1; });

  document.getElementById('c360p-grid-categorias').innerHTML = CATEGORIAS.map(cat => `
    <div class="c360p-cat-card" onclick="verCategoria('${cat.id}')">
      ${cat.imagen_url ? `<img src="${esc(cat.imagen_url)}" loading="lazy" alt="${esc(cat.nombre)}">` : `<div class="c360p-cat-card-img-vacia"></div>`}
      <div class="c360p-cat-card-body">
        <div class="c360p-cat-card-nombre">${esc(cat.nombre)}</div>
        ${cat.descripcion ? `<div class="c360p-cat-card-desc">${esc(cat.descripcion)}</div>` : ''}
        <div class="c360p-cat-card-btn">Ver productos <span>${conteo[cat.id]||0}</span> →</div>
      </div>
    </div>
  `).join('');
}

function verCategoria(id) {
  CATEGORIA_VISTA_ACTUAL = CATEGORIAS.find(c => c.id === id) || null;
  renderVistaCategoriasOProductos();
  window.scrollTo({ top: document.getElementById('c360p-seccion-productos').offsetTop - 70, behavior:'smooth' });
}
function volverACategorias() {
  CATEGORIA_VISTA_ACTUAL = null;
  renderVistaCategoriasOProductos();
}

function tarjetaProductoHTML(p) {
  const principal = p.fotos.find(f => f.es_principal) || p.fotos[0];
  const etiquetas = { nuevo: '🆕 Nuevo', oferta: '🔥 Oferta', agotado: '⛔ Agotado' };
  const precioHTML = (p.etiqueta === 'oferta' && p.precio_oferta)
    ? `<span class="c360p-precio-tachado">${fmtC(p.precio)}</span><span class="c360p-precio-oferta">${fmtC(p.precio_oferta)}</span>`
    : fmtC(p.precio);
  return `
    <div class="c360p-card ${p.etiqueta==='agotado'?'agotado-card':''}" style="position:relative" onclick="abrirModalProducto('${p.id}')">
      ${p.etiqueta ? `<span class="c360p-etiqueta ${p.etiqueta}">${etiquetas[p.etiqueta]}</span>` : ''}
      ${principal ? `<img class="c360p-card-img" src="${esc(principal.url)}" loading="lazy" alt="${esc(p.nombre)}">` : `<div class="c360p-card-img"></div>`}
      <div class="c360p-card-body">
        <div class="c360p-card-nombre">${esc(p.nombre)}</div>
        <div class="c360p-card-precio">${precioHTML}</div>
      </div>
    </div>`;
}

function renderDestacados() {
  const destacados = PRODUCTOS.filter(p => p.destacado);
  const seccionGrande = document.getElementById('c360p-seccion-destacado-grande');
  const seccionResto = document.getElementById('c360p-seccion-destacados');

  if (!destacados.length) { seccionGrande.style.display = 'none'; seccionResto.style.display = 'none'; return; }

  seccionGrande.style.display = 'block';
  renderDestacadoGrande(destacados[0]);

  const resto = destacados.slice(1);
  if (resto.length) {
    seccionResto.style.display = 'block';
    document.getElementById('c360p-destacados').innerHTML = resto.map(tarjetaProductoHTML).join('');
  } else {
    seccionResto.style.display = 'none';
  }
}

function renderDestacadoGrande(p) {
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const fotos = p.fotos.length ? p.fotos : [{ url: '' }];
  const principal = p.fotos.find(f => f.es_principal) || p.fotos[0];
  const precioHTML = (p.etiqueta === 'oferta' && p.precio_oferta)
    ? `<span class="c360p-precio-tachado" style="font-size:16px">${fmtC(p.precio)}</span> <span class="c360p-precio-oferta">${fmtC(p.precio_oferta)}</span>`
    : fmtC(p.precio);

  document.getElementById('c360p-destacado-grande').innerHTML = `
    <div class="c360p-dg-col-img">
      <img class="c360p-dg-img-principal" id="c360p-dg-img-principal" src="${esc(principal?.url||'')}" alt="${esc(p.nombre)}" onclick="abrirModalProducto('${p.id}')">
      ${p.fotos.length > 1 ? `<div class="c360p-dg-thumbs">${p.fotos.map((f,i) => `<img class="c360p-dg-thumb ${f.id===principal?.id?'activa':''}" src="${esc(f.url)}" onclick="cambiarFotoDestacadoGrande(this,'${esc(f.url)}')">`).join('')}</div>` : ''}
    </div>
    <div class="c360p-dg-col-info">
      ${cat ? `<div class="c360p-dg-categoria">${esc(cat.nombre)}</div>` : ''}
      <div class="c360p-dg-nombre">${esc(p.nombre)}</div>
      ${p.descripcion ? `<div class="c360p-dg-desc">${esc(p.descripcion)}</div>` : ''}
      <div class="c360p-dg-precio">${precioHTML}</div>
      ${CATALOGO.whatsapp ? `<button class="c360p-btn-contacto" style="align-self:flex-start" onclick="consultarDestacadoGrande('${p.id}')">💬 Solicitar información</button>` : ''}
    </div>
  `;
}
function consultarDestacadoGrande(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p || !CATALOGO.whatsapp) return;
  const precioParaMensaje = (p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio;
  registrarEvento('click_whatsapp', p.id);
  window.open(linkWhatsapp(CATALOGO.whatsapp, `Hola, estoy interesado en "${p.nombre}" (${fmtC(precioParaMensaje)}) de su catálogo.`), '_blank');
}
function cambiarFotoDestacadoGrande(imgEl, url) {
  document.getElementById('c360p-dg-img-principal').src = url;
  document.querySelectorAll('.c360p-dg-thumb').forEach(t => t.classList.remove('activa'));
  imgEl.classList.add('activa');
}

function renderGrid(lista) {
  const grid = document.getElementById('c360p-grid');
  if (!lista.length) { grid.innerHTML = `<div class="c360p-vacio" style="grid-column:1/-1">Todavía no hay productos aquí.</div>`; return; }
  grid.innerHTML = lista.map(tarjetaProductoHTML).join('');
}


function abrirModalProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p) return;
  registrarEvento('vista_producto', id);
  document.getElementById('c360p-modal-nombre').textContent = p.nombre;
  document.getElementById('c360p-modal-precio').innerHTML = (p.etiqueta==='oferta' && p.precio_oferta)
    ? `<span class="c360p-precio-tachado" style="font-size:15px">${fmtC(p.precio)}</span> <span class="c360p-precio-oferta">${fmtC(p.precio_oferta)}</span>`
    : fmtC(p.precio);
  document.getElementById('c360p-modal-desc').textContent = p.descripcion || '';
  document.getElementById('c360p-modal-fotos').innerHTML = p.fotos.length
    ? p.fotos.map(f => `<img src="${esc(f.url)}" alt="">`).join('')
    : '';
  const btnWa = document.getElementById('c360p-modal-whatsapp');
  const precioParaMensaje = (p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio;
  if (CATALOGO.whatsapp && p.etiqueta !== 'agotado') {
    btnWa.style.display = 'flex';
    btnWa.style.opacity = ''; btnWa.style.cursor = 'pointer';
    btnWa.textContent = '💬 Consultar por WhatsApp';
    btnWa.onclick = () => {
      registrarEvento('click_whatsapp', p.id);
      window.open(linkWhatsapp(CATALOGO.whatsapp, `Hola, estoy interesado en "${p.nombre}" (${fmtC(precioParaMensaje)}) de su catálogo.`), '_blank');
    };
  } else if (p.etiqueta === 'agotado') {
    btnWa.style.display = 'flex';
    btnWa.textContent = '⛔ Agotado por ahora';
    btnWa.onclick = null;
    btnWa.style.opacity = '.6'; btnWa.style.cursor = 'not-allowed';
  } else {
    btnWa.style.display = 'none';
  }
  document.getElementById('c360p-modal').classList.add('open');
}
function cerrarModalProducto() { document.getElementById('c360p-modal').classList.remove('open'); }

init();
</script>
</body>
</html>
