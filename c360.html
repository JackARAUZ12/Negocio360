<style>
:root {
  --bg:        #f4efe6;
  --surface:   #faf7f1;
  --surface-2: #ebe4d6;
  --border:    #ddd3bf;
  --text:      #1c1917;
  --text-2:    #57524a;
  --text-3:    #8a8377;
  --accent:    #6366f1;
  --accent-rgb: 99,102,241;
  --accent-ink: #ffffff;
  --danger:    #b23a2f;
  --disponible: #3f6b4a;
  --disponible-bg: #3f6b4a1a;
  --on-dark:   #f5f1ea;
  --on-dark-2: #c4bdae;
  --font-display: 'Fraunces', Georgia, serif;
  --font-ui: 'Space Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 48px; --sp-9: 64px; --sp-10: 96px;
  --radius-sm: 3px; --radius-md: 4px; --radius-lg: 4px;
  --shadow-1: 0 1px 2px rgba(28,25,23,.06);
  --shadow-2: 0 24px 48px -12px rgba(28,25,23,.28);
  --max-w: 1400px;
}
html[data-theme="oscuro"] {
  --bg: #17140f; --surface: #1f1b15; --surface-2: #29241c; --border: #3a332756;
  --text: #f2ede2; --text-2: #b8ae9c; --text-3: #7d7462; --border: #3a3327;

  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 16px 32px -8px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin:0; font-family:var(--font-ui); background:var(--bg); color:var(--text);
  transition:background .25s ease, color .25s ease; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img { max-width:100%; display:block; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.c360-container { max-width:var(--max-w); margin:0 auto; padding:0 var(--sp-5); }
@media (min-width:900px) { .c360-container { padding:0 var(--sp-8); } }
@keyframes c-fade-up { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes c-fade { from { opacity:0; } to { opacity:1; } }
.c-reveal { opacity:0; transform:translateY(16px); transition:opacity .5s cubic-bezier(.22,1,.36,1), transform .5s cubic-bezier(.22,1,.36,1); }
.c-reveal.visible { opacity:1; transform:translateY(0); }
@keyframes c-shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
.c-sk { background:linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%); background-size:200% 100%; animation:c-shimmer 1.4s infinite; border-radius:6px; margin-bottom:8px; }
.c360p-loader-skeleton { padding:var(--sp-5); max-width:var(--max-w); margin:0 auto; }
.c-sk-header { display:flex; align-items:center; gap:10px; margin-bottom:var(--sp-8); }
.c-sk-hero { padding:var(--sp-8) 0; }
.c-sk-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--sp-4); }
.c-sk-card { display:flex; flex-direction:column; gap:6px; }

html { transition:background-color .4s ease; }
* { transition-property:background-color, border-color, color; transition-duration:.25s; }

.c-toast-wrap { position:fixed; bottom:var(--sp-5); left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center; }
.c-toast {

  box-shadow:0 8px 20px rgba(0,0,0,.25); animation:c-fade-up .3s cubic-bezier(.22,1,.36,1);
}
.c-header {

}

  position:relative; padding-bottom:3px;
}

  color:var(--text-2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;
  transition:transform .35s cubic-bezier(.22,1,.36,1), border-color .2s, color .2s;
}
.c-theme-btn:hover { transform:rotate(20deg); border-color:var(--accent); color:var(--accent); }

  padding:var(--sp-2) var(--sp-4); letter-spacing:.02em;
}
.c-hero { position:relative; background:var(--surface); overflow:hidden; min-height:46vh; display:flex; align-items:stretch; border-bottom:1px solid var(--border); }

}

  position:relative; z-index:1; width:100%;

  padding:var(--sp-8) var(--sp-5) var(--sp-9);

}

.c-hero-mosaico { display:none; position:relative; }

  .c-hero-mosaico::before { content:''; position:absolute; inset:0; background:rgba(var(--accent-rgb),.14); mix-blend-mode:multiply; z-index:1; pointer-events:none; }

}
.c-hero-mosaico.vacio { display:none !important; }
.c-hero-mosaico img { width:100%; height:100%; object-fit:cover; display:block; }
.c-hero-mosaico img:first-child:not(:only-child) { grid-row:1/3; }
.c-hero-etiqueta-flotante {
  position:absolute; z-index:3; top:14%; right:8%; background:var(--accent); color:var(--accent-ink);

}

  background-size:24px 24px;
}
.c-hero.con-imagen .c-hero-in { color:var(--on-dark); }
.c-hero-eyebrow {
  display:flex; align-items:center; gap:var(--sp-2); font-family:var(--font-mono); font-size:11px; font-weight:500;

}
.c-hero.con-imagen .c-hero-eyebrow { color:#fff; opacity:.9; }

.c-hero-eyebrow::before { content:''; width:20px; height:1px; background:currentColor; }
.c-hero-titulo {
  font-family:var(--font-display); font-weight:600; font-style:normal;
  font-size:clamp(44px, 7.2vw, 108px); line-height:0.92; letter-spacing:-.03em; margin:var(--sp-3) 0; max-width:11ch;
  position:relative;
}
.c-hero-desc {
  font-size:clamp(14px,1.6vw,16.5px); color:var(--text-2); max-width:40ch; line-height:1.65; margin:0;

.c-hero-acciones { display:flex; align-items:center; flex-wrap:wrap; gap:var(--sp-5); margin-top:var(--sp-7); }

.c-btn {
  display:inline-flex; align-items:center; justify-content:center; gap:10px;

  background:var(--text); color:var(--bg); position:relative; overflow:hidden; letter-spacing:.02em;
  transition:color .3s ease .05s; z-index:0;

.c-seccion { padding:var(--sp-8) 0; position:relative; border-top:4px solid transparent; }

.c-filtros-barra {

}

  border:none; outline:none; background:none; flex:1; color:var(--text); font-family:var(--font-display); font-size:19px; font-weight:500;
}

.c-fav-btn {

}

  position:fixed; bottom:var(--sp-5); right:var(--sp-5); z-index:40; width:56px; height:56px; border-radius:50%;
  background:#25D366; color:#fff; display:flex; align-items:center; justify-content:center; font-size:26px;

}

  cursor:zoom-in;

.c-destacado-desc { font-size:14.5px; color:var(--text-2); line-height:1.7; margin:0 0 var(--sp-6); max-width:48ch; }

.c-grid { display:flex; flex-wrap:wrap; justify-content:flex-start; gap:var(--sp-6) var(--sp-5); }
.c-card.grande { flex-basis:100%; max-width:100%; }

.c-cat-card:hover img { transform:scale(1.07); }
.c-cat-card::after {
  content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(10,10,14,.82) 100%);

.c-cat-card-count svg { transition:transform .25s; }
.c-cat-card:hover .c-cat-card-count svg { transform:translateX(3px); }

.c-footer { border-top:1px solid var(--border); padding:var(--sp-6) 0; }

.c-modal-overlay {

}
.c-modal-overlay.open { display:flex; animation:c-fade .2s ease; }
@keyframes c-modal-in { from { opacity:0; transform:translateY(30px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
.c-modal {
  background:var(--surface); width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0; animation:c-modal-in .3s cubic-bezier(.22,1,.36,1);
}
@media (min-width:640px) { .c-modal-overlay { align-items:center; } .c-modal { border-radius:var(--radius-lg); } }
.c-modal-close {
  position:sticky; top:var(--sp-3); margin:0 var(--sp-3) 0 auto; width:32px; height:32px; border-radius:50%;

.c-modal-body { padding:var(--sp-5) var(--sp-6) var(--sp-7); }

<script>
const SUPABASE_URL = 'https://zvlincmqmmoclqhykejv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RY59EmL8V2zRkOQg7RUJAw_dw6yr69t';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CATALOGO = null, PRODUCTOS = [], CATEGORIAS = [], CATEGORIA_VISTA_ACTUAL = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtC(n) { return 'C$' + Number(n||0).toLocaleString('es-NI', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function linkWhatsapp(numero, texto) {
  const limpio = (numero||'').replace(/[^\d]/g,'');
  return `https://wa.me/${limpio}?text=${encodeURIComponent(texto)}`;
}
function hexARgb(hex) {
  const limpio = (hex || '#6366f1').replace('#','');
  const bigint = parseInt(limpio.length === 3 ? limpio.split('').map(c=>c+c).join('') : limpio, 16);
  if (isNaN(bigint)) return '99,102,241';
  return `${(bigint>>16)&255},${(bigint>>8)&255},${bigint&255}`;
}

function irAInicio() { window.scrollTo({ top:0, behavior:'smooth' }); }
function irACatalogo() {
  const barra = document.getElementById('c-filtros-barra');
  const destino = barra.style.display !== 'none' ? barra : document.getElementById('c-seccion-productos');
  destino.scrollIntoView({ behavior:'smooth', block:'start' });
}
function toggleTemaPublico() {
  const actual = document.documentElement.getAttribute('data-theme');
  const nuevo = actual === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.setAttribute('data-theme', nuevo);
  document.getElementById('c-theme-btn').textContent = nuevo === 'oscuro' ? '☀' : '🌙';
  localStorage.setItem('c360p_tema', nuevo);
}

function registrarEvento(tipo, productoId) {
  if (CATALOGO && !new URLSearchParams(window.location.search).get('preview')) {
    sb.rpc('catalogo_registrar_evento', { p_catalogo_id: CATALOGO.id, p_tipo_evento: tipo, p_producto_id: productoId || null }).then(()=>{}).catch(()=>{});
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('c');
  const idPreview = params.get('preview');
  if (!slug && !idPreview) { mostrarError('Enlace de catálogo no válido.'); return; }

  let catalogo, error;
  if (idPreview) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user) { mostrarError('Inicia sesión en Negocio360 para ver la vista previa.'); return; }
    ({ data: catalogo, error } = await sb.from('catalogos').select('*').eq('id', idPreview).maybeSingle());
  } else {
    ({ data: catalogo, error } = await sb.from('catalogos').select('*').eq('slug_publico', slug).eq('estado', 'publicado').maybeSingle());
  }
  if (error || !catalogo) { mostrarError('Este catálogo no existe o ya no está disponible.'); return; }
  CATALOGO = catalogo;
  if (idPreview && catalogo.estado !== 'publicado') document.getElementById('c-preview-banner').style.display = 'block';

  document.documentElement.style.setProperty('--accent', catalogo.color_acento || '#6366f1');
  document.documentElement.style.setProperty('--accent-rgb', hexARgb(catalogo.color_acento));

  const temaGuardado = localStorage.getItem('c360p_tema') || catalogo.tema_default || 'claro';
  document.documentElement.setAttribute('data-theme', temaGuardado);
  document.getElementById('c-theme-btn').textContent = temaGuardado === 'oscuro' ? '☀' : '🌙';

  const { data: productos } = await sb.from('catalogo_productos').select('*, catalogo_producto_fotos(*)')
    .eq('catalogo_id', catalogo.id).eq('activo', true).order('orden');
  PRODUCTOS = (productos || []).map(p => ({ ...p, fotos: (p.catalogo_producto_fotos||[]).sort((a,b)=>a.orden-b.orden) }));

  const { data: categorias } = await sb.from('catalogo_categorias').select('*').eq('catalogo_id', catalogo.id).order('orden');
  CATEGORIAS = categorias || [];

  renderTodo();

  if (!idPreview) registrarEvento('visita');

  document.getElementById('c360p-loader').style.display = 'none';
  document.getElementById('c360p-app').style.display = 'block';
  activarRevelado();
}

function mostrarError(msg) {
  document.getElementById('c360p-loader').innerHTML = `<div style="text-align:center"><div style="font-size:28px;margin-bottom:10px">😕</div>${esc(msg)}</div>`;
}

function activarRevelado() {
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.c-reveal').forEach(el => el.classList.add('visible')); return; }
  const obs = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold:.08, rootMargin:'0px 0px -30px 0px' });
  document.querySelectorAll('.c-reveal').forEach(el => obs.observe(el));
}

function renderTodo() {
  renderHeaderYHero();
  renderDestacado();
  renderVistaCategoriasOProductos();
  document.getElementById('c-footer-nombre').textContent = CATALOGO.nombre_comercial || CATALOGO.nombre;
}

function renderHeaderYHero() {
  const c = CATALOGO;
  document.title = c.nombre_comercial || c.nombre;
  document.getElementById('c360p-desc-meta').setAttribute('content', c.descripcion || '');
  document.getElementById('c360p-og-title').setAttribute('content', c.nombre_comercial || c.nombre);
  document.getElementById('c360p-og-desc').setAttribute('content', c.descripcion || '');
  if (c.logo_url) document.getElementById('c360p-og-image').setAttribute('content', c.logo_url);

  document.getElementById('c-header-nombre').textContent = c.nombre_comercial || c.nombre;
  if (c.logo_url) {
    document.getElementById('c-header-logo').src = c.logo_url;
    document.getElementById('c-header-logo').style.display = 'block';
    document.getElementById('c-hero-logo').src = c.logo_url;
    document.getElementById('c-hero-logo').style.display = 'block';
  }
  document.getElementById('c-hero-marca').textContent = c.nombre_comercial || c.nombre;
  document.getElementById('c-hero-titulo').textContent = c.nombre;
  document.getElementById('c-hero-desc').textContent = c.descripcion || '';
  document.getElementById('c-hero-desc').style.display = c.descripcion ? 'block' : 'none';

  const heroEl = document.getElementById('c-hero');
  const heroInEl = document.getElementById('c-hero-in');
  if (c.banner_url) {
    // 1) El dueño subió un banner manual -- se respeta, tiene prioridad.
    heroEl.classList.add('con-imagen');
    const bg = document.getElementById('c-hero-bg');
    bg.style.backgroundImage = `url('${c.banner_url}')`;
    bg.classList.add('activo');
  } else {
    // 2) Sin banner manual -- el sistema arma un mosaico real con las
    // fotos de los propios productos (nunca le pedimos al usuario que
    // diseñe nada). Se priorizan destacados, se evitan fotos repetidas.
    const fotosReales = [];
    const vistos = new Set();
    const ordenados = [...PRODUCTOS].sort((a,b) => (b.destacado?1:0) - (a.destacado?1:0));
    for (const p of ordenados) {
      const foto = p.fotos.find(f => f.es_principal) || p.fotos[0];
      if (foto && !vistos.has(foto.url)) { fotosReales.push(foto.url); vistos.add(foto.url); }
      if (fotosReales.length >= 3) break;
    }
    if (fotosReales.length) {
      const mosaico = document.getElementById('c-hero-mosaico');
      mosaico.classList.remove('vacio');
      mosaico.classList.toggle('una-sola', fotosReales.length === 1);
      mosaico.innerHTML = fotosReales.map(url => `<img src="${esc(url)}" alt="" loading="lazy">`).join('');
      const etiqueta = document.getElementById('c-hero-etiqueta');
      etiqueta.style.display = 'block';
      etiqueta.textContent = `${PRODUCTOS.length} PRODUCTO${PRODUCTOS.length===1?'':'S'}`;
    } else {
      document.getElementById('c-hero-mosaico').classList.add('vacio');
      // 3) Todavia no hay ninguna foto de producto -- en vez de un
      // hero vacio, se genera una textura propia con el color del
      // catalogo (nunca un bloque plano sin diseño).
      heroEl.classList.add('c-hero-patron');
    }
  }

  const ctaDiv = document.getElementById('c-hero-cta');
  if (c.whatsapp) {
    window.c_urlWhatsappHero = linkWhatsapp(c.whatsapp, `Hola, vi su catálogo ${esc(c.nombre_comercial||'')} y tengo una consulta.`);
    ctaDiv.innerHTML = `<a class="c-btn" href="${window.c_urlWhatsappHero}" target="_blank" onclick="registrarEvento('click_whatsapp')">💬 Escribir por WhatsApp</a>`;
    document.getElementById('c-btn-flotante-wa').style.display = 'flex';
    const navContacto = document.getElementById('c-nav-contacto');
    navContacto.style.display = 'inline';
    navContacto.href = window.c_urlWhatsappHero;
    navContacto.target = '_blank';
    navContacto.onclick = () => registrarEvento('click_whatsapp');
  } else {
    ctaDiv.innerHTML = '';
  }

  const info = document.getElementById('c-hero-contacto');
  let filas = '';
  if (c.telefono) filas += `<a href="tel:${esc(c.telefono)}" onclick="registrarEvento('click_telefono')">📞 ${esc(c.telefono)}</a>`;
  if (c.email) filas += `<span>✉️ ${esc(c.email)}</span>`;
  if (c.ubicacion) filas += `<span>📍 ${esc(c.ubicacion)}</span>`;
  info.innerHTML = filas;
}

function insertarDatosEstructurados() {
  const existente = document.getElementById('c-jsonld');
  if (existente) existente.remove();
  const data = {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": CATALOGO.nombre_comercial || CATALOGO.nombre,
    "description": CATALOGO.descripcion || undefined,
    "telephone": CATALOGO.telefono || undefined,
    "image": CATALOGO.logo_url || undefined,
    "makesOffer": PRODUCTOS.slice(0, 30).map(p => ({
      "@type": "Offer",
      "itemOffered": { "@type": "Product", "name": p.nombre, "image": (p.fotos.find(f=>f.es_principal)||p.fotos[0])?.url || undefined },
      "price": String((p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio),
      "priceCurrency": "NIO",
      "availability": p.etiqueta === 'agotado' ? "https://schema.org/OutOfStock" : "https://schema.org/InStock"
    }))
  };
  const script = document.createElement('script');
  script.id = 'c-jsonld'; script.type = 'application/ld+json';
  script.textContent = JSON.stringify(data);
  document.head.appendChild(script);
}
function renderDestacado() {
  const destacados = PRODUCTOS.filter(p => p.destacado);
  const seccionGrande = document.getElementById('c-seccion-destacado');
  const seccionResto = document.getElementById('c-seccion-mas-destacados');
  insertarDatosEstructurados();

  if (!destacados.length) { seccionGrande.style.display = 'none'; seccionResto.style.display = 'none'; return; }

  seccionGrande.style.display = 'block';
  const p = destacados[0];
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const principal = p.fotos.find(f => f.es_principal) || p.fotos[0];
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;

  document.getElementById('c-destacado').innerHTML = `
    <div class="c-destacado-media">
      <img class="c-destacado-img" id="c-destacado-img-principal" src="${esc(principal?.url||'')}" alt="${esc(p.nombre)}" onclick="abrirModalProducto('${p.id}')">
      ${p.fotos.length > 1 ? `<div class="c-destacado-thumbs">${p.fotos.map(f => `<img class="c-destacado-thumb ${f.id===principal?.id?'activa':''}" src="${esc(f.url)}" onclick="cambiarFotoDestacado(this,'${esc(f.url)}')">`).join('')}</div>` : ''}
    </div>
    <div class="c-destacado-info">
      ${cat ? `<div class="c-destacado-cat">${esc(cat.nombre)}</div>` : ''}
      <h2 class="c-destacado-nombre">${esc(p.nombre)}</h2>
      ${p.descripcion ? `<p class="c-destacado-desc">${esc(p.descripcion)}</p>` : ''}
      <div class="c-precio-row">
        <span class="c-precio ${enOferta?'con-oferta':''}">${fmtC(enOferta?p.precio_oferta:p.precio)}</span>
        ${enOferta ? `<span class="c-precio-tachado">${fmtC(p.precio)}</span>` : ''}
      </div>
      ${CATALOGO.whatsapp ? `<button class="c-btn" style="align-self:flex-start" onclick="consultarProducto('${p.id}')">💬 Consultar disponibilidad</button>` : ''}
    </div>`;

  const resto = destacados.slice(1);
  if (resto.length) {
    seccionResto.style.display = 'block';
    const grid = document.getElementById('c-grid-mas-destacados');
    grid.className = 'c-grid' + (resto.length <= 3 ? ' pocas' : '');
    grid.innerHTML = resto.map(tarjetaProductoHTML).join('');
  } else {
    seccionResto.style.display = 'none';
  }
}
function cambiarFotoDestacado(imgEl, url) {
  document.getElementById('c-destacado-img-principal').src = url;
  document.querySelectorAll('.c-destacado-thumb').forEach(t => t.classList.remove('activa'));
  imgEl.classList.add('activa');
}
function consultarProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p || !CATALOGO.whatsapp) return;
  const precio = (p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio;
  registrarEvento('click_whatsapp', p.id);
  window.open(linkWhatsapp(CATALOGO.whatsapp, `Hola, estoy interesado en "${p.nombre}" (${fmtC(precio)}) de su catálogo.`), '_blank');
}

let ORDEN_ACTUAL = 'reciente';
let TEXTO_BUSQUEDA = '';
let PRECIO_MAX_ACTIVO = null;
let SOLO_FAVORITOS = false;
let FAVORITOS = [];
try { FAVORITOS = JSON.parse(localStorage.getItem('c360p_favoritos') || '[]'); } catch(e) { FAVORITOS = []; }

function toggleFavorito(id) {
  const idx = FAVORITOS.indexOf(id);
  if (idx === -1) FAVORITOS.push(id); else FAVORITOS.splice(idx, 1);
  localStorage.setItem('c360p_favoritos', JSON.stringify(FAVORITOS));
  aplicarFiltroYOrden();
  renderChipsCategorias();
}

function renderVistaCategoriasOProductos() {
  configurarFiltroPrecio();
  renderChipsCategorias();
  renderMigas();
  aplicarFiltroYOrden();
}

function configurarFiltroPrecio() {
  if (!PRODUCTOS.length) return;
  const precioReal = p => (p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio;
  const max = Math.max(...PRODUCTOS.map(precioReal));
  const slider = document.getElementById('c-precio-slider');
  slider.max = Math.ceil(max);
  slider.value = Math.ceil(max);
  PRECIO_MAX_ACTIVO = Math.ceil(max);
  document.getElementById('c-precio-label').textContent = 'Hasta ' + fmtC(PRECIO_MAX_ACTIVO);
}
function onCambiarPrecio(valor) {
  PRECIO_MAX_ACTIVO = Number(valor);
  const slider = document.getElementById('c-precio-slider');
  document.getElementById('c-precio-label').textContent = PRECIO_MAX_ACTIVO >= Number(slider.max) ? 'Cualquier precio' : 'Hasta ' + fmtC(PRECIO_MAX_ACTIVO);
  aplicarFiltroYOrden();
}
function onBuscar(valor) { TEXTO_BUSQUEDA = valor.trim().toLowerCase(); aplicarFiltroYOrden(); }

function renderChipsCategorias() {
  const barra = document.getElementById('c-filtros-barra');
  const cont = document.getElementById('c-chips-categorias');
  if (!PRODUCTOS.length) { barra.style.display = 'none'; return; }
  barra.style.display = 'block';
  let chips = `<div class="c-chip ${!CATEGORIA_VISTA_ACTUAL && !SOLO_FAVORITOS?'activo':''}" onclick="filtrarPorCategoria(null)">Todos</div>`;
  chips += CATEGORIAS.map(cat => `<div class="c-chip ${CATEGORIA_VISTA_ACTUAL?.id===cat.id?'activo':''}" onclick="filtrarPorCategoria('${cat.id}')">${esc(cat.nombre)}</div>`).join('');
  if (FAVORITOS.length) chips += `<div class="c-chip ${SOLO_FAVORITOS?'activo':''}" onclick="toggleSoloFavoritos()">❤️ Mis favoritos (${FAVORITOS.length})</div>`;
  cont.innerHTML = chips;
}
function toggleSoloFavoritos() {
  SOLO_FAVORITOS = !SOLO_FAVORITOS;
  if (SOLO_FAVORITOS) CATEGORIA_VISTA_ACTUAL = null;
  renderChipsCategorias();
  renderMigas();
  aplicarFiltroYOrden();
}
function filtrarPorCategoria(id) {
  CATEGORIA_VISTA_ACTUAL = id ? CATEGORIAS.find(c => c.id === id) : null;
  SOLO_FAVORITOS = false;
  renderChipsCategorias();
  renderMigas();
  aplicarFiltroYOrden();
}
function renderMigas() {
  const el = document.getElementById('c-migas');
  if (!CATEGORIA_VISTA_ACTUAL && !SOLO_FAVORITOS) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const actual = SOLO_FAVORITOS ? 'Mis favoritos' : CATEGORIA_VISTA_ACTUAL.nombre;
  el.innerHTML = `<a onclick="filtrarPorCategoria(null)">Inicio</a> <span>›</span> <span>${esc(actual)}</span>`;
}
function cambiarOrden(valor) { ORDEN_ACTUAL = valor; aplicarFiltroYOrden(); }

function aplicarFiltroYOrden() {
  let lista = CATEGORIA_VISTA_ACTUAL ? PRODUCTOS.filter(p => p.categoria_id === CATEGORIA_VISTA_ACTUAL.id) : PRODUCTOS.slice();
  const precioReal = p => (p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio;
  if (SOLO_FAVORITOS) lista = lista.filter(p => FAVORITOS.includes(p.id));
  if (TEXTO_BUSQUEDA) lista = lista.filter(p => p.nombre.toLowerCase().includes(TEXTO_BUSQUEDA));
  if (PRECIO_MAX_ACTIVO != null) lista = lista.filter(p => precioReal(p) <= PRECIO_MAX_ACTIVO);
  if (ORDEN_ACTUAL === 'precio_asc') lista.sort((a,b) => precioReal(a) - precioReal(b));
  else if (ORDEN_ACTUAL === 'precio_desc') lista.sort((a,b) => precioReal(b) - precioReal(a));
  else if (ORDEN_ACTUAL === 'nombre') lista.sort((a,b) => a.nombre.localeCompare(b.nombre));
  else lista.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  renderGridProductos(lista);
}

function tarjetaProductoHTML(p, esGrande) {
  const principal = p.fotos.find(f => f.es_principal) || p.fotos[0];
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;
  const agotado = p.etiqueta === 'agotado';
  const tagTexto = { nuevo:'Nuevo', oferta:'Oferta' }[p.etiqueta];
  const esFav = FAVORITOS.includes(p.id);
  return `
    <div class="c-card ${agotado?'agotada':''} ${esGrande?'grande':''}">
      <div class="c-card-media" onclick="abrirModalProducto('${p.id}')">
        ${tagTexto ? `<span class="c-card-tag ${p.etiqueta}">${tagTexto}</span>` : ''}
        <span class="c-card-disp ${agotado?'agotado':''}">${agotado?'Agotado':'Disponible'}</span>
        <button class="c-fav-btn ${esFav?'activo':''}" onclick="event.stopPropagation();toggleFavorito('${p.id}')" aria-label="Favorito">${esFav?'❤️':'🤍'}</button>
        ${principal ? `<img src="${esc(principal.url)}" loading="lazy" alt="${esc(p.nombre)}">` : ''}
      </div>
      <div class="c-card-body">
        ${cat ? `<div class="c-card-cat">${esc(cat.nombre)}</div>` : ''}
        <div class="c-card-nombre" onclick="abrirModalProducto('${p.id}')">${esc(p.nombre)}</div>
        <div class="c-card-precio-row">
          <span class="c-card-precio ${enOferta?'con-oferta':''}">${fmtC(enOferta?p.precio_oferta:p.precio)}</span>
          ${enOferta ? `<span class="c-card-tachado">${fmtC(p.precio)}</span>` : ''}
        </div>
        ${(!agotado) ? `<div class="c-card-botones">
          ${CATALOGO.whatsapp ? `<button class="c-card-accion-rapida wa" onclick="event.stopPropagation();consultarProducto('${p.id}')" title="Consultar por WhatsApp">💬</button>` : ''}
          ${CATALOGO.telefono ? `<a class="c-card-accion-rapida llamar" href="tel:${esc(CATALOGO.telefono)}" onclick="event.stopPropagation();registrarEvento('click_telefono')" title="Llamar">📞</a>` : ''}
          <button class="c-card-accion-rapida compartir" onclick="event.stopPropagation();compartirProducto('${p.id}')" title="Compartir">🔗</button>
        </div>` : ''}
      </div>
    </div>`;
}
function mostrarToast(mensaje) {
  const wrap = document.getElementById('c-toast-wrap');
  const t = document.createElement('div');
  t.className = 'c-toast';
  t.textContent = mensaje;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function compartirProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p) return;
  const url = `${window.location.href.split('#')[0]}#producto-${id}`;
  if (navigator.share) {
    navigator.share({ title: p.nombre, text: `${p.nombre} — ${fmtC(p.precio)}`, url }).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url);
    mostrarToast('🔗 Enlace copiado');
  }
}
function renderGridProductos(lista) {
  document.getElementById('c-conteo-productos').textContent = lista.length ? `${lista.length} producto${lista.length===1?'':'s'}` : '';
  const grid = document.getElementById('c-grid-productos');
  if (!lista.length) { grid.innerHTML = `<div class="c-vacio" style="width:100%">Todavía no hay productos aquí.</div>`; return; }
  grid.className = 'c-grid' + (lista.length <= 3 ? ' pocas' : '');
  const usaRitmo = lista.length >= 6;
  grid.innerHTML = lista.map((p, i) => tarjetaProductoHTML(p, usaRitmo && i % 5 === 0)).join('');
}

let FOTOS_MODAL_ACTUAL = [];
let VISTOS_RECIENTEMENTE = [];
try { VISTOS_RECIENTEMENTE = JSON.parse(localStorage.getItem('c360p_vistos') || '[]'); } catch(e) { VISTOS_RECIENTEMENTE = []; }

function abrirModalProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p) return;
  registrarEvento('vista_producto', id);
  registrarVisto(id);
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;

  const catEl = document.getElementById('c-modal-cat');
  catEl.textContent = cat ? cat.nombre : '';
  catEl.style.display = cat ? 'block' : 'none';
  document.getElementById('c-modal-nombre').textContent = p.nombre;
  document.getElementById('c-modal-precio').textContent = fmtC(enOferta ? p.precio_oferta : p.precio);
  document.getElementById('c-modal-precio').className = 'c-precio' + (enOferta ? ' con-oferta' : '');
  const tachadoEl = document.getElementById('c-modal-precio-tachado');
  tachadoEl.style.display = enOferta ? 'inline' : 'none';
  if (enOferta) tachadoEl.textContent = fmtC(p.precio);
  document.getElementById('c-modal-desc').textContent = p.descripcion || '';
  FOTOS_MODAL_ACTUAL = p.fotos.map(f => f.url);
  document.getElementById('c-modal-fotos').innerHTML = p.fotos.length ? p.fotos.map(f => `<img src="${esc(f.url)}" alt="">`).join('') : '';

  const btnWa = document.getElementById('c-modal-whatsapp');
  if (CATALOGO.whatsapp && p.etiqueta !== 'agotado') {
    btnWa.style.display = 'flex'; btnWa.disabled = false;
    btnWa.textContent = '💬 Consultar por WhatsApp';
    btnWa.onclick = () => consultarProducto(p.id);
  } else if (p.etiqueta === 'agotado') {
    btnWa.style.display = 'flex'; btnWa.disabled = true;
    btnWa.textContent = 'Agotado por ahora'; btnWa.onclick = null;
  } else {
    btnWa.style.display = 'none';
  }
  renderRelacionados(p);
  document.getElementById('c-modal').classList.add('open');
}
function cerrarModalProducto() { document.getElementById('c-modal').classList.remove('open'); }

function indexFotoClic(ev) {
  const img = ev.target.closest('img');
  if (!img) return 0;
  return Array.from(img.parentElement.children).indexOf(img);
}
function registrarVisto(id) {
  VISTOS_RECIENTEMENTE = VISTOS_RECIENTEMENTE.filter(v => v !== id);
  VISTOS_RECIENTEMENTE.unshift(id);
  VISTOS_RECIENTEMENTE = VISTOS_RECIENTEMENTE.slice(0, 8);
  localStorage.setItem('c360p_vistos', JSON.stringify(VISTOS_RECIENTEMENTE));
  renderVistos();
}
function renderVistos() {
  const seccion = document.getElementById('c-seccion-vistos');
  const otrosVistos = VISTOS_RECIENTEMENTE.filter(id => PRODUCTOS.some(p => p.id === id));
  if (otrosVistos.length < 2) { seccion.style.display = 'none'; return; }
  seccion.style.display = 'block';
  const lista = otrosVistos.map(id => PRODUCTOS.find(p => p.id === id)).filter(Boolean);
  const grid = document.getElementById('c-grid-vistos');
  grid.className = 'c-grid' + (lista.length <= 3 ? ' pocas' : '');
  grid.innerHTML = lista.map(tarjetaProductoHTML).join('');
}
function renderRelacionados(p) {
  const wrap = document.getElementById('c-relacionados-wrap');
  if (!p.categoria_id) { wrap.style.display = 'none'; return; }
  const relacionados = PRODUCTOS.filter(x => x.id !== p.id && x.categoria_id === p.categoria_id).slice(0, 6);
  if (!relacionados.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  document.getElementById('c-relacionados').innerHTML = relacionados.map(r => {
    const foto = r.fotos.find(f => f.es_principal) || r.fotos[0];
    return `<div class="c-relacionado-mini" onclick="abrirModalProducto('${r.id}')">
      ${foto ? `<img src="${esc(foto.url)}" loading="lazy">` : `<div style="width:110px;height:110px;background:var(--surface-2);border-radius:8px"></div>`}
      <div class="nombre">${esc(r.nombre)}</div>
      <div class="precio">${fmtC(r.precio)}</div>
    </div>`;
  }).join('');
}

/* ===== Lightbox de fotos ===== */
let LIGHTBOX_FOTOS = [], LIGHTBOX_INDICE = 0;
function abrirLightbox(fotos, indice) {
  if (!fotos || !fotos.length) return;
  LIGHTBOX_FOTOS = fotos; LIGHTBOX_INDICE = indice || 0;
  document.getElementById('c-lightbox-img').src = LIGHTBOX_FOTOS[LIGHTBOX_INDICE];
  document.getElementById('c-lightbox-contador').textContent = `${LIGHTBOX_INDICE+1} / ${LIGHTBOX_FOTOS.length}`;
  document.getElementById('c-lightbox').classList.add('open');
}
function cerrarLightbox() { document.getElementById('c-lightbox').classList.remove('open'); }
function moverLightbox(delta) {
  LIGHTBOX_INDICE = (LIGHTBOX_INDICE + delta + LIGHTBOX_FOTOS.length) % LIGHTBOX_FOTOS.length;
  document.getElementById('c-lightbox-img').src = LIGHTBOX_FOTOS[LIGHTBOX_INDICE];
  document.getElementById('c-lightbox-contador').textContent = `${LIGHTBOX_INDICE+1} / ${LIGHTBOX_FOTOS.length}`;
}
document.addEventListener('keydown', (e) => {
  if (document.getElementById('c-lightbox').classList.contains('open')) {
    if (e.key === 'Escape') cerrarLightbox();
    if (e.key === 'ArrowLeft') moverLightbox(-1);
    if (e.key === 'ArrowRight') moverLightbox(1);
    return;
  }
  if (e.key === 'Escape' && document.getElementById('c-modal').classList.contains('open')) cerrarModalProducto();
});

init();
</script>
</body>
