<style>
:root {
  --bg:        #fafafa;
  --surface:   #ffffff;
  --surface-2: #f2f2f4;
  --border:    #e6e6ea;
  --text:      #16161a;
  --text-2:    #55565f;
  --text-3:    #94959e;
  --accent:    #6366f1;
  --accent-rgb: 99,102,241;
  --accent-ink: #ffffff;
  --danger:    #d64545;
  --on-dark:   #f5f5f7;
  --on-dark-2: #b3b4bd;
  --font-display: 'Newsreader', Georgia, serif;
  --font-ui: 'Plus Jakarta Sans', sans-serif;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 48px; --sp-9: 64px; --sp-10: 96px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px;
  --shadow-1: 0 1px 2px rgba(20,20,25,.04), 0 1px 1px rgba(20,20,25,.03);
  --shadow-2: 0 12px 24px -8px rgba(20,20,25,.14);
  --max-w: 1240px;
}
html[data-theme="oscuro"] {
  --bg: #0b0b0e; --surface: #141418; --surface-2: #1b1b21; --border: #26262e;
  --text: #f2f2f5; --text-2: #a6a7b0; --text-3: #6c6d78;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 16px 32px -8px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin:0; font-family:var(--font-ui); background:var(--bg); color:var(--text);
  transition:background .25s ease, color .25s ease; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img { max-width:100%; display:block; }
a { color:inherit; text-decoration:none; }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.c360-container { max-width:var(--max-w); margin:0 auto; padding:0 var(--sp-5); }
@media (min-width:900px) { .c360-container { padding:0 var(--sp-8); } }
@keyframes c-fade-up { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes c-fade { from { opacity:0; } to { opacity:1; } }
.c-reveal { opacity:0; transform:translateY(16px); transition:opacity .5s cubic-bezier(.22,1,.36,1), transform .5s cubic-bezier(.22,1,.36,1); }
.c-reveal.visible { opacity:1; transform:translateY(0); }
.c360p-loader { display:flex; align-items:center; justify-content:center; min-height:70vh; color:var(--text-3); font-size:13px; letter-spacing:.02em; }
.c-header {
  position:sticky; top:0; z-index:30; border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px); background:color-mix(in srgb, var(--bg) 85%, transparent);
}
.c-header-in { display:flex; align-items:center; gap:var(--sp-3); padding:var(--sp-3) 0; }
.c-header-logo { width:32px; height:32px; border-radius:var(--radius-sm); object-fit:cover; flex-shrink:0; }
.c-header-nombre { font-weight:700; font-size:14px; letter-spacing:-.01em; }
.c-theme-btn {
  margin-left:auto; width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface);
  color:var(--text-2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;
  transition:transform .35s cubic-bezier(.22,1,.36,1), border-color .2s, color .2s;
}
.c-theme-btn:hover { transform:rotate(20deg); border-color:var(--accent); color:var(--accent); }
.c-preview-banner {
  display:none; background:#1a1a1a; color:#fff; text-align:center; font-size:12px; font-weight:600;
  padding:var(--sp-2) var(--sp-4); letter-spacing:.02em;
}
.c-hero { position:relative; background:var(--surface-2); overflow:hidden; }
.c-hero-bg {
  position:absolute; inset:0; background-size:cover; background-position:center;
  opacity:0; transition:opacity .6s ease;
}
.c-hero-bg.activo { opacity:1; }
.c-hero-bg::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,10,14,.35) 0%, rgba(10,10,14,.78) 100%);
}
.c-hero-in {
  position:relative; z-index:1; padding:var(--sp-8) 0 var(--sp-7);
  display:flex; flex-direction:column; gap:var(--sp-5);
}
@media (min-width:700px) { .c-hero-in { padding:var(--sp-9) 0 var(--sp-8); } }
.c-hero.con-imagen .c-hero-in { color:var(--on-dark); }
.c-hero-eyebrow {
  display:flex; align-items:center; gap:var(--sp-2); font-size:12.5px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; color:var(--accent);
}
.c-hero.con-imagen .c-hero-eyebrow { color:#fff; opacity:.9; }
.c-hero-eyebrow img { width:22px; height:22px; border-radius:6px; object-fit:cover; }
.c-hero-titulo {
  font-family:var(--font-display); font-weight:500; font-style:italic;
  font-size:clamp(30px, 5.2vw, 52px); line-height:1.05; letter-spacing:-.01em; margin:0; max-width:14ch;
}
.c-hero-desc {
  font-size:clamp(13.5px,1.6vw,15.5px); color:var(--text-2); max-width:46ch; line-height:1.6; margin:0;
}
.c-hero.con-imagen .c-hero-desc { color:var(--on-dark-2); }
.c-hero-acciones { display:flex; align-items:center; flex-wrap:wrap; gap:var(--sp-4); margin-top:var(--sp-2); }
.c-hero-contacto { display:flex; flex-wrap:wrap; gap:var(--sp-4); font-size:12.5px; color:var(--text-2); }
.c-hero.con-imagen .c-hero-contacto { color:var(--on-dark-2); }
.c-hero-contacto a, .c-hero-contacto span { display:inline-flex; align-items:center; gap:6px; }
.c-hero-contacto a:hover { color:var(--accent); }
.c-hero.con-imagen .c-hero-contacto a:hover { color:#fff; }
.c-btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 22px; border-radius:999px; font-weight:700; font-size:13.5px; border:none; cursor:pointer;
  background:var(--accent); color:var(--accent-ink);
  box-shadow:0 6px 16px -4px rgba(var(--accent-rgb),.5);
  transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .2s;
}
.c-btn:hover { transform:translateY(-2px); box-shadow:0 10px 22px -4px rgba(var(--accent-rgb),.62); }
.c-btn:active { transform:translateY(0); }
.c-btn.c-btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); box-shadow:none; }
.c-hero.con-imagen .c-btn.c-btn-ghost { color:#fff; border-color:rgba(255,255,255,.35); }
.c-btn.c-btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
.c-btn.c-btn-sm { padding:9px 16px; font-size:12.5px; }
.c-btn:disabled { opacity:.5; cursor:not-allowed; box-shadow:none; transform:none; }
.c-seccion { padding:var(--sp-8) 0; }
.c-seccion + .c-seccion { border-top:1px solid var(--border); }
.c-seccion-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-4); margin-bottom:var(--sp-6); }
.c-seccion-titulo { font-size:19px; font-weight:800; letter-spacing:-.01em; display:flex; align-items:center; gap:var(--sp-2); }
.c-seccion-conteo { font-size:12.5px; color:var(--text-3); font-weight:600; }
.c-volver {
  background:none; border:none; color:var(--text-2); font-weight:700; font-size:13px; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; padding:0; margin-bottom:var(--sp-3); transition:color .15s;
}
.c-volver:hover { color:var(--accent); }
.c-destacado { display:grid; grid-template-columns:1fr; gap:var(--sp-7); align-items:start; }
@media (min-width:800px) { .c-destacado { grid-template-columns:1.15fr 1fr; gap:var(--sp-9); } }
.c-destacado-media { position:relative; }
.c-destacado-img {
  width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:var(--radius-lg); background:var(--surface-2);
  cursor:zoom-in;
}
.c-destacado-thumbs { display:flex; gap:var(--sp-2); margin-top:var(--sp-3); }
.c-destacado-thumb {
  width:52px; height:52px; border-radius:var(--radius-sm); object-fit:cover; cursor:pointer;
  border:2px solid transparent; opacity:.55; transition:opacity .2s, border-color .2s;
}
.c-destacado-thumb.activa { opacity:1; border-color:var(--accent); }
.c-destacado-info { display:flex; flex-direction:column; padding-top:var(--sp-2); }
@media (min-width:800px) { .c-destacado-info { padding-top:var(--sp-6); } }
.c-destacado-cat { font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); margin-bottom:var(--sp-2); }
.c-destacado-nombre { font-family:var(--font-display); font-size:clamp(24px,3vw,32px); font-weight:500; margin:0 0 var(--sp-3); line-height:1.15; }
.c-destacado-desc { font-size:14px; color:var(--text-2); line-height:1.65; margin:0 0 var(--sp-5); max-width:52ch; }
.c-precio-row { display:flex; align-items:baseline; gap:var(--sp-3); margin-bottom:var(--sp-6); }
.c-precio { font-size:26px; font-weight:800; letter-spacing:-.01em; }
.c-precio.con-oferta { color:var(--danger); }
.c-precio-tachado { font-size:15px; color:var(--text-3); text-decoration:line-through; font-weight:500; }
.c-grid { display:flex; flex-wrap:wrap; justify-content:flex-start; gap:var(--sp-5); }
.c-grid.pocas { justify-content:center; }
.c-card {
  flex:1 1 220px; max-width:270px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-md); overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
  transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s, border-color .3s;
}
.c-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-2); border-color:transparent; }
.c-card-media { position:relative; aspect-ratio:1/1; background:var(--surface-2); overflow:hidden; }
.c-card-media img { width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.22,1,.36,1); }
.c-card:hover .c-card-media img { transform:scale(1.06); }
.c-card-tag {
  position:absolute; top:var(--sp-2); left:var(--sp-2); font-size:10.5px; font-weight:700; letter-spacing:.02em;
  padding:3px 9px; border-radius:6px; background:var(--surface); color:var(--text);
}
.c-card-tag.oferta { background:var(--danger); color:#fff; }
.c-card-tag.nuevo { background:var(--text); color:var(--bg); }
.c-card.agotada { opacity:.55; }
.c-card-body { padding:var(--sp-4); display:flex; flex-direction:column; gap:2px; flex:1; }
.c-card-cat { font-size:10.5px; color:var(--text-3); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
.c-card-nombre { font-size:13.5px; font-weight:700; line-height:1.35; margin:2px 0 6px; }
.c-card-precio-row { display:flex; align-items:baseline; gap:6px; margin-top:auto; }
.c-card-precio { font-weight:800; font-size:14.5px; }
.c-card-precio.con-oferta { color:var(--danger); }
.c-card-tachado { font-size:11px; color:var(--text-3); text-decoration:line-through; }
.c-cat-card {
  flex:1 1 200px; max-width:260px; border-radius:var(--radius-md); overflow:hidden; cursor:pointer;
  position:relative; aspect-ratio:4/3; background:var(--surface-2);
  transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.c-cat-card:hover { transform:translateY(-4px); }
.c-cat-card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
.c-cat-card:hover img { transform:scale(1.07); }
.c-cat-card::after {
  content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 40%, rgba(10,10,14,.82) 100%);
}
.c-cat-card-info { position:absolute; left:0; right:0; bottom:0; z-index:1; padding:var(--sp-4); color:#fff; }
.c-cat-card-nombre { font-weight:800; font-size:15px; margin-bottom:2px; }
.c-cat-card-count { font-size:11.5px; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:5px; }
.c-cat-card-count svg { transition:transform .25s; }
.c-cat-card:hover .c-cat-card-count svg { transform:translateX(3px); }
.c-vacio { text-align:center; padding:var(--sp-9) var(--sp-4); color:var(--text-3); font-size:13.5px; }
.c-footer { border-top:1px solid var(--border); padding:var(--sp-6) 0; }
.c-footer-in { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--sp-3); font-size:12px; color:var(--text-3); }
.c-footer-in a { font-weight:700; color:var(--text-2); }
.c-footer-in a:hover { color:var(--accent); }
.c-modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(10,10,14,.6); z-index:100;
  align-items:flex-end; justify-content:center; backdrop-filter:blur(2px);
}
.c-modal-overlay.open { display:flex; animation:c-fade .2s ease; }
@keyframes c-modal-in { from { opacity:0; transform:translateY(30px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
.c-modal {
  background:var(--surface); width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0; animation:c-modal-in .3s cubic-bezier(.22,1,.36,1);
}
@media (min-width:640px) { .c-modal-overlay { align-items:center; } .c-modal { border-radius:var(--radius-lg); } }
.c-modal-close {
  position:sticky; top:var(--sp-3); margin:0 var(--sp-3) 0 auto; width:32px; height:32px; border-radius:50%;
  background:rgba(0,0,0,.5); color:#fff; border:none; cursor:pointer; display:flex; align-items:center;
  justify-content:center; z-index:5; font-size:15px;
}
.c-modal-fotos { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; margin-top:-40px; }
.c-modal-fotos img { width:100%; flex-shrink:0; scroll-snap-align:start; aspect-ratio:1/1; object-fit:cover; }
.c-modal-body { padding:var(--sp-5) var(--sp-6) var(--sp-7); }
.c-modal-cat { font-size:11.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
.c-modal-nombre { font-family:var(--font-display); font-size:22px; font-weight:500; margin-bottom:var(--sp-2); }
.c-modal-desc { font-size:13.5px; color:var(--text-2); line-height:1.6; margin-bottom:var(--sp-4); white-space:pre-wrap; }
@media (min-width:900px) { .c-hero-titulo { max-width:16ch; } }
</style>
</head>
<body>

<script>
const SUPABASE_URL = 'https://zvlincmqmmoclqhykejv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RY59EmL8V2zRkOQg7RUJAw_dw6yr69t';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let CATALOGO = null, PRODUCTOS = [], CATEGORIAS = [], CATEGORIA_VISTA_ACTUAL = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtC(n) { return 'C$' + Number(n||0).toLocaleString('es-NI', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function linkWhatsapp(numero, texto) {
  const limpio = (numero||'').replace(/[^\d]/g,'');
  return `https://wa.me/${limpio}?text=${encodeURIComponent(texto)}`;
}
function hexARgb(hex) {
  const limpio = (hex || '#6366f1').replace('#','');
  const bigint = parseInt(limpio.length === 3 ? limpio.split('').map(c=>c+c).join('') : limpio, 16);
  if (isNaN(bigint)) return '99,102,241';
  return `${(bigint>>16)&255},${(bigint>>8)&255},${bigint&255}`;
}

function toggleTemaPublico() {
  const actual = document.documentElement.getAttribute('data-theme');
  const nuevo = actual === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.setAttribute('data-theme', nuevo);
  document.getElementById('c-theme-btn').textContent = nuevo === 'oscuro' ? '☀' : '🌙';
  localStorage.setItem('c360p_tema', nuevo);
}

function registrarEvento(tipo, productoId) {
  if (CATALOGO && !new URLSearchParams(window.location.search).get('preview')) {
    sb.rpc('catalogo_registrar_evento', { p_catalogo_id: CATALOGO.id, p_tipo_evento: tipo, p_producto_id: productoId || null }).then(()=>{}).catch(()=>{});
  }
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('c');
  const idPreview = params.get('preview');
  if (!slug && !idPreview) { mostrarError('Enlace de catálogo no válido.'); return; }

  let catalogo, error;
  if (idPreview) {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.user) { mostrarError('Inicia sesión en Negocio360 para ver la vista previa.'); return; }
    ({ data: catalogo, error } = await sb.from('catalogos').select('*').eq('id', idPreview).maybeSingle());
  } else {
    ({ data: catalogo, error } = await sb.from('catalogos').select('*').eq('slug_publico', slug).eq('estado', 'publicado').maybeSingle());
  }
  if (error || !catalogo) { mostrarError('Este catálogo no existe o ya no está disponible.'); return; }
  CATALOGO = catalogo;
  if (idPreview && catalogo.estado !== 'publicado') document.getElementById('c-preview-banner').style.display = 'block';

  document.documentElement.style.setProperty('--accent', catalogo.color_acento || '#6366f1');
  document.documentElement.style.setProperty('--accent-rgb', hexARgb(catalogo.color_acento));

  const temaGuardado = localStorage.getItem('c360p_tema') || catalogo.tema_default || 'claro';
  document.documentElement.setAttribute('data-theme', temaGuardado);
  document.getElementById('c-theme-btn').textContent = temaGuardado === 'oscuro' ? '☀' : '🌙';

  const { data: productos } = await sb.from('catalogo_productos').select('*, catalogo_producto_fotos(*)')
    .eq('catalogo_id', catalogo.id).eq('activo', true).order('orden');
  PRODUCTOS = (productos || []).map(p => ({ ...p, fotos: (p.catalogo_producto_fotos||[]).sort((a,b)=>a.orden-b.orden) }));

  const { data: categorias } = await sb.from('catalogo_categorias').select('*').eq('catalogo_id', catalogo.id).order('orden');
  CATEGORIAS = categorias || [];

  renderTodo();

  if (!idPreview) registrarEvento('visita');

  document.getElementById('c360p-loader').style.display = 'none';
  document.getElementById('c360p-app').style.display = 'block';
  activarRevelado();
}

function mostrarError(msg) {
  document.getElementById('c360p-loader').innerHTML = `<div style="text-align:center"><div style="font-size:28px;margin-bottom:10px">😕</div>${esc(msg)}</div>`;
}

function activarRevelado() {
  if (!('IntersectionObserver' in window)) { document.querySelectorAll('.c-reveal').forEach(el => el.classList.add('visible')); return; }
  const obs = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold:.08, rootMargin:'0px 0px -30px 0px' });
  document.querySelectorAll('.c-reveal').forEach(el => obs.observe(el));
}

function renderTodo() {
  renderHeaderYHero();
  renderDestacado();
  renderVistaCategoriasOProductos();
  document.getElementById('c-footer-nombre').textContent = CATALOGO.nombre_comercial || CATALOGO.nombre;
}

function renderHeaderYHero() {
  const c = CATALOGO;
  document.title = c.nombre_comercial || c.nombre;
  document.getElementById('c360p-desc-meta').setAttribute('content', c.descripcion || '');
  document.getElementById('c360p-og-title').setAttribute('content', c.nombre_comercial || c.nombre);
  document.getElementById('c360p-og-desc').setAttribute('content', c.descripcion || '');
  if (c.logo_url) document.getElementById('c360p-og-image').setAttribute('content', c.logo_url);

  document.getElementById('c-header-nombre').textContent = c.nombre_comercial || c.nombre;
  if (c.logo_url) {
    document.getElementById('c-header-logo').src = c.logo_url;
    document.getElementById('c-header-logo').style.display = 'block';
    document.getElementById('c-hero-logo').src = c.logo_url;
    document.getElementById('c-hero-logo').style.display = 'block';
  }
  document.getElementById('c-hero-marca').textContent = c.nombre_comercial || c.nombre;
  document.getElementById('c-hero-titulo').textContent = c.nombre;
  document.getElementById('c-hero-desc').textContent = c.descripcion || '';
  document.getElementById('c-hero-desc').style.display = c.descripcion ? 'block' : 'none';

  const heroEl = document.getElementById('c-hero');
  if (c.banner_url) {
    heroEl.classList.add('con-imagen');
    const bg = document.getElementById('c-hero-bg');
    bg.style.backgroundImage = `url('${c.banner_url}')`;
    bg.classList.add('activo');
  }

  const ctaDiv = document.getElementById('c-hero-cta');
  ctaDiv.innerHTML = c.whatsapp
    ? `<a class="c-btn" href="${linkWhatsapp(c.whatsapp, `Hola, vi su catálogo ${esc(c.nombre_comercial||'')} y tengo una consulta.`)}" target="_blank" onclick="registrarEvento('click_whatsapp')">💬 Escribir por WhatsApp</a>`
    : '';

  const info = document.getElementById('c-hero-contacto');
  let filas = '';
  if (c.telefono) filas += `<a href="tel:${esc(c.telefono)}" onclick="registrarEvento('click_telefono')">📞 ${esc(c.telefono)}</a>`;
  if (c.email) filas += `<span>✉️ ${esc(c.email)}</span>`;
  if (c.ubicacion) filas += `<span>📍 ${esc(c.ubicacion)}</span>`;
  info.innerHTML = filas;
}

function renderDestacado() {
  const destacados = PRODUCTOS.filter(p => p.destacado);
  const seccionGrande = document.getElementById('c-seccion-destacado');
  const seccionResto = document.getElementById('c-seccion-mas-destacados');

  if (!destacados.length) { seccionGrande.style.display = 'none'; seccionResto.style.display = 'none'; return; }

  seccionGrande.style.display = 'block';
  const p = destacados[0];
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const principal = p.fotos.find(f => f.es_principal) || p.fotos[0];
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;

  document.getElementById('c-destacado').innerHTML = `
    <div class="c-destacado-media">
      <img class="c-destacado-img" id="c-destacado-img-principal" src="${esc(principal?.url||'')}" alt="${esc(p.nombre)}" onclick="abrirModalProducto('${p.id}')">
      ${p.fotos.length > 1 ? `<div class="c-destacado-thumbs">${p.fotos.map(f => `<img class="c-destacado-thumb ${f.id===principal?.id?'activa':''}" src="${esc(f.url)}" onclick="cambiarFotoDestacado(this,'${esc(f.url)}')">`).join('')}</div>` : ''}
    </div>
    <div class="c-destacado-info">
      ${cat ? `<div class="c-destacado-cat">${esc(cat.nombre)}</div>` : ''}
      <h2 class="c-destacado-nombre">${esc(p.nombre)}</h2>
      ${p.descripcion ? `<p class="c-destacado-desc">${esc(p.descripcion)}</p>` : ''}
      <div class="c-precio-row">
        <span class="c-precio ${enOferta?'con-oferta':''}">${fmtC(enOferta?p.precio_oferta:p.precio)}</span>
        ${enOferta ? `<span class="c-precio-tachado">${fmtC(p.precio)}</span>` : ''}
      </div>
      ${CATALOGO.whatsapp ? `<button class="c-btn" style="align-self:flex-start" onclick="consultarProducto('${p.id}')">💬 Consultar disponibilidad</button>` : ''}
    </div>`;

  const resto = destacados.slice(1);
  if (resto.length) {
    seccionResto.style.display = 'block';
    const grid = document.getElementById('c-grid-mas-destacados');
    grid.className = 'c-grid' + (resto.length <= 3 ? ' pocas' : '');
    grid.innerHTML = resto.map(tarjetaProductoHTML).join('');
  } else {
    seccionResto.style.display = 'none';
  }
}
function cambiarFotoDestacado(imgEl, url) {
  document.getElementById('c-destacado-img-principal').src = url;
  document.querySelectorAll('.c-destacado-thumb').forEach(t => t.classList.remove('activa'));
  imgEl.classList.add('activa');
}
function consultarProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p || !CATALOGO.whatsapp) return;
  const precio = (p.etiqueta==='oferta' && p.precio_oferta) ? p.precio_oferta : p.precio;
  registrarEvento('click_whatsapp', p.id);
  window.open(linkWhatsapp(CATALOGO.whatsapp, `Hola, estoy interesado en "${p.nombre}" (${fmtC(precio)}) de su catálogo.`), '_blank');
}

function renderVistaCategoriasOProductos() {
  const seccionCats = document.getElementById('c-seccion-categorias');
  const seccionProds = document.getElementById('c-seccion-productos');

  if (!CATEGORIAS.length) {
    seccionCats.style.display = 'none';
    seccionProds.style.display = 'block';
    document.getElementById('c-titulo-productos').textContent = 'Catálogo completo';
    document.getElementById('c-btn-volver').style.display = 'none';
    renderGridProductos(PRODUCTOS);
    return;
  }
  if (CATEGORIA_VISTA_ACTUAL) {
    seccionCats.style.display = 'none';
    seccionProds.style.display = 'block';
    document.getElementById('c-titulo-productos').textContent = CATEGORIA_VISTA_ACTUAL.nombre;
    document.getElementById('c-btn-volver').style.display = '';
    renderGridProductos(PRODUCTOS.filter(p => p.categoria_id === CATEGORIA_VISTA_ACTUAL.id));
  } else {
    seccionProds.style.display = 'none';
    seccionCats.style.display = 'block';
    renderGridCategorias();
  }
}
function renderGridCategorias() {
  const conteo = {};
  PRODUCTOS.forEach(p => { if (p.categoria_id) conteo[p.categoria_id] = (conteo[p.categoria_id]||0) + 1; });
  const grid = document.getElementById('c-grid-categorias');
  grid.className = 'c-grid' + (CATEGORIAS.length <= 3 ? ' pocas' : '');
  grid.innerHTML = CATEGORIAS.map(cat => `
    <div class="c-cat-card" onclick="verCategoria('${cat.id}')">
      ${cat.imagen_url ? `<img src="${esc(cat.imagen_url)}" loading="lazy" alt="${esc(cat.nombre)}">` : ''}
      <div class="c-cat-card-info">
        <div class="c-cat-card-nombre">${esc(cat.nombre)}</div>
        <div class="c-cat-card-count">${conteo[cat.id]||0} producto${(conteo[cat.id]||0)===1?'':'s'}
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>`).join('');
}
function verCategoria(id) {
  CATEGORIA_VISTA_ACTUAL = CATEGORIAS.find(c => c.id === id) || null;
  renderVistaCategoriasOProductos();
  document.getElementById('c-seccion-productos').scrollIntoView({ behavior:'smooth', block:'start' });
}
function volverACategorias() { CATEGORIA_VISTA_ACTUAL = null; renderVistaCategoriasOProductos(); }

function tarjetaProductoHTML(p) {
  const principal = p.fotos.find(f => f.es_principal) || p.fotos[0];
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;
  const tagTexto = { nuevo:'Nuevo', oferta:'Oferta', agotado:'Agotado' }[p.etiqueta];
  return `
    <div class="c-card ${p.etiqueta==='agotado'?'agotada':''}" onclick="abrirModalProducto('${p.id}')">
      <div class="c-card-media">
        ${tagTexto ? `<span class="c-card-tag ${p.etiqueta}">${tagTexto}</span>` : ''}
        ${principal ? `<img src="${esc(principal.url)}" loading="lazy" alt="${esc(p.nombre)}">` : ''}
      </div>
      <div class="c-card-body">
        ${cat ? `<div class="c-card-cat">${esc(cat.nombre)}</div>` : ''}
        <div class="c-card-nombre">${esc(p.nombre)}</div>
        <div class="c-card-precio-row">
          <span class="c-card-precio ${enOferta?'con-oferta':''}">${fmtC(enOferta?p.precio_oferta:p.precio)}</span>
          ${enOferta ? `<span class="c-card-tachado">${fmtC(p.precio)}</span>` : ''}
        </div>
      </div>
    </div>`;
}
function renderGridProductos(lista) {
  document.getElementById('c-conteo-productos').textContent = lista.length ? `${lista.length} producto${lista.length===1?'':'s'}` : '';
  const grid = document.getElementById('c-grid-productos');
  if (!lista.length) { grid.innerHTML = `<div class="c-vacio" style="width:100%">Todavía no hay productos aquí.</div>`; return; }
  grid.className = 'c-grid' + (lista.length <= 3 ? ' pocas' : '');
  grid.innerHTML = lista.map(tarjetaProductoHTML).join('');
}

function abrirModalProducto(id) {
  const p = PRODUCTOS.find(x => x.id === id);
  if (!p) return;
  registrarEvento('vista_producto', id);
  const cat = CATEGORIAS.find(c => c.id === p.categoria_id);
  const enOferta = p.etiqueta === 'oferta' && p.precio_oferta;

  const catEl = document.getElementById('c-modal-cat');
  catEl.textContent = cat ? cat.nombre : '';
  catEl.style.display = cat ? 'block' : 'none';
  document.getElementById('c-modal-nombre').textContent = p.nombre;
  document.getElementById('c-modal-precio').textContent = fmtC(enOferta ? p.precio_oferta : p.precio);
  document.getElementById('c-modal-precio').className = 'c-precio' + (enOferta ? ' con-oferta' : '');
  const tachadoEl = document.getElementById('c-modal-precio-tachado');
  tachadoEl.style.display = enOferta ? 'inline' : 'none';
  if (enOferta) tachadoEl.textContent = fmtC(p.precio);
  document.getElementById('c-modal-desc').textContent = p.descripcion || '';
  document.getElementById('c-modal-fotos').innerHTML = p.fotos.length ? p.fotos.map(f => `<img src="${esc(f.url)}" alt="">`).join('') : '';

  const btnWa = document.getElementById('c-modal-whatsapp');
  if (CATALOGO.whatsapp && p.etiqueta !== 'agotado') {
    btnWa.style.display = 'flex'; btnWa.disabled = false;
    btnWa.textContent = '💬 Consultar por WhatsApp';
    btnWa.onclick = () => consultarProducto(p.id);
  } else if (p.etiqueta === 'agotado') {
    btnWa.style.display = 'flex'; btnWa.disabled = true;
    btnWa.textContent = 'Agotado por ahora'; btnWa.onclick = null;
  } else {
    btnWa.style.display = 'none';
  }
  document.getElementById('c-modal').classList.add('open');
}
function cerrarModalProducto() { document.getElementById('c-modal').classList.remove('open'); }

init();
</script>
</body>
</html>
