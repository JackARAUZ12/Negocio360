<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>¿Dónde está mi envío?</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ac:#2563eb;--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6ea;--ok:#157f3b;--okb:#e6f6ec;--no:#b42318;--nob:#fdecea;--wa:#fff4d6;--wt:#8a5a00}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mu:#9aa3af;--bd:#2a2f38;--okb:#12301d;--nob:#3a1814;--wa:#3a2e0e;--wt:#f3c969;--ok:#5fd68a;--no:#ff8a7d}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
  header{display:flex;gap:12px;align-items:center;padding:4px 2px}header img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--card)}
  header h1{margin:0;font-size:18px;overflow-wrap:anywhere}header p{margin:0;color:var(--mu);font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .estado{text-align:center;gap:6px}.estado .i{font-size:54px;line-height:1}.estado h2{margin:4px 0 0;font-size:22px}.estado p{margin:0;color:var(--mu);font-size:14.5px}
  .num{font-family:ui-monospace,Menlo,monospace;font-weight:800;letter-spacing:.5px}
  .barra{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .barra div{height:8px;border-radius:99px;background:var(--bd)}.barra div.on{background:var(--ac)}.barra div.ok{background:var(--ok)}.barra div.mal{background:var(--no)}
  .barra-t{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--mu);text-align:center}
  .pagar{border-radius:14px;padding:14px;background:var(--wa);color:var(--wt);font-weight:800;font-size:18px;text-align:center}
  .pagar small{display:block;font-size:13px;font-weight:600}
  .pasos{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
  .pasos li{display:flex;gap:12px;padding:8px 0;position:relative}
  .pasos li::before{content:'';position:absolute;left:11px;top:30px;bottom:-8px;width:2px;background:var(--bd)}.pasos li:last-child::before{display:none}
  .pasos .p{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px}
  .pasos li:last-child .p{background:var(--ac);color:#fff}.pasos b{display:block;font-size:15px}.pasos span{color:var(--mu);font-size:13px}
  .datos{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}.datos dt{color:var(--mu)}.datos dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  .big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:14px;background:#16a34a;color:#fff;font:inherit;font-weight:800;font-size:16px;text-decoration:none;min-height:50px}
  .mu{color:var(--mu);font-size:13px;text-align:center}
  .centro{text-align:center;padding:40px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}.centro .i{font-size:48px}
  :focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main id="app"><div class="centro"><div class="i">⏳</div><p class="mu">Buscando tu envío…</p></div></main>
<script>
'use strict';
const sb = window.supabase.createClient('https://zvlincmqmmoclqhykejv.supabase.co', 'sb_publishable_RY59EmL8V2zRkOQg7RUJAw_dw6yr69t', { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let MONEDA = 'NIO';
const fmt = v => { const n = Number(v || 0); const s = { NIO: 'C$', USD: '$', CRC: '₡' }[MONEDA] || MONEDA + ' ';
  return s + ' ' + n.toLocaleString('es-NI', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
const hora = d => d ? new Date(d).toLocaleString('es-NI', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const ESTADO = {
  por_recoger: ['📍', 'Recibimos tu envío', 'Pronto lo recogemos.', 1],
  en_bodega: ['🏬', 'Tu envío está con nosotros', 'Lo estamos preparando para salir.', 1],
  asignado: ['🧑', 'Ya tiene repartidor', 'Saldrá a entregarse pronto.', 2],
  en_ruta: ['🛵', '¡Va en camino!', 'El repartidor ya salió hacia tu dirección.', 2],
  entregado: ['✅', '¡Entregado!', '', 3],
  no_entregado: ['⚠️', 'No pudimos entregarlo', 'Te contactaremos para intentarlo de nuevo.', 2],
  devuelto: ['↩️', 'Fue devuelto al remitente', '', 0],
  cancelado: ['✖️', 'Este envío fue cancelado', '', 0],
};
const PASO = { creado: '📦 Recibido', en_bodega: '🏬 En bodega', asignado: '🧑 Asignado a un repartidor', reintento: '🔁 Nuevo intento', en_ruta: '🛵 En camino',
  entregado: '✅ Entregado', no_entregado: '⚠️ No se pudo entregar', devuelto: '↩️ Devuelto al remitente', cancelado: '✖️ Cancelado' };
function token() { const m = (location.hash || '').match(/[#&]t=([0-9a-f]{40})/); return m ? m[1] : ''; }
function nada() { app.innerHTML = '<div class="centro"><div class="i">🔒</div><h1>No encontramos este envío</h1><p class="mu">Revisa que el enlace esté completo o pídelo de nuevo a quien te lo envió.</p></div>'; }
async function cargar() {
  const t = token(); if (!t) { nada(); return; }
  let d;
  try { const r = await sb.rpc('msj_rastreo', { p_token: t }); d = r.data; if (r.error) throw r.error; }
  catch (e) { app.innerHTML = '<div class="centro"><div class="i">📶</div><h1>No se pudo cargar</h1><p class="mu">Revisa tu conexión e intenta de nuevo.</p><button class="big" style="background:#2563eb;max-width:240px" onclick="cargar()">Reintentar</button></div>'; return; }
  if (!d || !d.ok) { nada(); return; }
  MONEDA = d.moneda || 'NIO';
  if (d.color && /^#[0-9a-f]{3,8}$/i.test(d.color)) document.documentElement.style.setProperty('--ac', d.color);
  document.title = `${d.numero} · ${d.negocio}`;
  const [ic, tit, sub0, nivel] = ESTADO[d.estado] || ['📦', d.estado, '', 1];
  const sub = d.estado === 'entregado' ? `${d.recibio ? 'Lo recibió ' + esc(d.recibio) + ' · ' : ''}${esc(hora(d.entregado_at))}` : esc(sub0);
  const mal = ['devuelto', 'cancelado'].includes(d.estado);
  const wa = d.whatsapp ? 'https://wa.me/' + (String(d.whatsapp).replace(/\D/g, '').length === 8 ? '505' : '') + String(d.whatsapp).replace(/\D/g, '') + '?text=' + encodeURIComponent(`Hola, consulto por mi envío ${d.numero}.`) : '';
  app.innerHTML = `
    <header>${d.logo ? `<img src="${esc(d.logo)}" alt="">` : ''}<div><h1>${esc(d.negocio)}</h1><p>Seguimiento de envío</p></div></header>
    <section class="card estado" aria-live="polite"><div class="i" aria-hidden="true">${ic}</div><h2>${esc(tit)}</h2><p>${sub}</p>
      <p>Envío <span class="num">${esc(d.numero)}</span>${d.para ? ' para ' + esc(d.para) : ''}</p>
      ${mal ? '' : `<div class="barra" aria-hidden="true">${[1, 2, 3].map(k => `<div class="${d.estado === 'entregado' ? 'ok' : d.estado === 'no_entregado' && k === 2 ? 'mal' : k <= nivel ? 'on' : ''}"></div>`).join('')}</div>
      <div class="barra-t" aria-hidden="true"><span>Recibido</span><span>En camino</span><span>Entregado</span></div>`}
    </section>
    ${Number(d.pagar) > 0 ? `<div class="pagar">Ten listo: ${esc(fmt(d.pagar))}<small>Lo pagas al recibir el paquete</small></div>` : ''}
    <section class="card"><dl class="datos">
      ${d.zona ? `<dt>Zona</dt><dd>${esc(d.zona)}</dd>` : ''}
      ${d.fecha_programada ? `<dt>Fecha</dt><dd>${esc(new Date(d.fecha_programada + 'T12:00:00').toLocaleDateString('es-NI', { weekday: 'long', day: 'numeric', month: 'long' }))}</dd>` : ''}
      <dt>Paquetes</dt><dd>${Number(d.paquetes || 1)}${d.urgente ? ' · 🚨 urgente' : ''}</dd></dl></section>
    <section class="card"><b>Lo que ha pasado</b><ol class="pasos">${(d.pasos || []).map(p => `<li><div class="p" aria-hidden="true">•</div><div><b>${esc(PASO[p.evento] || p.evento)}</b><span>${esc(hora(p.hora))}</span></div></li>`).join('')}</ol></section>
    ${wa ? `<a class="big" href="${esc(wa)}" target="_blank" rel="noopener">💬 Escribir a ${esc(d.negocio)}</a>` : ''}
    <p class="mu">Esta página se actualiza sola.</p>`;
}
cargar();
setInterval(() => { if (!document.hidden) cargar(); }, 60000);
window.addEventListener('hashchange', cargar);
</script>
</body>
</html>
