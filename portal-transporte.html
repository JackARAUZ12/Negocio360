<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2563eb">
<title>Seguimiento de sus viajes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Portal del cliente de Transporte — solo lectura. Igual en teléfono y computadora. */
  :root{--ac:#2563eb;--ac-s:rgba(37,99,235,.10);--bg:#f3f5f8;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
    --ok:#15803d;--ok-s:#e8f6ee;--az:#1d4ed8;--az-s:#e8effd;--na:#b45309;--na-s:#fdf3e4;--gr:#4b5563;--gr-s:#f0f2f5;--no:#b42318;--no-s:#fdecea}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mu:#9aa3af;--bd:#262c36;--sh:none;
    --ok:#5ed38a;--ok-s:#12301d;--az:#8db3ff;--az-s:#16233d;--na:#f3c26b;--na-s:#33270f;--gr:#c2c8d0;--gr-s:#20252e;--no:#ff8a7d;--no-s:#3a1814}}
  *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;min-height:100vh}
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:10px}
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  .mu{color:var(--mu)}.sm{font-size:13px}
  /* Encabezado */
  .top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
  .logo{width:48px;height:48px;border-radius:14px;flex:none;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;overflow:hidden;box-shadow:var(--sh)}
  .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
  .top h1{margin:0;font-size:18px;line-height:1.25;overflow-wrap:anywhere}.top p{margin:0;font-size:13.5px;color:var(--mu);overflow-wrap:anywhere}
  .top .sp{flex:1}
  .ib{border:1px solid var(--bd);background:var(--card);border-radius:12px;min-height:40px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--mu)}
  .ib:hover{color:var(--tx)}
  /* Entrada con PIN */
  .login{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:20px}
  .lcard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:28px 22px;box-shadow:var(--sh);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  .lcard .logo{width:72px;height:72px;border-radius:20px;font-size:28px}
  .lcard h1{margin:4px 0 0;font-size:21px}.lcard h2{margin:0;font-size:15px;font-weight:600;color:var(--mu)}
  .pin{width:100%;text-align:center;font-size:30px;letter-spacing:.45em;padding:14px 10px 14px calc(10px + .45em);border:2px solid var(--bd);border-radius:16px;background:var(--bg);font-weight:800;font-variant-numeric:tabular-nums}
  .pin:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 4px var(--ac-s)}
  .chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mu);cursor:pointer;user-select:none}
  .chk input{width:18px;height:18px;accent-color:var(--ac)}
  .btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--ac);color:#fff;font-weight:800;font-size:16px;cursor:pointer;min-height:50px}
  .btn:disabled{opacity:.6;cursor:default}
  .err{color:var(--no);background:var(--no-s);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600;width:100%}
  .seg{font-size:12.5px;color:var(--mu);display:flex;gap:6px;align-items:center;justify-content:center}
  /* Resumen (también son filtros) */
  .res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .rk{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:12px 12px 10px;text-align:left;cursor:pointer;box-shadow:var(--sh);min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
  .rk b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.rk span{font-size:13px;color:var(--mu);font-weight:600}
  .rk.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-s)}
  .buscar{display:flex;gap:8px;margin-bottom:12px}
  .buscar input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:12px 14px;font-size:15px}
  .buscar input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-s)}
  /* Tarjeta de viaje */
  .lista{display:flex;flex-direction:column;gap:12px}
  .v{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
  .vh{display:block;width:100%;text-align:left;border:0;background:none;padding:16px 16px 14px;cursor:pointer}
  .v1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .num{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .ref{font-size:12.5px;color:var(--mu);background:var(--gr-s);border-radius:99px;padding:2px 9px;font-weight:600}
  .pill{margin-left:auto;font-size:12.5px;font-weight:800;border-radius:99px;padding:4px 11px;white-space:nowrap}
  .p-gr{background:var(--gr-s);color:var(--gr)}.p-na{background:var(--na-s);color:var(--na)}.p-az{background:var(--az-s);color:var(--az)}.p-ok{background:var(--ok-s);color:var(--ok)}
  .ruta{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:18px;font-weight:800;line-height:1.25}
  .ruta .o,.ruta .d{min-width:0;overflow-wrap:anywhere}.ruta .fl{color:var(--mu);flex:none;font-weight:600}
  .carga{font-size:13.5px;color:var(--mu);overflow-wrap:anywhere}
  /* Barra de progreso del viaje */
  .prog{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 6px}
  .prog i{height:8px;border-radius:99px;background:var(--bd)}.prog i.on{background:var(--ac)}.prog i.ok{background:var(--ok)}
  .prog-t{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:11.5px;color:var(--mu);text-align:center;line-height:1.25}
  .prog-t span.on{color:var(--tx);font-weight:700}
  .ult{margin-top:12px;display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:14px;padding:10px 12px}
  .ult .ic{font-size:20px;line-height:1.2}.ult b{display:block;font-size:14.5px}.ult small{color:var(--mu);font-size:13px}
  .mas{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:13.5px;font-weight:700;color:var(--ac)}
  .mas svg{transition:transform .2s}.v.abierto .mas svg{transform:rotate(180deg)}
  /* Detalle */
  .det{display:none;border-top:1px solid var(--bd);padding:16px}
  .v.abierto .det{display:block}
  .datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
  .dt{background:var(--bg);border-radius:12px;padding:9px 11px;min-width:0}.dt small{display:block;color:var(--mu);font-size:12px;font-weight:600}.dt b{font-size:14.5px;overflow-wrap:anywhere}
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:flex;gap:12px;position:relative;padding:0 0 16px}
  .tl li::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--bd)}.tl li:last-child::before{display:none}.tl li:last-child{padding-bottom:0}
  .tl .pt{width:32px;height:32px;border-radius:50%;flex:none;background:var(--bg);border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px}
  .tl li.ult-ev .pt{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-s)}
  .tl .tx{min-width:0;padding-top:4px}.tl b{display:block;font-size:14.5px}.tl small{display:block;color:var(--mu);font-size:13px}
  .tl em{display:block;font-style:normal;font-size:13.5px;margin-top:3px;background:var(--bg);border-radius:10px;padding:6px 9px;overflow-wrap:anywhere}
  .pais{display:inline-block;font-size:12px;font-weight:700;background:var(--az-s);color:var(--az);border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:1px}
  .wa-v{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;width:100%;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:12px;font-weight:700;color:var(--tx);text-decoration:none}
  .vacio{text-align:center;padding:40px 16px;color:var(--mu);background:var(--card);border:1px dashed var(--bd);border-radius:20px}
  .vacio .i{font-size:40px}
  .wa-f{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:#16a34a;color:#fff;text-decoration:none;font-weight:800;border-radius:99px;padding:13px 18px;box-shadow:0 8px 24px rgba(22,163,74,.35);z-index:5}
  .pie{text-align:center;font-size:12px;color:var(--mu);margin-top:22px}
  .centro{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}.centro .i{font-size:52px}
  .centro h1{margin:0;font-size:21px}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--ac);animation:g 1s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
  @media (min-width:700px){.wrap{padding-top:28px}.ruta{font-size:20px}.res{gap:14px}.rk b{font-size:30px}.datos{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:380px){.res{gap:7px}.rk{padding:10px 9px}.rk b{font-size:22px}.rk span{font-size:12px}.prog-t{font-size:10.5px}.wa-f span{display:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="centro"><div class="spin"></div><p class="mu">Cargando…</p></div></div>
<script>
'use strict';
const sb = window.supabase.createClient('https://zvlincmqmmoclqhykejv.supabase.co', 'sb_publishable_RY59EmL8V2zRkOQg7RUJAw_dw6yr69t', { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const P = { token: '', pin: '', d: null, filtro: 'activos', q: '', abiertos: new Set(), cab: null, timer: null };

function token() { const m = (location.hash || '').match(/[#&]t=([0-9a-f]{40})/); return m ? m[1] : ''; }
const KEY = () => 'n360_txp_' + P.token.slice(0, 12);
function pinGuardado() { try { return localStorage.getItem(KEY()) || ''; } catch (_) { return ''; } }
function guardarPin(p) { try { p ? localStorage.setItem(KEY(), p) : localStorage.removeItem(KEY()); } catch (_) {} }

const fechaHora = d => d ? new Date(d).toLocaleString('es', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
const fecha = d => { if (!d) return ''; const x = /^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d + 'T12:00:00') : new Date(d); return x.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
function hace(d) {
  if (!d) return ''; const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'hace un momento'; if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) { const h = Math.round(s / 3600); return `hace ${h} h`; }
  const dd = Math.round(s / 86400); return dd === 1 ? 'ayer' : `hace ${dd} días`;
}
const iniciales = n => String(n || 'T').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function logoHtml(d) { return d.logo ? `<div class="logo"><img src="${esc(d.logo)}" alt=""></div>` : `<div class="logo" aria-hidden="true">${esc(iniciales(d.negocio))}</div>`; }
function aplicarColor(c) {
  if (!c || !/^#[0-9a-f]{6}$/i.test(c)) return;
  const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
  // si el color es muy claro, se oscurece para que el texto blanco se lea
  const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255, k = l > 0.62 ? 0.62 / l : 1;
  const hex = '#' + [r, g, b].map(v => Math.round(v * k).toString(16).padStart(2, '0')).join('');
  document.documentElement.style.setProperty('--ac', hex);
  document.documentElement.style.setProperty('--ac-s', `rgba(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)},.13)`);
  document.querySelector('meta[name=theme-color]').setAttribute('content', hex);
}

/* ---------------- estados y pasos ---------------- */
const ICO = { 'cargando': '📦', 'carga completa': '✅', 'en tránsito': '🚚', 'en frontera': '🛂', 'en aduana': '🏛️', 'detenido': '⏸️', 'descargando': '📥', 'descarga completa': '🏁', 'entregado': '🤝' };
const ico = e => e.auto === 'frontera' ? '🛂' : e.auto === 'cruce' ? '✅' : (ICO[String(e.estatus || '').toLowerCase()] || '📍');
const PASOS = ['Programado', 'Cargando', 'En camino', 'En destino', 'Entregado'];
function paso(v) {
  if (v.estado === 'entregada') return 4;
  const ev = v.eventos || [], tiene = re => ev.some(e => re.test(String(e.estatus || '')) || false);
  if (ev.some(e => e.hito === 'fin_descarga') || tiene(/^descarg/i)) return 3;
  if (v.estado === 'en_ruta' || v.salida || tiene(/tránsito|transito|frontera|aduana|detenido/i)) return 2;
  if (ev.some(e => e.hito === 'inicio_carga') || tiene(/^carga/i)) return 1;
  return 0;
}
function pill(v) {
  if (v.estado === 'entregada') return ['p-ok', '✅ Entregado'];
  if (v.estado === 'en_ruta') return ['p-az', '🚚 En camino'];
  if (v.estado === 'asignada') return ['p-na', '🧑‍✈️ Unidad asignada'];
  return ['p-gr', '📅 Programado'];
}
// Línea de tiempo completa: lo anotado por la empresa + lo automático del viaje
function eventos(v) {
  const ev = (v.eventos || []).map(e => ({ ...e }));
  if (v.creada) ev.push({ t: v.creada, estatus: 'Orden registrada', ic: '📋' });
  if (v.salida) ev.push({ t: v.salida, estatus: 'Salió hacia ' + (v.destino || 'su destino'), ic: '🚦' });
  if (v.entrega) ev.push({ t: v.entrega, estatus: 'Entregado', ic: '✅', nota: v.recibio ? 'Recibió: ' + v.recibio : null });
  return ev.filter(e => e.t).sort((a, b) => new Date(a.t) - new Date(b.t));
}
const grupo = v => v.estado === 'entregada' ? 'entregados' : (v.estado === 'en_ruta' ? 'camino' : 'programados');

/* ---------------- pantallas ---------------- */
function pantallaInvalida() {
  app.innerHTML = `<div class="centro"><div class="i">🔒</div><h1>Este enlace ya no está disponible</h1>
    <p class="mu" style="max-width:360px">Puede que esté incompleto o que la empresa lo haya cambiado. Pídale el enlace nuevo a su transportista.</p></div>`;
}
function pantallaPin(cab, aviso) {
  P.cab = cab || P.cab || {};
  aplicarColor(P.cab.color);
  if (P.cab.negocio) document.title = `${P.cab.negocio} · Seguimiento de sus viajes`;
  app.innerHTML = `<div class="login"><form class="lcard" id="f-pin" autocomplete="off" novalidate>
      ${logoHtml({ logo: P.cab.logo, negocio: P.cab.negocio })}
      <div><h1>${esc(P.cab.negocio || 'Transporte')}</h1><h2>Seguimiento de sus viajes</h2></div>
      <label for="pin" class="sm mu" style="margin-top:4px">Escriba el PIN que le enviamos</label>
      <input class="pin" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-label="PIN" placeholder="••••••">
      ${aviso ? `<div class="err" role="alert">${aviso}</div>` : ''}
      <label class="chk"><input type="checkbox" id="rec" checked> Recordarme en este dispositivo</label>
      <button class="btn" id="b-ent" type="submit">Ver mis viajes</button>
      <div class="seg">🔒 Solo usted puede ver estos viajes</div>
    </form></div>`;
  const i = document.getElementById('pin');
  i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, '').slice(0, 6); });
  document.getElementById('f-pin').addEventListener('submit', async ev => {
    ev.preventDefault(); const pin = i.value.trim();
    if (pin.length < 4) { i.focus(); return; }
    const b = document.getElementById('b-ent'); b.disabled = true; b.textContent = 'Entrando…';
    await entrar(pin, document.getElementById('rec').checked);
  });
  setTimeout(() => i.focus(), 50);
}

async function pedir(pin) {
  const { data, error } = await sb.rpc('tx_portal_ver', { p_token: P.token, p_pin: pin || null });
  if (error) throw error; return data || {};
}
async function entrar(pin, recordar) {
  let d;
  try { d = await pedir(pin); } catch (e) { console.warn(e); pantallaPin(null, 'No hay conexión. Revise su internet e intente de nuevo.'); return; }
  if (d.ok) {
    const primera = !P.d; P.pin = pin; P.d = d; if (recordar) guardarPin(pin);
    if (primera && !(d.viajes || []).some(v => v.estado !== 'entregada')) P.filtro = 'todos';
    aplicarColor(d.color); document.title = `${d.negocio} · Seguimiento de sus viajes`;
    pintar(); programarRefresco(); return;
  }
  guardarPin('');
  if (d.motivo === 'invalido') return pantallaInvalida();
  if (d.motivo === 'bloqueado') return pantallaPin(d, `Por seguridad, la entrada está pausada. Intente en ${d.minutos || 15} minuto${d.minutos == 1 ? '' : 's'}.`);
  if (d.motivo === 'pin_malo') return pantallaPin(d, `PIN incorrecto. Le quedan ${d.restantes} intento${d.restantes == 1 ? '' : 's'}.`);
  pantallaPin(d);
}

function filtrados() {
  const q = P.q.trim().toLowerCase();
  return (P.d.viajes || []).filter(v => {
    if (q) return [v.numero, v.ref, v.origen, v.destino, v.carga].join(' ').toLowerCase().includes(q);   // la búsqueda mira todos
    if (P.filtro === 'activos' && grupo(v) === 'entregados') return false;
    if (P.filtro === 'camino' && grupo(v) !== 'camino') return false;
    if (P.filtro === 'programados' && grupo(v) !== 'programados') return false;
    if (P.filtro === 'entregados' && grupo(v) !== 'entregados') return false;
    if (q && ![v.numero, v.ref, v.origen, v.destino, v.carga].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

function tarjeta(v) {
  const p = paso(v), [cl, txt] = pill(v), evs = eventos(v), u = evs[evs.length - 1];
  const id = v.numero, abierto = P.abiertos.has(id);
  const barra = PASOS.map((_, i) => `<i class="${i <= p ? (p === 4 ? 'ok' : 'on') : ''}"></i>`).join('');
  const etq = PASOS.map((t, i) => `<span class="${i === p ? 'on' : ''}">${t}</span>`).join('');
  const dato = (t, val) => val ? `<div class="dt"><small>${t}</small><b>${esc(val)}</b></div>` : '';
  const tel = String(P.d.whatsapp || '').replace(/\D/g, ''), telWa = tel.length === 8 ? '505' + tel : tel;
  const waTxt = `Hola, consulto por el viaje ${v.numero}${v.ref ? ' (ref. ' + v.ref + ')' : ''}: ${v.origen || ''} → ${v.destino || ''}.`;
  return `<article class="v ${abierto ? 'abierto' : ''}" data-v="${esc(id)}">
    <button type="button" class="vh" data-abrir="${esc(id)}" aria-expanded="${abierto}">
      <div class="v1"><span class="num">${esc(v.numero)}</span>${v.ref ? `<span class="ref">Su ref.: ${esc(v.ref)}</span>` : ''}<span class="pill ${cl}">${txt}</span></div>
      <div class="ruta"><span class="o">${esc(v.origen || '—')}</span><span class="fl">→</span><span class="d">${esc(v.destino || '—')}</span></div>
      ${v.carga ? `<div class="carga">📦 ${esc(v.carga)}</div>` : ''}
      <div class="prog" aria-hidden="true">${barra}</div><div class="prog-t">${etq}</div>
      ${u ? `<div class="ult"><span class="ic">${u.ic || ico(u)}</span><div><b>${esc(u.estatus)}${u.pais ? `<span class="pais">${esc(u.pais)}</span>` : ''}</b><small>${esc(fechaHora(u.t))} · ${esc(hace(u.t))}</small></div></div>` : ''}
      <div class="mas">${abierto ? 'Ocultar detalle' : 'Ver todo el recorrido'} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div>
    </button>
    <div class="det">
      <div class="datos">
        ${dato('Fecha programada', fecha(v.programada))}${dato('Salida', fechaHora(v.salida))}${dato('Entrega', fechaHora(v.entrega))}
        ${dato('Recibió', v.recibio)}${dato('Bultos', v.bultos != null ? String(v.bultos) : '')}${dato('Peso', v.peso != null ? v.peso + ' t' : '')}
        ${dato('Placa', [v.placa, v.remolque].filter(Boolean).join(' + '))}${dato('Conductor', v.conductor)}
      </div>
      <ol class="tl">${evs.slice().reverse().map((e, i) => `<li class="${i === 0 ? 'ult-ev' : ''}"><span class="pt">${e.ic || ico(e)}</span><div class="tx">
        <b>${esc(e.estatus)}${e.pais ? `<span class="pais">${esc(e.pais)}</span>` : ''}</b><small>${esc(fechaHora(e.t))}</small>${e.nota ? `<em>${esc(e.nota)}</em>` : ''}</div></li>`).join('')}</ol>
      ${telWa ? `<a class="wa-v" href="https://wa.me/${telWa}?text=${encodeURIComponent(waTxt)}" target="_blank" rel="noopener">💬 Preguntar por este viaje</a>` : ''}
    </div>
  </article>`;
}

function pintar() {
  const d = P.d, vs = d.viajes || [];
  const n = g => vs.filter(v => grupo(v) === g).length;
  const lista = filtrados();
  const tel = String(d.whatsapp || '').replace(/\D/g, ''), telWa = tel.length === 8 ? '505' + tel : tel;
  const titulo = P.q.trim() ? 'Resultados de la búsqueda' : { activos: 'Viajes en curso', camino: 'En camino', programados: 'Programados', entregados: 'Entregados', todos: 'Todos sus viajes' }[P.filtro];
  app.innerHTML = `<div class="wrap">
    <header class="top">${logoHtml(d)}<div style="min-width:0"><h1>${esc(d.negocio)}</h1><p>${esc(d.cliente || '')}</p></div><span class="sp"></span>
      <button type="button" class="ib" id="b-act" title="Actualizar">↻ <span>Actualizar</span></button></header>
    <section class="res" aria-label="Resumen">
      <button type="button" class="rk ${P.filtro === 'camino' ? 'on' : ''}" data-f="camino"><b>${n('camino')}</b><span>🚚 En camino</span></button>
      <button type="button" class="rk ${P.filtro === 'programados' ? 'on' : ''}" data-f="programados"><b>${n('programados')}</b><span>📅 Programados</span></button>
      <button type="button" class="rk ${P.filtro === 'entregados' ? 'on' : ''}" data-f="entregados"><b>${n('entregados')}</b><span>✅ Entregados</span></button>
    </section>
    <div class="buscar"><input type="search" id="q" placeholder="Buscar viaje, referencia o ciudad" value="${esc(P.q)}" aria-label="Buscar">
      <button type="button" class="ib" data-f="${P.filtro === 'todos' ? 'activos' : 'todos'}">${P.filtro === 'todos' ? 'En curso' : 'Ver todos'}</button></div>
    <div class="sm mu" style="margin:0 2px 8px;font-weight:700">${esc(titulo)} · ${lista.length}</div>
    <div class="lista">${lista.length ? lista.map(tarjeta).join('') : `<div class="vacio"><div class="i">${vs.length ? '🔎' : '🚛'}</div>
      <p>${vs.length ? (P.q ? 'No hay viajes que coincidan con su búsqueda.' : 'No hay viajes en esta sección.') : 'Todavía no hay viajes registrados a su nombre.'}</p>
      ${vs.length && P.filtro !== 'todos' ? '<button type="button" class="ib" data-f="todos">Ver todos sus viajes</button>' : ''}</div>`}</div>
    <div class="pie">Actualizado ${esc(fechaHora(d.ahora || new Date()))} · <button type="button" class="ib" id="b-salir" style="min-height:30px;padding:0 10px">Salir</button><br>Seguimiento en línea con Negocio360</div>
  </div>
  ${telWa ? `<a class="wa-f" href="https://wa.me/${telWa}?text=${encodeURIComponent('Hola, consulto por mis viajes.')}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">💬 <span>WhatsApp</span></a>` : ''}`;
}

async function refrescar(manual) {
  if (!P.pin) return;
  const b = document.getElementById('b-act'); if (b && manual) b.disabled = true;
  try {
    const d = await pedir(P.pin);
    if (d.ok) { P.d = d; const y = window.scrollY; const foco = document.activeElement && document.activeElement.id; pintar(); window.scrollTo(0, y); if (foco === 'q') { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
    else if (d.motivo === 'invalido') { guardarPin(''); pantallaInvalida(); }
    else { guardarPin(''); P.pin = ''; pantallaPin(d, d.motivo === 'pin_malo' ? 'El PIN cambió. Escriba el PIN nuevo que le envió la empresa.' : null); }
  } catch (e) { console.warn(e); } finally { const b2 = document.getElementById('b-act'); if (b2) b2.disabled = false; }
}
function programarRefresco() {
  clearInterval(P.timer);
  P.timer = setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('#q:focus')) refrescar(false); }, 120000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && P.d && P.d.ahora && Date.now() - new Date(P.d.ahora) > 60000) refrescar(false); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-abrir],[data-f],#b-act,#b-salir'); if (!t) return;
  if (t.dataset.abrir) { const id = t.dataset.abrir; P.abiertos.has(id) ? P.abiertos.delete(id) : P.abiertos.add(id); const v = (P.d.viajes || []).find(x => x.numero === id);
    const el = t.closest('.v'); if (v && el) { el.outerHTML = tarjeta(v); } return; }
  if (t.dataset.f) { P.filtro = P.filtro === t.dataset.f && ['camino', 'programados', 'entregados'].includes(t.dataset.f) ? 'activos' : t.dataset.f; pintar(); return; }
  if (t.id === 'b-act') return refrescar(true);
  if (t.id === 'b-salir') { guardarPin(''); P.pin = ''; P.d = null; clearInterval(P.timer); pantallaPin(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  P.q = e.target.value; const pos = e.target.selectionStart;
  const cont = document.querySelector('.lista'); const lista = filtrados();
  if (cont) cont.innerHTML = lista.length ? lista.map(tarjeta).join('') : `<div class="vacio"><div class="i">🔎</div><p>No hay viajes que coincidan con su búsqueda.</p></div>`;
  const cnt = cont && cont.previousElementSibling; if (cnt) cnt.textContent = cnt.textContent.replace(/· \d+$/, '· ' + lista.length);
  e.target.setSelectionRange(pos, pos);
});

(async function inicio() {
  P.token = token();
  if (!P.token) return pantallaInvalida();
  const guardado = pinGuardado();
  if (guardado) return entrar(guardado, true);
  let d; try { d = await pedir(null); } catch (e) { return pantallaPin({}, 'No hay conexión. Revise su internet e intente de nuevo.'); }
  if (d.motivo === 'invalido') return pantallaInvalida();
  pantallaPin(d);
})();
</script>
</body>
</html>
