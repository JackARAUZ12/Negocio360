<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Turnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="recepcion-publico.css?v=20261107a" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .tv{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:1.6vh;padding:2.2vh 2.2vw;
    background:radial-gradient(1400px 700px at -10% -20%,#dde8ff 0,transparent 55%),radial-gradient(1000px 600px at 120% 130%,#e3edff 0,transparent 60%),var(--fondo)}
  /* encabezado */
  .tv-head{display:flex;align-items:center;justify-content:space-between;gap:2vw;background:#fff;border:1px solid var(--borde);border-radius:2.2vh;padding:1.4vh 1.8vw;box-shadow:0 10px 30px -18px rgba(15,40,100,.35)}
  .tv-marca{display:flex;align-items:center;gap:1.2vw;min-width:0}
  .tv-marca img{height:6.4vh;max-width:16vw;object-fit:contain}
  .tv-marca b{font-size:3.4vh;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-hora{text-align:right;line-height:1.1}
  .tv-hora b{display:block;font-size:4.6vh;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
  .tv-hora span{display:inline-block;font-size:1.9vh;color:var(--txt2)}
  .tv-hora span::first-letter{text-transform:uppercase}
  /* cuerpo */
  .tv-body{display:grid;grid-template-columns:1.65fr 1fr;gap:1.6vw;min-height:0}
  .tv-main{position:relative;background:#fff;border:1px solid var(--borde);border-radius:3vh;box-shadow:0 30px 60px -32px rgba(15,40,100,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:3vh 2vw}
  .tv-main::before{content:'';position:absolute;inset:0 0 auto 0;height:1.2vh;background:linear-gradient(90deg,var(--c),var(--c2))}
  .tv-et{font-size:3vh;font-weight:800;letter-spacing:.35em;color:var(--txt3);text-transform:uppercase}
  .tv-cod{white-space:nowrap;font-size:min(30vh,10.5vw);font-weight:900;line-height:1;letter-spacing:.01em;color:var(--c);font-variant-numeric:tabular-nums;margin:1vh 0 2vh}
  .tv-pase{display:inline-flex;align-items:center;gap:1.4vw;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-radius:99px;padding:1.6vh 3vw;
    font-size:min(6.2vh,3.6vw);font-weight:800;box-shadow:0 18px 34px -16px var(--c)}
  .tv-pase small{font-size:.55em;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.12em}
  .tv-serv{margin-top:2vh;font-size:3vh;color:var(--txt2);font-weight:600}
  .tv-nom{margin-top:.6vh;font-size:3.6vh;font-weight:800;color:var(--txt)}
  .tv-bien{font-size:7vh;font-weight:900;color:var(--c);letter-spacing:-.01em}
  .tv-bien-s{font-size:3vh;color:var(--txt2);margin-top:1.5vh}
  .tv-main.flash{animation:tvFlash 1.1s ease 3}
  @keyframes tvFlash{0%,100%{box-shadow:0 30px 60px -32px rgba(15,40,100,.45)}50%{box-shadow:0 0 0 1.2vh color-mix(in srgb,var(--c) 35%,transparent),0 30px 60px -20px var(--c)}}
  .tv-cod.largo{font-size:min(26vh,8.6vw)}
  .tv-cod.entra{animation:tvEntra .7s cubic-bezier(.2,1.4,.4,1)}
  @keyframes tvEntra{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  /* lateral */
  .tv-side{display:grid;grid-template-rows:auto 1fr;gap:1.6vh;min-height:0}
  .tv-card{background:#fff;border:1px solid var(--borde);border-radius:2.4vh;padding:2vh 1.6vw;box-shadow:0 14px 34px -24px rgba(15,40,100,.4);min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .tv-card-t{font-size:2.1vh;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:1.2vh;display:flex;justify-content:space-between;align-items:center}
  .tv-card-t em{font-style:normal;letter-spacing:0;text-transform:none;font-size:2vh;color:var(--c);font-weight:800;background:#eef3ff;border-radius:99px;padding:.3vh 1vw}
  .tv-ult{display:flex;flex-direction:column;gap:.9vh}
  .tv-u{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:1.2vw;padding:1.1vh 1.2vw;border-radius:1.6vh;background:#f6f8fc;border:1px solid var(--borde)}
  .tv-u b{font-size:4.2vh;font-weight:900;color:var(--txt);font-variant-numeric:tabular-nums}
  .tv-u span{font-size:2.6vh;font-weight:700;color:var(--c);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-u.primero{background:linear-gradient(135deg,var(--c),var(--c2));border-color:transparent}
  .tv-u.primero b,.tv-u.primero span{color:#fff}
  .tv-sig{display:flex;flex-wrap:wrap;gap:1vh .8vw;align-content:flex-start}
  .tv-sig span{font-size:3vh;font-weight:800;padding:.8vh 1.1vw;border-radius:1.2vh;background:#eef3ff;color:var(--c2);font-variant-numeric:tabular-nums}
  .tv-sig span.pref{background:#f1e9ff;color:#6d28d9}
  .tv-vacio{color:var(--txt3);font-size:2.4vh;padding:1vh 0}
  /* pie */
  .tv-pie{display:flex;align-items:center;gap:1.4vw;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-radius:2vh;padding:1.3vh 1.6vw;overflow:hidden}
  .tv-pie-esp{flex:0 0 auto;font-size:2.4vh;font-weight:800;background:rgba(255,255,255,.16);border-radius:99px;padding:.5vh 1.2vw;white-space:nowrap}
  .tv-cinta{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
  .tv-cinta span{display:inline-block;padding-left:100%;font-size:2.6vh;font-weight:600;animation:tvCinta 28s linear infinite}
  @keyframes tvCinta{to{transform:translateX(-100%)}}
  .tv-n360{flex:0 0 auto;font-size:1.6vh;opacity:.7}
  .tv-fs{position:fixed;right:1.2vw;bottom:9vh;width:5vh;height:5vh;border-radius:50%;border:0;background:rgba(15,23,42,.08);color:var(--txt2);font-size:2.4vh;cursor:pointer;opacity:.35;z-index:5}
  .tv-fs:hover{opacity:1}
  /* vertical (tablet o TV girada) */
  @media (orientation:portrait){
    .tv-body{grid-template-columns:1fr;grid-template-rows:1.25fr 1fr}
    .tv-cod{font-size:min(22vh,19vw)} .tv-pase{font-size:min(4.4vh,6vw)}
    .tv-side{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
    .tv-u b{font-size:3.4vh}.tv-u span{font-size:2.2vh}
    .tv-marca b{font-size:2.6vh}.tv-hora b{font-size:3.2vh;white-space:nowrap}.tv-hora span{font-size:1.5vh}
    .tv-card-t{flex-wrap:wrap;gap:.6vh}.tv-sig span{font-size:2.4vh}
  }
  @media (prefers-reduced-motion:reduce){.tv-cinta span,.tv-main.flash,.tv-cod.largo{font-size:min(26vh,8.6vw)}
  .tv-cod.entra{animation:none}}
</style>
</head>
<body>
<div id="rp-par-w" class="rp-par-w" style="display:none"></div>
<div class="rp-offline" id="rp-offline">Sin conexión · reintentando…</div>

<div class="tv" id="tv" style="display:none">
  <header class="tv-head">
    <div class="tv-marca"><img data-marca-logo alt="" style="display:none"/><b data-marca-nombre></b></div>
    <div class="tv-hora"><b id="tv-hora">--:--</b><span id="tv-fecha"></span></div>
  </header>
  <section class="tv-body">
    <div class="tv-main" id="tv-main"></div>
    <div class="tv-side">
      <div class="tv-card"><div class="tv-card-t">Últimos llamados</div><div class="tv-ult" id="tv-ult"></div></div>
      <div class="tv-card"><div class="tv-card-t">Siguientes <em id="tv-esp">0 en espera</em></div><div class="tv-sig" id="tv-sig"></div></div>
    </div>
  </section>
  <footer class="tv-pie">
    <div class="tv-pie-esp" id="tv-pie-esp">⏱ —</div>
    <div class="tv-cinta"><span id="tv-cinta">Bienvenidos · Tome su turno y espere a ser llamado</span></div>
    <div class="tv-n360">Negocio360</div>
  </footer>
</div>
<button class="tv-fs" id="tv-fs" title="Pantalla completa" onclick="RecPub.pantallaCompleta()">⛶</button>
<div class="rp-sonido" id="rp-sonido" style="display:none"><div><div style="font-size:48px">🔊</div><b>Toque la pantalla para activar el sonido</b><p>Así la pantalla anuncia cada turno con voz. Solo hace falta una vez.</p></div></div>

<script src="recepcion-publico.js?v=20261107a"></script>
<script>
(function () {
  const R = window.RecPub, $ = id => document.getElementById(id);
  const CLAVE = 'n360_rec_pantalla';
  let secreto = R.lsGet(CLAVE), version = null, estado = null, ultimaClave = null, cola = [], hablando = false, fallos = 0;

  function claveLlamado(l) { return l ? `${l.codigo}|${l.llamadas}|${l.llamado_at}` : null; }
  function cfg() { return (estado && estado.marca && estado.marca.cfg) || {}; }

  function pintar(nuevo) {
    const ls = estado.llamados || [], actual = ls.find(l => l.estado !== 'atendido') || null;
    const m = $('tv-main');
    if (actual) {
      m.innerHTML = `<div class="tv-et">Turno</div>
        <div class="tv-cod ${nuevo ? 'entra' : ''} ${String(actual.codigo).length > 5 ? 'largo' : ''}">${R.esc(actual.codigo)}</div>
        <div class="tv-pase"><small>Pase a</small> ${R.esc(actual.puesto || '')}</div>
        <div class="tv-serv">${R.esc(actual.servicio || '')}</div>
        ${actual.nombre ? `<div class="tv-nom">${R.esc(actual.nombre)}</div>` : ''}`;
    } else {
      m.innerHTML = `<div class="tv-bien">Bienvenidos</div><div class="tv-bien-s">Tome su turno y espere a ser llamado</div>`;
    }
    if (nuevo) { m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); }
    const otros = ls.filter(l => l !== actual).slice(0, 5);
    const lista = (actual ? [actual] : []).concat(otros).slice(0, 6);
    $('tv-ult').innerHTML = lista.length ? lista.map((l, i) => `<div class="tv-u ${i === 0 && actual ? 'primero' : ''}"><b>${R.esc(l.codigo)}</b><span>${R.esc(l.puesto || '')}</span></div>`).join('')
      : '<div class="tv-vacio">Aún no se ha llamado a nadie hoy.</div>';
    const sig = estado.siguientes || [];
    $('tv-sig').innerHTML = sig.length ? sig.map(s => `<span class="${s.preferencial ? 'pref' : ''}">${R.esc(s.codigo)}</span>`).join('') : '<div class="tv-vacio">Nadie en espera.</div>';
    $('tv-esp').textContent = `${estado.en_espera || 0} en espera`;
    const min = Math.round((estado.min_por_persona || 0) * (estado.en_espera || 0));
    $('tv-pie-esp').textContent = estado.en_espera ? `⏱ Espera aprox. ${min < 1 ? 'menos de 1' : min} min` : '⏱ Sin espera';
    const msg = (cfg().mensaje || '').trim() || `Bienvenidos a ${estado.marca?.nombre || 'nuestro negocio'} · Tome su turno y espere a ser llamado`;
    if ($('tv-cinta').textContent !== msg) $('tv-cinta').textContent = msg;
  }

  async function anunciar() {
    if (hablando) return; hablando = true;
    while (cola.length) {
      const l = cola.shift();
      if (cfg().sonido !== false) await R.dinDon();
      if (cfg().voz !== false) await R.hablar(`Turno ${R.codigoHablado(l.codigo)}. Pase a ${l.puesto || 'atención'}.`);
      await R.espera(600);
    }
    hablando = false;
  }

  async function ciclo() {
    try {
      const { data, error } = await R.sb.rpc('recepcion_pantalla_estado', { p_secreto: secreto, p_version: version });
      if (error) throw error;
      fallos = 0; $('rp-offline').style.display = 'none';
      if (!data?.ok) {               // equipo desactivado o módulo apagado: volver a vincular
        R.lsDel(CLAVE); secreto = null; $('tv').style.display = 'none'; return arrancar();
      }
      if (data.sin_cambios) return;
      const primero = !estado;
      estado = data; version = data.version;
      R.aplicarMarca(data.marca);
      const top = (data.llamados || []).find(l => l.estado === 'llamado') || null;
      const k = claveLlamado(top);
      const nuevo = !primero && k && k !== ultimaClave && top && (Date.now() - new Date(top.llamado_at)) < 120000;
      if (k) ultimaClave = k;
      pintar(nuevo);
      if (nuevo) { cola.push(top); anunciar(); }
    } catch (e) {
      fallos++; if (fallos >= 3) $('rp-offline').style.display = 'block';
    }
  }

  function avisoSonido() {
    const c = cfg();
    if ((c.voz === false && c.sonido === false) || R.audioListo()) { $('rp-sonido').style.display = 'none'; return; }
    $('rp-sonido').style.display = 'flex';
  }

  async function arrancar() {
    if (!secreto) {
      $('rp-par-w').style.display = 'flex';
      secreto = await R.vincularEquipo('pantalla', CLAVE, $('rp-par-w'));
    }
    $('rp-par-w').style.display = 'none'; $('tv').style.display = 'grid';
    version = null; estado = null;
    await ciclo();
    avisoSonido();
  }

  document.addEventListener('click', async () => {
    await R.desbloquearAudio(); R.pantallaCompleta(); R.noApagar();
    $('rp-sonido').style.display = 'none';
  });
  R.reloj($('tv-hora'), $('tv-fecha'));
  R.noApagar();
  setInterval(() => { if (secreto && !document.hidden) ciclo(); }, 2500);
  setInterval(() => { if (estado) pintar(false); }, 60000);   // recalcula textos de espera
  arrancar();
})();
</script>
</body>
</html>
